name: Glaggle Crawler Bot

on:
  workflow_dispatch: # Ermöglicht weiterhin das manuelle Starten
  schedule:
    # Läuft alle 30 Minuten (immer zur Minute 0 und 30)
    - cron: '*/5 * * * *'

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: pip install requests beautifulsoup4 supabase

      - name: Crawler ausführen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY1: ${{ secrets.SUPABASE_KEY1 }}
        run: python crawler.py
