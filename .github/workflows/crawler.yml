name: Glaggle Crawler Bot

on:
  workflow_dispatch: # Ermöglicht das manuelle Starten

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: pip install requests beautifulsoup4 supabase

      - name: Crawler ausführen
        env:
          # DIESER TEIL IST ENTSCHEIDEND:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY1: ${{ secrets.SUPABASE_KEY1 }}
        run: python crawler.py
