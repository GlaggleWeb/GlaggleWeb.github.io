name: Generate Commit List
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Create List
        run: git log --reverse --format='"%H",' | awk 'NR % 10 == 1' > commits.txt
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: commit-liste
          path: commits.txt
