<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Assistant - Live</title>
    <style>
        :root {
            --glaggle-blue: #4285f4;
            --glaggle-red: #ea4335;
            --glaggle-yellow: #fbbc05;
            --glaggle-green: #34a853;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .visualizer-container {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        .orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--glaggle-blue);
            filter: blur(15px);
            transition: all 0.3s ease;
            box-shadow: 0 0 30px var(--glaggle-blue);
        }
        .listening .orb {
            animation: pulse 1.5s infinite ease-in-out;
            background: var(--glaggle-green);
            box-shadow: 0 0 50px var(--glaggle-green);
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        h1 { font-weight: 300; letter-spacing: 2px; color: white; }
        button {
            padding: 15px 40px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: white;
            color: black;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #444; color: #888; }
        #status { margin-top: 20px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>GLAGGLE</h1>
    <div class="visualizer-container" id="visual-box">
        <div class="orb" id="orb"></div>
    </div>
    <button id="start-btn">Assistant starten</button>
    <p id="status">Klicke, um die Verbindung herzustellen...</p>
</div>

<script>
    /**
     * GLAGGLE ASSISTANT LOGIC
     * Benötigt: Gemini API Key mit Zugriff auf Multimodal Live API
     */
    
    const API_KEY = 'AIzaSyB-TLwaR7NocHcvnSCzcBCiF46VSaIEQXY'; 
    const MODEL = "gemini-2.0-flash-exp"; // Oder dein spezifisches Modell
    const URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.MultimodalLive?key=${API_KEY}`;

    const startBtn = document.getElementById('start-btn');
    const statusTxt = document.getElementById('status');
    const visualBox = document.getElementById('visual-box');
    
    let webSocket = null;
    let audioContext = null;
    let processor = null;
    let mediaStream = null;

    async function initAudio() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioContext.createMediaStreamSource(mediaStream);
        
        // Audio in Chunks schneiden (PCM16)
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        source.connect(processor);
        processor.connect(audioContext.destination);

        processor.onaudioprocess = (e) => {
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = floatTo16BitPCM(inputData);
                const base64Audio = arrayBufferToBase64(pcm16);
                
                webSocket.send(JSON.stringify({
                    realtime_input: {
                        media_chunks: [{
                            mime_type: "audio/pcm;rate=16000",
                            data: base64Audio
                        }]
                    }
                }));
            }
        };
    }

    function startAssistant() {
        startBtn.disabled = true;
        statusTxt.innerText = "Verbinde mit Glaggle-Server...";
        
        webSocket = new WebSocket(URL);

        webSocket.onopen = async () => {
            statusTxt.innerText = "Glaggle ist bereit. Sprich jetzt!";
            visualBox.classList.add('listening');
            await initAudio();
            
            // Initiales Setup (System Instruction)
            webSocket.send(JSON.stringify({
                setup: {
                    model: `models/${MODEL}`,
                    generation_config: { response_modalities: ["AUDIO"] },
                    system_instruction: { parts: [{ text: "Du bist Glaggle, ein lustiger, leicht tollpatschiger Assistant. Antworte immer kurz und per Audio." }] }
                }
            }));
        };

        webSocket.onmessage = async (event) => {
            const response = JSON.parse(event.data);
            
            // Wenn Audio-Daten zurückkommen
            if (response.serverContent && response.serverContent.modelTurn) {
                const parts = response.serverContent.modelTurn.parts;
                for (const part of parts) {
                    if (part.inlineData && part.inlineData.mimeType.includes("audio")) {
                        playAudioResponse(part.inlineData.data);
                    }
                }
            }
        };

        webSocket.onerror = (err) => {
            console.error(err);
            statusTxt.innerText = "Fehler: Verbindung fehlgeschlagen.";
        };
    }

    // Hilfsfunktionen für Audio-Konvertierung
    function floatTo16BitPCM(output) {
        let len = output.length;
        let buffer = new ArrayBuffer(len * 2);
        let view = new DataView(buffer);
        for (let i = 0; i < len; i++) {
            let s = Math.max(-1, Math.min(1, output[i]));
            view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return buffer;
    }

    function arrayBufferToBase64(buffer) {
        let binary = '';
        let bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        return window.btoa(binary);
    }

    async function playAudioResponse(base64Data) {
        const audioData = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0)).buffer;
        const buffer = await audioContext.decodeAudioData(audioData);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start();
    }

    startBtn.addEventListener('click', startAssistant);
</script>

</body>
</html>
