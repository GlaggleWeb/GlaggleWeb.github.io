<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Assistant 3.0</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .glaggle-orb {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00f2ff, #0062ff);
            border-radius: 50%;
            filter: blur(10px);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.4);
            transition: all 0.4s ease;
        }
        .listening {
            animation: pulse 1s infinite alternate;
            box-shadow: 0 0 80px rgba(0, 242, 255, 0.8);
            filter: blur(15px);
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
        #status {
            margin-top: 30px;
            color: #888;
            font-family: monospace;
            font-size: 14px;
        }
        button {
            background: white;
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }
        button:disabled { background: #333; color: #666; }
        .error-log { color: #ff4444; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="glaggle-orb" id="orb"></div>
    <h1 style="letter-spacing: 10px;">GLAGGLE</h1>
    <button id="start-btn">ASSISTANT STARTEN</button>
    <div id="status">Bereit...</div>
    <div id="error-display" class="error-log"></div>

<script>
    // --- KONFIGURATION AUS DEINEM DASHBOARD ---
    const API_KEY = "AIzaSyB-TLwaR7NocHcvnSCzcBCiF46VSaIEQXY"; // Dein Key
    const MODEL = "models/gemini-3-flash-live"; 
    // Wir nutzen v1beta, da v1alpha oft den 'Bad Response' Fehler bei Gemini 3 triggert
    const WS_URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.MultimodalLive?key=${API_KEY}`;

    const btn = document.getElementById('start-btn');
    const status = document.getElementById('status');
    const orb = document.getElementById('orb');
    const errorDisplay = document.getElementById('error-display');

    let ws;
    let audioCtx;
    let stream;

    btn.onclick = async () => {
        status.innerText = "Initialisiere Mikrofon...";
        errorDisplay.innerText = "";
        
        try {
            // Audio-Kontext starten
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            status.innerText = "Verbindung zu Gemini 3...";
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                status.innerText = "Glaggle ist bereit!";
                orb.classList.add('listening');
                btn.disabled = true;

                // Setup Frame senden
                const setup = {
                    setup: {
                        model: MODEL,
                        generation_config: { 
                            response_modalities: ["AUDIO"],
                            speech_config: {
                                voice_config: { prebuilt_voice_config: { voice_name: "Puck" } }
                            }
                        },
                        system_instruction: { 
                            parts: [{ text: "Du bist der Glaggle Assistant. Antworte immer kurz, lustig und charmant." }] 
                        }
                    }
                };
                ws.send(JSON.stringify(setup));
                startStreaming();
            };

            ws.onmessage = async (event) => {
                const response = JSON.parse(event.data);
                
                // Audio-Daten vom Server empfangen
                if (response.serverContent?.modelTurn?.parts) {
                    const audioPart = response.serverContent.modelTurn.parts.find(p => p.inlineData);
                    if (audioPart) {
                        playAudio(audioPart.inlineData.data);
                    }
                }

                // Fehler-Handling falls Google eine Nachricht schickt
                if (response.error) {
                    errorDisplay.innerText = "Google Fehler: " + response.error.message;
                    ws.close();
                }
            };

            ws.onerror = (e) => {
                status.innerText = "Verbindungsfehler!";
                errorDisplay.innerText = "Der Server hat die Verbindung abgelehnt (Bad Response). Prüfe deinen Key oder nutze einen USA-VPN.";
                console.error(e);
            };

            ws.onclose = () => {
                status.innerText = "Verbindung beendet.";
                orb.classList.remove('listening');
                btn.disabled = false;
            };

        } catch (err) {
            status.innerText = "Fehler!";
            errorDisplay.innerText = err.message;
        }
    };

    function startStreaming() {
        const source = audioCtx.createMediaStreamSource(stream);
        const processor = audioCtx.createScriptProcessor(4096, 1, 1);

        source.connect(processor);
        processor.connect(audioCtx.destination);

        processor.onaudioprocess = (e) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                }
                
                const base64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
                ws.send(JSON.stringify({
                    realtime_input: {
                        media_chunks: [{ mime_type: "audio/pcm;rate=16000", data: base64 }]
                    }
                }));
            }
        };
    }

    async function playAudio(base64) {
        const binary = atob(base64);
        const buffer = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) buffer[i] = binary.charCodeAt(i);
        
        const audioBuffer = await audioCtx.decodeAudioData(buffer.buffer).catch(e => null);
        if (audioBuffer) {
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            source.start();
        }
    }
</script>
</body>
</html>
