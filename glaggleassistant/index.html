<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Glaggle Debugger</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #log { border: 1px solid #0f0; padding: 10px; height: 300px; overflow-y: scroll; background: #050505; }
        .error { color: #ff5555; font-weight: bold; }
        button { background: #0f0; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Glaggle Live Debugger</h1>
    <button id="start-btn">Verbindung testen</button>
    <p>Status: <span id="status">Bereit</span></p>
    <div id="log">--- System Log ---<br></div>

<script>
    const logDiv = document.getElementById('log');
    const statusTxt = document.getElementById('status');
    const btn = document.getElementById('start-btn');

    function writeLog(msg, isError = false) {
        const span = document.createElement('span');
        if (isError) span.className = 'error';
        span.innerHTML = `> ${msg}<br>`;
        logDiv.appendChild(span);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    btn.onclick = () => {
        // HIER DEINEN NEUEN KEY EINSETZEN (Sicherheit!)
        const API_KEY = "AIzaSyB-TLwaR7NocHcvnSCzcBCiF46VSaIEQXY"; 
        const MODEL = "gemini-2.0-flash-exp"; 
        const URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.MultimodalLive?key=${API_KEY}`;

        writeLog("Starte Verbindung zu Google...");
        const ws = new WebSocket(URL);

        ws.onopen = () => {
            writeLog("WebSocket offen! Sende Setup-Frame...");
            statusTxt.innerText = "Verbunden";
            
            const setup = {
                setup: {
                    model: `models/${MODEL}`,
                    generation_config: { response_modalities: ["AUDIO"] }
                }
            };
            ws.send(JSON.stringify(setup));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            writeLog("Nachricht erhalten: " + JSON.stringify(data));
            
            // Falls der Server einen Fehler im JSON schickt
            if (data.error) {
                writeLog("GOOGLE FEHLER: " + data.error.message, true);
            }
        };

        ws.onerror = (e) => {
            writeLog("KRITISCH: WebSocket-Handshake fehlgeschlagen.", true);
            writeLog("Checke: 1. API Key gültig? 2. Modellname korrekt? 3. HTTPS genutzt?", true);
        };

        ws.onclose = (e) => {
            writeLog(`Verbindung geschlossen (Code: ${e.code}, Grund: ${e.reason || "Unbekannt"})`);
            statusTxt.innerText = "Getrennt";
        };
    };
</script>
</body>
</html>
