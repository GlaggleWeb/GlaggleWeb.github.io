<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Login</title>
    <meta name="description" content="Melde dich ohne Passwort mit deinem Glaggle-Account an.">
    <!-- Appwrite SDK v14 für Magic URL Support -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --nav-bg: #ffffff;
            --card-bg: #fdfdfd;
            --card-border: #eeeeee;
            --link-color: #2E94D1;
            --desc-color: #555555;
            --accent: #70C4F7;
            --accent-dark: #2E94D1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --nav-bg: #303134;
                --card-bg: #303134;
                --card-border: #444444;
                --link-color: #8cc9f5;
                --desc-color: #bdc1c6;
            }
        }

        body { 
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .box { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid var(--card-border); 
            width: 100%;
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        @media (max-width: 480px) {
            .box { padding: 30px 20px; }
        }

        .logo { width: 180px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--link-color); }
        p { font-size: 0.9rem; color: var(--desc-color); margin-bottom: 25px; line-height: 1.4; }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 12px; 
            border: 1px solid var(--card-border); 
            background: var(--bg-color); 
            color: var(--text-color); 
            box-sizing: border-box; 
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--accent); }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            margin-top: 15px; 
            transition: all 0.3s ease;
        }

        button:hover { background: var(--accent-dark); transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        #messageBox {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.4;
        }

        .loading-spinner {
            display: none;
            margin: 15px auto;
            border: 3px solid var(--card-border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <img src="../glagglelogooriginal.png" alt="Glaggle Logo" class="logo">
    
    <!-- Schritt 1: Benutzername oder E-Mail eingeben -->
    <div id="step1">
        <h1>Anmelden</h1>
        <p>Gib deinen Benutzernamen oder deine E-Mail-Adresse ein, um einen Login-Link per E-Mail zu erhalten.</p>
        <input type="text" id="identifier" placeholder="Benutzername oder E-Mail">
        <button id="btnSend" onclick="requestLoginLink()">Login-Link anfordern</button>
        <p style="margin-top: 20px; font-size: 0.8rem;">
            Noch kein Konto? <a href="../account/index.html" style="color: var(--link-color); text-decoration: none; font-weight: bold;">Registrieren</a>
        </p>
    </div>

    <!-- Schritt 2: E-Mail nach Klick auf den Magic Link bestätigen -->
    <div id="stepConfirm" style="display: none;">
        <h1>Fast da!</h1>
        <p>Klicke unten, um deine Anmeldung bei Glaggle zu bestätigen.</p>
        <button id="btnConfirm" onclick="confirmLoginLink()">Anmeldung bestätigen ✓</button>
    </div>

    <!-- Schritt 3: Erfolgreich eingeloggt -->
    <div id="stepSuccess" style="display: none;">
        <h1>🎉 Erfolgreich eingeloggt!</h1>
        <p>Du wirst in wenigen Sekunden weitergeleitet...</p>
    </div>

    <div class="loading-spinner" id="spinner"></div>
    <div id="messageBox"></div>
</div>

<script>
// --- APPWRITE KONFIGURATION ---
const client = new Appwrite.Client()
    .setEndpoint('https://cloud.appwrite.io/v1')
    .setProject('69fb638a002b7d03d829'); 

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DB_ID = '69fb65330007c1a1af0a';
const COLL_ID = 'accounts';

let isVerifying = false;

// Hilfsfunktion zur Anzeige von Fehlern und Erfolgen (Ersetzt window.alert)
function showMessage(text, isError = false) {
    const msgBox = document.getElementById('messageBox');
    msgBox.style.display = 'block';
    msgBox.innerText = text;
    if (isError) {
        msgBox.style.background = '#ffebee';
        msgBox.style.color = '#c62828';
        msgBox.style.border = '1px solid #ffcdd2';
    } else {
        msgBox.style.background = '#e8f5e9';
        msgBox.style.color = '#2e7d32';
        msgBox.style.border = '1px solid #c8e6c9';
    }
}

function hideMessage() {
    document.getElementById('messageBox').style.display = 'none';
}

function showLoading(state) {
    document.getElementById('spinner').style.display = state ? 'block' : 'none';
}

window.onload = async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');

    // Wenn Magic Link Parameter in der URL vorhanden sind
    if (userId && secret) {
        sessionStorage.setItem('magicUserId', userId);
        sessionStorage.setItem('magicSecret', secret);
        // Parameter aus URL entfernen für ein sauberes Erscheinungsbild
        window.history.replaceState({}, document.title, window.location.pathname);
        
        document.getElementById('step1').style.display = 'none';
        document.getElementById('stepConfirm').style.display = 'block';
    } else {
        // Prüfen, ob der Nutzer eventuell bereits angemeldet ist
        try {
            await account.get();
            // Wenn eingeloggt, direkt zur Hauptseite weiterleiten
            window.location.href = "../index.html";
        } catch (e) {
            // Nicht eingeloggt: Normales Anmeldeformular bleibt sichtbar
        }
    }
};

async function requestLoginLink() {
    hideMessage();
    const input = document.getElementById('identifier').value.trim();
    if (!input) return showMessage("Bitte gib einen Benutzernamen oder eine E-Mail ein.", true);

    showLoading(true);
    let targetEmail = "";

    try {
        if (input.includes('@')) {
            targetEmail = input;
        } else {
            // Benutzername in der Datenbank suchen, um die E-Mail abzurufen
            const response = await databases.listDocuments(DB_ID, COLL_ID, [
                Appwrite.Query.equal('userName', input)
            ]);

            if (response.documents.length > 0) {
                targetEmail = response.documents[0].userEmail;
            } else {
                throw new Error("Konto wurde nicht gefunden. Bitte registriere dich zuerst.");
            }
        }

        // Falls noch eine alte Sitzung existiert, diese vorher entfernen
        try { await account.deleteSession('current'); } catch(e) {}

        // Sichere eindeutige Token-ID generieren
        const userId = Appwrite.ID.unique();

        // Magic URL Token erstellen und senden
        await account.createMagicURLToken(userId, targetEmail, window.location.href);

        showMessage("E-Mail versendet! Bitte überprüfe dein Postfach und klicke auf den Bestätigungslink.", false);
        document.getElementById('btnSend').disabled = true;
        document.getElementById('btnSend').innerText = "Link gesendet...";

    } catch (error) {
        showMessage("Fehler: " + error.message, true);
    } finally {
        showLoading(false);
    }
}

async function confirmLoginLink() {
    if (isVerifying) return;

    hideMessage();
    const userId = sessionStorage.getItem('magicUserId');
    const secret = sessionStorage.getItem('magicSecret');

    if (!userId || !secret) {
        showMessage("Ungültiger oder abgelaufener Link. Bitte neu anfordern.", true);
        document.getElementById('stepConfirm').style.display = 'none';
        document.getElementById('step1').style.display = 'block';
        return;
    }

    isVerifying = true;
    showLoading(true);

    try {
        // Bereinigen bestehender Sitzungen vor Aktivierung der neuen
        try { await account.deleteSession('current'); } catch(e) {}

        await account.updateMagicURLSession(userId, secret);

        // Aufräumen
        sessionStorage.removeItem('magicUserId');
        sessionStorage.removeItem('magicSecret');

        document.getElementById('stepConfirm').style.display = 'none';
        document.getElementById('stepSuccess').style.display = 'block';

        // Automatische Weiterleitung nach 2 Sekunden
        setTimeout(() => {
            window.location.href = "../index.html";
        }, 2000);

    } catch (error) {
        showMessage("Der Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.", true);
        document.getElementById('stepConfirm').style.display = 'none';
        document.getElementById('step1').style.display = 'block';
    } finally {
        showLoading(false);
        isVerifying = false;
    }
}
</script>

</body>
</html>
