<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Login</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --nav-bg: #ffffff;
            --card-bg: #fdfdfd;
            --card-border: #eeeeee;
            --link-color: #2E94D1;
            --desc-color: #555555;
            --accent: #70C4F7;
            --accent-dark: #2E94D1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --nav-bg: #303134;
                --card-bg: #303134;
                --card-border: #444444;
                --link-color: #8cc9f5;
                --desc-color: #bdc1c6;
            }
        }

        body { 
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .box { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid var(--card-border); 
            width: 100%;
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .logo { width: 180px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--link-color); }
        p { font-size: 0.9rem; color: var(--desc-color); margin-bottom: 25px; line-height: 1.4; }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 12px; 
            border: 1px solid var(--card-border); 
            background: var(--bg-color); 
            color: var(--text-color); 
            box-sizing: border-box; 
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--accent); }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            margin-top: 15px; 
            transition: all 0.3s ease;
        }

        button:hover { background: var(--accent-dark); transform: translateY(-2px); }
        
        .secondary-btn {
            background: none;
            color: var(--desc-color);
            font-size: 0.8rem;
            text-decoration: underline;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }

        .loading-spinner {
            display: none;
            margin: 15px auto;
            border: 3px solid var(--card-border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <img src="glagglelogo.png" alt="Glaggle Logo" class="logo">
    
    <div id="step1">
        <h1>Anmelden</h1>
        <p>Nutze deine GlaggleID, deinen Benutzernamen oder deine E-Mail Adresse.</p>
        <input type="text" id="identifier" placeholder="ID, Name oder E-Mail">
        <button onclick="checkUser()">Weiter</button>
        <p style="margin-top: 20px; font-size: 0.8rem;">
            Noch kein Konto? <a href="index.html" style="color: var(--link-color); text-decoration: none; font-weight: bold;">Registrieren</a>
        </p>
    </div>

    <div id="step2" style="display: none;">
        <h1 id="welcomeUser">Willkommen!</h1>
        <p>Bitte gib dein Passwort ein, um dich anzumelden.</p>
        <input type="password" id="password" placeholder="Passwort">
        <button onclick="login()">Einloggen</button>
        <button class="secondary-btn" onclick="goBack()">Anderes Konto verwenden</button>
    </div>

    <div class="loading-spinner" id="spinner"></div>
</div>

<script>
// --- APPWRITE KONFIGURATION ---
const client = new Appwrite.Client()
    .setEndpoint('https://cloud.appwrite.io/v1')
    .setProject('69fb638a002b7d03d829'); 

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DB_ID = '69fb65330007c1a1af0a';
const COLL_ID = 'accounts';

let resolvedEmail = "";

// Prüfen, ob User bereits eingeloggt ist
window.onload = async () => {
    try {
        await account.get();
        // Wenn eingeloggt, leite zum Dashboard weiter
        window.location.href = "dashboard.html"; 
    } catch (e) {
        // Nicht eingeloggt, bleibe auf Login-Seite
    }
};

async function checkUser() {
    const input = document.getElementById('identifier').value.trim();
    if (!input) return alert("Bitte gib eine ID oder einen Namen ein.");

    showLoading(true);
    try {
        if (input.includes('@')) {
            // Es ist direkt eine E-Mail
            resolvedEmail = input;
            document.getElementById('welcomeUser').innerText = "Hallo!";
        } else {
            // Suche in der Datenbank nach GlaggleID oder Username
            let queryField = isNaN(input) ? 'userName' : 'glaggleId';
            let searchValue = isNaN(input) ? input : parseInt(input);

            const response = await databases.listDocuments(DB_ID, COLL_ID, [
                Appwrite.Query.equal(queryField, searchValue)
            ]);

            if (response.documents.length > 0) {
                const userDoc = response.documents[0];
                resolvedEmail = userDoc.userEmail;
                document.getElementById('welcomeUser').innerText = "Hallo " + userDoc.userName + "!";
            } else {
                throw new Error("Konto wurde nicht gefunden.");
            }
        }

        // Wechsle zum Passwort-Feld
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('password').focus();

    } catch (error) {
        alert(error.message);
    } finally {
        showLoading(false);
    }
}

async function login() {
    const password = document.getElementById('password').value;
    if (!password) return alert("Bitte Passwort eingeben.");

    showLoading(true);
    try {
        // Erstellt die Session (bleibt dank Appwrite-SDK automatisch gespeichert)
        await account.createEmailPasswordSession(resolvedEmail, password);
        
        // Erfolg: Weiterleitung
        // Statt zu dashbord.html zu springen, gehen wir zur Hauptseite zurück
        window.location.href = "../index.html";
    } catch (error) {
        alert("Login fehlgeschlagen: Passwort falsch oder Konto-Problem.");
    } finally {
        showLoading(false);
    }
}

function goBack() {
    document.getElementById('step1').style.display = 'block';
    document.getElementById('step2').style.display = 'none';
    resolvedEmail = "";
}

function showLoading(state) {
    document.getElementById('spinner').style.display = state ? 'block' : 'none';
}
</script>

</body>
</html>
