<!DOCTYPE html>
<html lang="de">
<head>
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Glaggle | Glame AI Chatbot & Glaggle Games</title>
    
    <meta name="description" content="Glaggle your life! Nutze den intelligenten Glame AI Chatbot und spiele spannende Games wie das Glaggle Zahlenraten. Jetzt kostenlos auf glaggle.ch entdecken.">
    
    <meta name="keywords" content="Glaggle, Glame, AI Chatbot, KI Chatbot, Zahlenraten, Glaggle Spiel, glaggle.ch">
    
    <meta property="og:title" content="Glaggle | Glame AI Chatbot & Games">
    <meta property="og:description" content="Dein smarter Begleiter und Spielspaß auf glaggle.ch.">
    <meta property="og:image" content="https://glaggle.ch/glagglelogo.png">
    <meta property="og:url" content="https://glaggle.ch">
    
    <meta name="author" content="Glaggle">
    <link rel="icon" type="image/png" href="favicon.ico?v=2">

    <link rel="canonical" href="https://glaggle.ch">
    <style>
        body {
            background-color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem); 
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin-bottom: 40px;
            mix-blend-mode: multiply;
        }

        .button-container {
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center;
        }

        .web-button {
            display: inline-block; 
            padding: 15px 30px;  
            background-color: #70C4F7;
            color: white; 
            text-decoration: none; 
            font-weight: bold;
            border-radius: 50px; 
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
            min-width: 200px;
        }

        .web-button:hover {
            background-color: #2E94D1;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .button-container {
                flex-direction: column;
                width: 100%;
            }
            .web-button {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <h1>Glaggle your life!</h1>
    <img src="glagglelogo.png" alt="Glaggle Logo" class="logo">

    <div class="button-container">
        <a href="https://glaggle.ch/glame" class="web-button">
            Glame Chatbot →
        </a>
        
        <a href="https://glaggle.ch/zahlenraten" class="web-button">
            Glaggle Zahlenraten →
        </a>
    </div>
    
</body>
</html>
