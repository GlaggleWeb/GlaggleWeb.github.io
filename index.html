<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Glaggle | The AI-Powered Search Engine</title>
    <link rel="shortcut icon" href="favicon.ico?v=3" type="image/x-icon">
    <link rel="canonical" href="https://glaggle.ch">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            background: #ffffff;
        }
        .logo-landing {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        form {
            width: 90%;
            max-width: 550px;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.9);
            border: 2px solid #70C4F7;
            border-radius: 30px;
            padding: 5px 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 14px 10px;
            font-size: 18px;
            background: transparent;
        }
        button {
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
        }
        button::before {
            content: "";
            display: block;
            width: 24px;
            height: 24px;
            background-color: #70C4F7;
            -webkit-mask: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/%3E%3C/svg%3E") no-repeat center;
            mask: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/%3E%3C/svg%3E") no-repeat center;
            mask-size: contain;
        }
    </style>
</head>
<body>
    <img src="glagglelogoclicky.png" alt="Glaggle" class="logo-landing">
    <form id="landingForm" action="javascript:void(0);">
        <input type="search" id="landingQuery" placeholder="The AI-Powered Searchmachine..." autocomplete="off" autofocus>
        <button type="submit" aria-label="Suche"></button>
    </form>

    <script>
        document.getElementById('landingForm').addEventListener('submit', function() {
            const q = document.getElementById('landingQuery').value.trim();
            if (!q) return;
            window.location.href = "https://glaggle.ch/search?q=" + encodeURIComponent(q);
        });
    </script>
</body>
</html>
