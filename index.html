        }

        .nav-button {

            color: white;
            background-color: #8cc9f5;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.3s;

        .nav-button:hover {

        /* HAUPTINHALT */

            text-align: center;

            flex-direction: column;
            align-items: center;
            width: 100%;

        }

        .large-logo {

            gap: 20px;

<style>
    /* Spezifisches Styling für die Suche im Glaggle-Style */
    .search-section {
        width: 100%;
        max-width: 600px;
        margin-bottom: 30px;
    }

    .search-bar-container {
        display: flex;
        align-items: center;
        background: white;
        border: 1px solid #dfe1e5;
        border-radius: 30px;
        padding: 5px 20px;
        transition: box-shadow 0.3s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .search-bar-container:focus-within {
        box-shadow: 0 4px 15px rgba(112, 196, 247, 0.4);
        border-color: #70C4F7;
    }

    #glaggleQuery {
        flex: 1;
        border: none;
        outline: none;
        padding: 12px;
        font-size: 18px;
        font-family: inherit;
    }

    .search-icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 20px;
        color: #70C4F7;
    }

    .results-container {
        margin-top: 30px;
        text-align: left;
        width: 100%;
    }

    .glaggle-entry {
        background: #fdfdfd;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 15px;
        border: 1px solid #eee;
        transition: transform 0.2s;
    }

    .glaggle-entry:hover {
        transform: scale(1.02);
        border-color: #70C4F7;
    }

    .glaggle-entry a {
        color: #2E94D1;
        text-decoration: none;
        font-size: 1.2rem;
        font-weight: bold;
    }

    .glaggle-entry p {
        color: #555;
        font-size: 0.95rem;
        margin: 8px 0 0 0;
    }

    .loader {
        display: none;
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #70C4F7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }

.search-icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

/* Die Lupe als SVG - so wird sie perfekt Glaggle-Blau */
.search-icon-btn::before {
    content: "";
    display: inline-block;
    width: 24px;
    height: 24px;
    background-color: #70C4F7; /* Dein Glaggle-Blau */
    /* Hier wird die Lupe als Maske definiert */
    -webkit-mask: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/%3E%3C/svg%3E") no-repeat center;
    mask: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/%3E%3C/svg%3E") no-repeat center;
    -webkit-mask-size: contain;
    mask-size: contain;
}
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
async function glaggleSearch() {
    const query = document.getElementById('glaggleQuery').value;
    const resultsDiv = document.getElementById('glaggleResults');
    const loader = document.getElementById('glaggleLoader');

    if (!query) return;

    // KI-Fix & Such-Optimierung
    let finalQuery = query.toLowerCase().trim();
    if (finalQuery === "ki") finalQuery = "Künstliche Intelligenz";
    if (finalQuery === "google") finalQuery = "Google Suchmaschine offiziell";

    resultsDiv.innerHTML = "";
    loader.style.display = "block";

    try {
        // Wir nutzen hier den "no_redirect" Parameter, um DDG-interne Links zu minimieren
        const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(finalQuery)}&format=json&no_redirect=1&no_html=1&skip_disambig=1`);
        const data = await response.json();

        loader.style.display = "none";
        let resultsFound = 0;
        const addedLinks = new Set();

        function add(title, text, rawUrl) {
            if (!rawUrl) return;
            
            // FILTER: Wir blockieren Links, die "duckduckgo.com" im Namen haben
            if (rawUrl.includes("duckduckgo.com") && !finalQuery.includes("duckduckgo")) {
                return; 
            }

            const cleanUrl = getCleanUrl(rawUrl);
            if (cleanUrl && !addedLinks.has(cleanUrl) && resultsFound < 30) {
                renderResult(title, text, cleanUrl);
                addedLinks.add(cleanUrl);
                resultsFound++;
            }
        }

        // 1. Das Haupt-Ergebnis (Abstract)
        if (data.AbstractURL) {
            add(data.Heading, data.AbstractText, data.AbstractURL);
        }

        // 2. Die Related Topics durchsuchen
        if (data.RelatedTopics) {
            data.RelatedTopics.forEach(item => {
                // Manchmal sind Ergebnisse in "Topics" Gruppen versteckt
                if (item.Topics) {
                    item.Topics.forEach(sub => {
                        if (sub.FirstURL) add(extractTitle(sub.Text), sub.Text, sub.FirstURL);
                    });
                } else if (item.FirstURL) {
                    add(extractTitle(item.Text), item.Text, item.FirstURL);
                }
            });
        }

        // 3. Notfall-Option: Wenn gar nichts kommt, verlinke auf eine neutrale Suche
        if (resultsFound === 0) {
            resultsDiv.innerHTML = `
                <div class="glaggle-entry">
                    <p>Glaggle hat keine direkten Deep-Links gefunden. Möchtest du die externe Suche für <b>"${query}"</b> öffnen?</p>
                    <br>
                    <a href="https://www.bing.com/search?q=${encodeURIComponent(query)}" target="_blank" class="web-button" style="display:inline-block; min-width:auto;">Auf Bing suchen →</a>
                </div>`;
        }

    } catch (e) {
        loader.style.display = "none";
        resultsDiv.innerHTML = "<p>Fehler beim Abrufen der Web-Daten.</p>";
    }
}

// Hilfsfunktion zum Säubern der URL
function getCleanUrl(url) {
    try {
        if (url.includes('uddg=')) {
            let realUrl = url.split('uddg=')[1].split('&')[0];
            return decodeURIComponent(realUrl);
        }
        return url;
    } catch(e) { return url; }
}
</script>
