    /* NAVIGATION */

    /* HAUPTINHALT */
    .main-content { margin-top: 120px; padding: 20px; text-align: center; width: 100%; max-width: 800px; box-sizing: border-box; }

    /* --- HIER SIND DEINE GEWÜNSCHTEN ÄNDERUNGEN --- */

/* Den echten Strich unsichtbar machen */
#glaggleQuery {
    caret-color: transparent;
}

.search-bar-container {
    position: relative; /* WICHTIG: Damit der Cursor im Balken bleibt */
    display: flex; 
    align-items: center; 
    background: var(--input-bg);
    border: 1px solid #dfe1e5; 
    border-radius: 30px; 
    padding: 5px 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 60px;
    transition: all 0.5s ease-in-out;
}

.custom-caret {
    position: absolute;
    width: 3px;
    height: 24px;
    background: linear-gradient(180deg, #4285F4, #EA4335, #FBBC05, #34A853, #FF6D00);
    background-size: 100% 300%;
    pointer-events: none;
    z-index: 10;
    border-radius: 5px;
    animation: glaggleFlow 3s infinite alternate ease-in-out;
    display: none;
    /* Vertikale Zentrierung innerhalb des Containers */
    top: 50%;
    transform: translateY(-50%);
}
/* Die Farben wandern sanft auf und ab */
@keyframes glaggleFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 0% 100%; }
}

/* Styling für den KI-Optimierer Button */

.ai-magic-btn:hover {

/* Verhindert, dass der Button das Layout zerschießt */

/* Spezielles Styling für offizielle Projekte */

<script>
const p1 = "gsk_"; 
const p2 = "FAnwmg4IMqrAexyzdupqWGdyb"; 
const p3 = "3FYiivhNRW9aQu5VibY0j0eKQ5r"; 

function getGKey() { return p1 + p2 + p3; }

function createAiPlaceholder() {
    const aiBox = document.createElement('div');
    aiBox.className = 'glaggle-entry';
    aiBox.id = "ai-container";
    aiBox.style.borderRadius = "25px"; // Abgerundet wie gewünscht
    aiBox.style.borderLeft = "5px solid #70C4F7";
    aiBox.style.background = "linear-gradient(90deg, var(--card-bg), rgba(112, 196, 247, 0.05))";
    aiBox.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
            <span style="font-size:1.2rem;">✨</span>
            <strong style="color:var(--link-color);">Glaggle AI Zusammenfassung</strong>
        </div>
        <p id="ai-text" style="font-style: italic; color: var(--desc-color);">Glaggle denkt nach...</p>
    `;
    return aiBox;
}

async function glaggleSearch() {
    const query = document.getElementById('glaggleQuery').value.trim();
    const resultsDiv = document.getElementById('glaggleResults');
    const loader = document.getElementById('glaggleLoader');
    
    if (!query) return;

    resultsDiv.innerHTML = "";
    loader.style.display = "block";

    // --- NEU: WIDGET CHECK ---
    const widgetShown = checkWidgets(query);

    // 1. KI-Box erstellen
    resultsDiv.appendChild(createAiPlaceholder());

    try {
        // 2. Alles parallel starten
        await Promise.all([
            fetchGroqAI(query),
            (async () => {
                const favs = await getAiProcessedFavs(query);
                favs.forEach(res => renderResult(res.title, res.desc, res.url, "fav"));
            })(),
            searchWikipedia(query, 'de')
        ]);

    } catch (e) {
        console.error("Suche fehlgeschlagen:", e);
    } finally {
        loader.style.display = "none";
    }
}
// WICHTIG: Diese Funktion hat gefehlt oder war nicht aktiv
async function searchWikipedia(query, lang) {
    try {
        // Erweiterte URL für Thumbnails und Snippets
        const url = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=200&exintro&explaintext&exsentences=2&format=json&origin=*`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if(data.query && data.query.pages) {
            Object.values(data.query.pages).forEach(page => {
                const wikiUrl = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;
                const thumb = page.thumbnail ? page.thumbnail.source : null;
                
                // Wir bauen das Bild direkt in den Text ein
                const content = thumb 
                    ? `<img src="${thumb}" style="float:left; margin:0 15px 10px 0; border-radius:8px; width:80px; height:auto;">${page.extract}` 
                    : page.extract;

                renderResult(page.title, content, wikiUrl, "wiki");
            });
        }
    } catch (e) { console.error("Wiki Fehler", e); }
}

async function fetchGroqAI(query) {
    const aiTextElement = document.getElementById('ai-text');
    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({ 
                model: "llama-3.1-8b-instant", 
                messages: [
                    { role: "system", content: "Du bist Glaggle AI. Antworte kurz, präzise und hilfreich auf Deutsch. Erkläre das Thema selbstständig." },
                    { role: "user", content: query }
                ] 
            })
        });
        const data = await res.json();
        const antwort = data.choices[0].message.content;

        aiTextElement.style.fontStyle = "normal";
        let i = 0; let currentText = "";
        function type() {
            if (i < antwort.length) {
                currentText += antwort.charAt(i);
                aiTextElement.innerHTML = marked.parse(currentText);
                i++; setTimeout(type, 1);
            }
        }
        type();
    } catch (e) { aiTextElement.innerText = "Zusammenfassung momentan nicht verfügbar."; }
}

async function getAiProcessedFavs(query) {
    const q = query.toLowerCase().trim();
    if (q.length < 3) return []; 

    // Sofort-Check in favoriten.js
    const sofort = meineLieblingsSeiten.filter(s => s.title.toLowerCase().includes(q));

    try {
        const context = meineLieblingsSeiten.map(s => `App: ${s.title}, Info: ${s.desc}`).join(" | ");
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.1-8b-instant",
                messages: [{ role: "system", content: `Suche in: [${context}]. Gib passende Apps als JSON-Array zurück.` }, { role: "user", content: q }]
            })
        });
        const data = await res.json();
        const content = data.choices[0].message.content;
        const aiFavs = JSON.parse(content.substring(content.indexOf("["), content.lastIndexOf("]") + 1));
        
        const gesamt = [...sofort];
        aiFavs.forEach(af => { if(!gesamt.find(g => g.title === af.title)) gesamt.push(af); });
        return gesamt;
    } catch(e) { return sofort; }
}

function renderResult(title, text, url, type = "web") {
    const resultsDiv = document.getElementById('glaggleResults');
    const domain = new URL(url).hostname.replace('www.', '');
    const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
    
    const div = document.createElement('div');
    
    // Wenn es ein Favorit ist, weisen wir die spezielle Klasse zu
    if(type === "fav") {
        div.className = 'glaggle-entry fav-project';
    } else {
        div.className = 'glaggle-entry';
    }

    div.innerHTML = `
        <div class="result-header">
            <img src="${favicon}" class="favicon" onerror="this.style.display='none'">
            <small style="color: #34a853; font-weight:bold;">${type === "fav" ? "✨ GLAGGLE AI EMPFIEHLT!" : domain}</small>
        </div>
        <a href="${url}" target="_blank" style="${type === 'fav' ? 'font-size: 1.3rem;' : ''}">${title}</a>
        <p>${text.replace(/<\/?[^>]+(>|$)/g, "")}</p>
    `;
    
    const aiBox = document.getElementById('ai-container');
    // Favoriten immer direkt unter der KI-Box anzeigen
    if (type === "fav" && aiBox) {
        aiBox.after(div);
    } else {
        resultsDiv.appendChild(div);
    }
}

const input = document.getElementById('glaggleQuery');
const container = document.querySelector('.search-bar-container');
// Wir suchen gezielt das Caret im Container
const fakeCaret = container.querySelector('.custom-caret');

function updateCaret() {
    if (document.activeElement === input) {
        fakeCaret.style.display = 'block';
        
        const inputStyle = window.getComputedStyle(input);
        const measurementSpan = document.createElement('span');
        
        // Stile kopieren
        measurementSpan.style.font = inputStyle.font;
        measurementSpan.style.letterSpacing = inputStyle.letterSpacing;
        measurementSpan.style.textTransform = inputStyle.textTransform;
        measurementSpan.style.whiteSpace = 'pre';
        measurementSpan.style.visibility = 'hidden';
        measurementSpan.style.position = 'absolute';
        
        // Text bis zum Cursor
        measurementSpan.textContent = input.value.substring(0, input.selectionStart);
        document.body.appendChild(measurementSpan);
        
        const textWidth = measurementSpan.offsetWidth;
        
        // BERECHNUNG KORRIGIERT:
        // Wir nehmen die Position des Inputs + das Padding von links + die Textbreite
        const paddingLeft = parseFloat(inputStyle.paddingLeft) || 0;
        fakeCaret.style.left = (input.offsetLeft + paddingLeft + textWidth) + 'px';
        
        document.body.removeChild(measurementSpan);
    } else {
        fakeCaret.style.display = 'none';
    }
}

// Events für die Live-Verfolgung
['input', 'click', 'keyup', 'focus', 'selectionchange'].forEach(event => {
    input.addEventListener(event, updateCaret);
});

input.addEventListener('blur', () => {
    setTimeout(() => { fakeCaret.style.display = 'none'; }, 150);
});

// Initial aufrufen
updateCaret();

// --- 2. KI SUCHOPTIMIERUNG ---
async function optimizeSearch() {
    const query = input.value.trim();
    if (!query) return;

    const magicBtn = document.querySelector('.ai-magic-btn');
    magicBtn.innerText = "⏳"; // Lade-Status

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({ 
                model: "llama-3.1-8b-instant", 
                messages: [
                    { role: "system", content: "Du bist ein Suchmaschinen-Optimierer. Formuliere die Suchanfrage des Nutzers so um, dass sie bessere Ergebnisse liefert. Antworte NUR mit der neuen Anfrage, kein Smalltalk. Bsp. der benutzer schreibt KI du wandelst es dan in Künsliche Intelligenz um. Du formulierst in max.2-4 Wörter um." },
                    { role: "user", content: query }
                ] 
            })
        });
        const data = await res.json();
        const optimizedQuery = data.choices[0].message.content.replace(/"/g, ''); // Anführungszeichen entfernen
        
        input.value = optimizedQuery;
        updateCaret();
        glaggleSearch(); // Starte Suche direkt mit dem neuen Begriff
    } catch (e) {
        console.error("Optimierung fehlgeschlagen", e);
    } finally {
        magicBtn.innerText = "✨";
    }
}

    function checkWidgets(query) {
    const q = query.toLowerCase();
    const resultsDiv = document.getElementById('glaggleResults');

    // --- RECHNER ---
    // Prüft auf Zahlen und Operatoren (z.B. 5 + 5)
    if (/^[\d\s\+\-\*\/\(\)\.]+$/.test(q) && /[\+\-\*\/]/.test(q)) {
        try {
            const result = eval(q); 
            renderWidget("🧮 Rechner", `Das Ergebnis von <strong>${q}</strong> ist:`, `<h1 style="margin:0; color:#70C4F7;">${result}</h1>`);
            return true;
        } catch(e) {}
    }

    // --- TIMER ---
    if (q.includes("timer") || q.includes("stoppuhr")) {
        const mins = q.match(/\d+/) ? parseInt(q.match(/\d+/)[0]) : 5;
        renderTimerWidget(mins);
        return true;
    }

    // --- WETTER (Simuliert für das Beispiel) ---
    if (q.includes("wetter")) {
        const city = q.replace("wetter", "").replace("in", "").trim() || "deinem Standort";
        renderWidget("☁️ Wetter", `Wetter für <strong>${city}</strong>`, `
            <div style="display:flex; align-items:center; gap:20px; justify-content:center;">
                <span style="font-size:3rem;">☀️</span>
                <span style="font-size:2rem; font-weight:bold;">22°C</span>
            </div>
            <p style="margin:5px 0 0 0;">Heiter bis sonnig - Glaggle-Tag!</p>
        `);
        return true;
    }

    return false;
}

// Universal-Funktion für einfache Widgets
function renderWidget(title, subtitle, content) {

}

// Spezielles Widget für den Timer
function renderTimerWidget(minutes) {
    const resultsDiv = document.getElementById('glaggleResults');
    let seconds = minutes * 60;
    
    const div = document.createElement('div');
    div.className = 'glaggle-entry fav-project';
    div.innerHTML = `
        <strong style="color:var(--link-color);">⏱️ Glaggle Timer</strong>
        <div style="text-align:center; padding:10px;">
            <h1 id="timer-display" style="font-size:3rem; margin:10px 0;">${minutes}:00</h1>
            <button id="timer-btn" class="nav-button" style="background:#34A853;">Start</button>
        </div>
    `;
    resultsDiv.prepend(div);

    let interval = null;
    const btn = div.querySelector('#timer-btn');
    const display = div.querySelector('#timer-display');

    btn.onclick = () => {
        if (interval) {
            clearInterval(interval);
            interval = null;
            btn.innerText = "Start";
            btn.style.background = "#34A853";
        } else {
            btn.innerText = "Stop";
            btn.style.background = "#EA4335";
            interval = setInterval(() => {
                seconds--;
                let m = Math.floor(seconds / 60);
                let s = seconds % 60;
                display.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (seconds <= 0) {
                    clearInterval(interval);
                    alert("Glaggle! Zeit abgelaufen!");
                }
            }, 1000);
        }
    };
}
