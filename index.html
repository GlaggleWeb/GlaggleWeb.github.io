.custom-caret {
    position: absolute;
    width: 3px;
    height: 24px;
    background: linear-gradient(180deg, #4285F4, #EA4335, #FBBC05, #34A853, #FF6D00);
    background-size: 100% 300%;
    pointer-events: none;
    z-index: 1;
    border-radius: 5px;

@keyframes glaggleFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 0% 100%; }
}

function getGKey() { return p1 + p2 + p3; }

function createAiPlaceholder() {
    const aiBox = document.createElement('div');
    aiBox.className = 'glaggle-entry';
    aiBox.id = "ai-container";
    aiBox.style.borderRadius = "25px"; // Abgerundet wie gewünscht

}

document.getElementById('glaggleQuery').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {

async function glaggleSearch() {
    const query = document.getElementById('glaggleQuery').value.trim();
    if (!query) return;

    // 1. Benachrichtigungen nur anfragen, wenn nötig und möglich
    // Auf iOS funktioniert das oft nur, wenn die Seite vom Home-Bildschirm gestartet wird!
    if (window.Notification && Notification.permission === "default") {
        Notification.requestPermission().catch(console.error);
    }

    const resultsDiv = document.getElementById('glaggleResults');
    const loader = document.getElementById('glaggleLoader');
    
    resultsDiv.innerHTML = "";
    loader.style.display = "block";

    checkWidgets(query);
    resultsDiv.appendChild(createAiPlaceholder());

    try {
        // Verwende Promise.allSettled statt Promise.all
        // So bricht die ganze Suche nicht ab, wenn z.B. Wikipedia down ist
        await Promise.allSettled([
            fetchGroqAI(query),
            (async () => {
                try {
                    const favs = await getAiProcessedFavs(query);
                    if(favs) favs.forEach(res => renderResult(res.title, res.desc, res.url, "fav"));
                } catch (e) { console.error("Fav-Fehler", e); }
            })(),
            searchWikipedia(query, 'de').catch(e => console.error("Wiki-Fehler", e))
        ]);

    } catch (e) {
        console.error("Kritischer Fehler:", e);
    } finally {
        loader.style.display = "none";
    }
}
// WICHTIG: Diese Funktion hat gefehlt oder war nicht aktiv
async function searchWikipedia(query, lang) {
    try {
        // Erweiterte URL für Thumbnails und Snippets
        const url = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=200&exintro&explaintext&exsentences=2&format=json&origin=*`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if(data.query && data.query.pages) {
            Object.values(data.query.pages).forEach(page => {
                const wikiUrl = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;
                const thumb = page.thumbnail ? page.thumbnail.source : null;
                
                // Wir bauen das Bild direkt in den Text ein
                const content = thumb 
                    ? `<img src="${thumb}" style="float:left; margin:0 15px 10px 0; border-radius:8px; width:80px; height:auto;">${page.extract}` 
                    : page.extract;

                renderResult(page.title, content, wikiUrl, "wiki");
            });
        }
    } catch (e) { console.error("Wiki Fehler", e); }
}

async function fetchGroqAI(query) {
    const aiTextElement = document.getElementById('ai-text');
    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({ 
                model: "llama-3.1-8b-instant", 
                messages: [
                    { role: "system", content: "Du bist Glaggle AI. Antworte kurz, präzise und hilfreich auf Deutsch. Erkläre das Thema selbstständig." },
                    { role: "user", content: query }
                ] 
            })
        });
        const data = await res.json();
        const antwort = data.choices[0].message.content;

        aiTextElement.style.fontStyle = "normal";
        let i = 0; let currentText = "";
        function type() {
            if (i < antwort.length) {
                currentText += antwort.charAt(i);
                aiTextElement.innerHTML = marked.parse(currentText);
                i++; setTimeout(type, 1);
            }
        }
        type();
    } catch (e) { aiTextElement.innerText = "Zusammenfassung momentan nicht verfügbar."; }
}

async function getAiProcessedFavs(query) {
    const q = query.toLowerCase().trim();
    if (q.length < 3) return []; 

    // Sofort-Check in favoriten.js
    const sofort = meineLieblingsSeiten.filter(s => s.title.toLowerCase().includes(q));

    try {
        const context = meineLieblingsSeiten.map(s => `App: ${s.title}, Info: ${s.desc}`).join(" | ");
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.1-8b-instant",
                messages: [{ role: "system", content: `Suche in: [${context}]. Gib passende Apps als JSON-Array zurück.` }, { role: "user", content: q }]
            })
        });
        const data = await res.json();
        const content = data.choices[0].message.content;
        const aiFavs = JSON.parse(content.substring(content.indexOf("["), content.lastIndexOf("]") + 1));
        
        const gesamt = [...sofort];
        aiFavs.forEach(af => { if(!gesamt.find(g => g.title === af.title)) gesamt.push(af); });
        return gesamt;
    } catch(e) { return sofort; }
}

const input = document.getElementById('glaggleQuery');
const container = document.querySelector('.search-bar-container');
// Wir suchen gezielt das Caret im Container
const fakeCaret = container.querySelector('.custom-caret');

function updateCaret() {
    // Prüfen, ob das Element überhaupt existiert, bevor wir darauf zugreifen
    if (!fakeCaret) return; 

    if (document.activeElement === input) {
        fakeCaret.style.display = 'block';
        
        const inputStyle = window.getComputedStyle(input);
        const measurementSpan = document.createElement('span');
        
        measurementSpan.style.font = inputStyle.font;
        measurementSpan.style.letterSpacing = inputStyle.letterSpacing;
        measurementSpan.style.textTransform = inputStyle.textTransform;
        measurementSpan.style.whiteSpace = 'pre';
        measurementSpan.style.visibility = 'hidden';
        measurementSpan.style.position = 'absolute';
        
        measurementSpan.textContent = input.value.substring(0, input.selectionStart);
        document.body.appendChild(measurementSpan);
        
        const textWidth = measurementSpan.offsetWidth;
        const paddingLeft = parseFloat(inputStyle.paddingLeft) || 0;
        fakeCaret.style.left = (input.offsetLeft + paddingLeft + textWidth) + 'px';
        
        document.body.removeChild(measurementSpan);
    } else {
        fakeCaret.style.display = 'none';
    }
}

// Events für die Live-Verfolgung
['input', 'click', 'keyup', 'focus', 'selectionchange'].forEach(event => {
    input.addEventListener(event, updateCaret);
});

input.addEventListener('blur', () => {
    setTimeout(() => { fakeCaret.style.display = 'none'; }, 150);
});

// Initial aufrufen
updateCaret();

const mathRegex = /^[0-9+\-*/().\s^%]+$/;

function renderTimerWidget(initialMinutes) {
    const resultsDiv = document.getElementById('glaggleResults');
    let totalSeconds = initialMinutes * 60;
    let interval = null;

    const div = document.createElement('div');
    div.className = 'glaggle-entry fav-project';
    div.style.textAlign = 'center';
    
    div.innerHTML = `
        <div style="margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; color: var(--link-color); text-transform: uppercase; font-size: 0.75rem;">Glaggle Timekeeper</div>
        
        <div style="margin: 15px 0;">
            <input type="text" id="timer-display-input" value="${formatTime(totalSeconds)}" 
                style="background: transparent; border: none; color: var(--text-color); font-size: 4.5rem; font-family: sans-serif; text-align: center; width: 100%; outline: none; font-weight: 800; letter-spacing: -2px;">
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px;">
            ${[0.5, 1, 3, 5, 10, 15, 30, 60].map(m => `
                <button class="quick-btn" data-sec="${m * 60}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.8rem; font-weight: bold;">
                    ${m < 1 ? '30s' : m >= 60 ? '1h' : m + 'm'}
                </button>
            `).join('')}
        </div>

        <div style="display: flex; gap: 12px; justify-content: center;">
            <button id="timer-run-btn" style="padding: 14px 35px; border-radius: 35px; border: none; background: #34A853; color: white; font-weight: bold; cursor: pointer; min-width: 140px; box-shadow: 0 4px 10px rgba(52, 168, 83, 0.3);">START</button>
            <button id="timer-clear-btn" style="padding: 14px 20px; border-radius: 35px; border: 1px solid var(--card-border); background: transparent; color: var(--text-color); cursor: pointer;">RESET</button>
        </div>
        
        <audio id="timer-audio-element" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    `;
    
    resultsDiv.prepend(div);

    const displayInput = div.querySelector('#timer-display-input');
    const runBtn = div.querySelector('#timer-run-btn');
    const clearBtn = div.querySelector('#timer-clear-btn');
    const audio = div.querySelector('#timer-audio-element');
    const quickBtns = div.querySelectorAll('.quick-btn');

    function formatTime(sec) {
        let m = Math.floor(sec / 60);
        let s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // WICHTIG: Erfasst manuelles Tippen sofort
    function syncInput() {
        const val = displayInput.value;
        if (val.includes(':')) {
            const [m, s] = val.split(':').map(v => parseInt(v) || 0);
            totalSeconds = (m * 60) + s;
        } else {
            totalSeconds = (parseInt(val) || 0) * 60;
        }
    }

    displayInput.oninput = syncInput;

    function triggerAlarm() {
        audio.play().catch(e => console.log("Audio braucht Nutzerinteraktion"));
        div.style.animation = "pulse-red 1.5s infinite";
        runBtn.innerText = "ALARM STOPPEN";
        runBtn.style.background = "#EA4335";

        // Notification Logik
        if (Notification.permission === "granted") {
            new Notification("Glaggle Timer", { body: "Zeit ist abgelaufen!", icon: "favicon.ico" });
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") new Notification("Glaggle Timer", { body: "Zeit ist abgelaufen!" });
            });
        }
    }

    runBtn.onclick = () => {
        // Falls Alarm läuft: Stoppen
        if (!audio.paused) {
            audio.pause();
            audio.currentTime = 0;
            div.style.animation = "none";
            runBtn.innerText = "START";
            runBtn.style.background = "#34A853";
            return;
        }

        if (interval) {
            clearInterval(interval);
            interval = null;
            runBtn.innerText = "WEITER";
            runBtn.style.background = "#34A853";
        } else {
            syncInput(); // Letzte manuelle Änderung übernehmen
            if (totalSeconds <= 0) return;
            
            runBtn.innerText = "PAUSE";
            runBtn.style.background = "#FBBC05";
            
            interval = setInterval(() => {
                totalSeconds--;
                displayInput.value = formatTime(totalSeconds);
                if (totalSeconds <= 0) {
                    clearInterval(interval);
                    interval = null;
                    triggerAlarm();
                }
            }, 1000);
        }
    };

    clearBtn.onclick = () => {
        clearInterval(interval);
        interval = null;
        audio.pause();
        audio.currentTime = 0;
        div.style.animation = "none";
        totalSeconds = 0;
        displayInput.value = "00:00";
        runBtn.innerText = "START";
        runBtn.style.background = "#34A853";
    };

    quickBtns.forEach(btn => {
        btn.onclick = () => {
            totalSeconds += parseInt(btn.dataset.sec);
            displayInput.value = formatTime(totalSeconds);
        };
    });
}
function renderCalculatorWidget(initialQuery) {
    const resultsDiv = document.getElementById('glaggleResults');
    const div = document.createElement('div');
    div.className = 'glaggle-entry fav-project';
    div.style.maxWidth = "350px"; // App-Format
    div.style.margin = "0 auto 20px auto";

    div.innerHTML = `

        <div style="background: var(--input-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 15px; text-align: right;">
            <div id="calc-history" style="font-size: 0.8rem; opacity: 0.6; min-height: 1.2em;"></div>
            <div id="calc-display" style="font-size: 2rem; font-family: 'Courier New', monospace; overflow: hidden; white-space: nowrap;">${initialQuery || '0'}</div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;" id="calc-buttons">
            <button class="calc-btn" data-val="C" style="background:#EA4335; color:white;">C</button>
            <button class="calc-btn" data-val="(">(</button>
            <button class="calc-btn" data-val=")">)</button>
            <button class="calc-btn" data-val="/" style="background:var(--nav-bg); color:var(--link-color);">÷</button>
            
            <button class="calc-btn" data-val="7">7</button>
            <button class="calc-btn" data-val="8">8</button>
            <button class="calc-btn" data-val="9">9</button>
            <button class="calc-btn" data-val="*" style="background:var(--nav-bg); color:var(--link-color);">×</button>
            
            <button class="calc-btn" data-val="4">4</button>
            <button class="calc-btn" data-val="5">5</button>
            <button class="calc-btn" data-val="6">6</button>
            <button class="calc-btn" data-val="-" style="background:var(--nav-bg); color:var(--link-color);">-</button>
            
            <button class="calc-btn" data-val="1">1</button>
            <button class="calc-btn" data-val="2">2</button>
            <button class="calc-btn" data-val="3">3</button>
            <button class="calc-btn" data-val="+" style="background:var(--nav-bg); color:var(--link-color);">+</button>
            
            <button class="calc-btn" data-val="0" style="grid-column: span 2;">0</button>
            <button class="calc-btn" data-val=".">.</button>
            <button class="calc-btn" data-val="=" style="background:#34A853; color:white;">=</button>
        </div>
    `;

    resultsDiv.prepend(div);

    const display = div.querySelector('#calc-display');
    const history = div.querySelector('#calc-history');
    let currentInput = initialQuery || "";

    // Event Delegation für die Buttons
    div.querySelector('#calc-buttons').onclick = (e) => {
        const val = e.target.dataset.val;
        if (!val) return;

        if (val === "C") {
            currentInput = "";
            display.innerText = "0";
            history.innerText = "";
        } else if (val === "=") {
            try {
                const result = Function('"use strict";return (' + currentInput.replace(/x/g, '*') + ')')();
                history.innerText = currentInput + " =";
                currentInput = result.toString();
                display.innerText = currentInput;
            } catch (e) {
                display.innerText = "Fehler";
                currentInput = "";
            }
        } else {
            if (display.innerText === "0" || display.innerText === "Fehler") {
                currentInput = val;
            } else {
                currentInput += val;
            }
            display.innerText = currentInput;
        }
    };

    // Style für die Buttons
    const buttons = div.querySelectorAll('.calc-btn');
    buttons.forEach(btn => {
        Object.assign(btn.style, {
            padding: "15px 5px",
            borderRadius: "8px",
            border: "1px solid var(--card-border)",
            cursor: "pointer",
            fontWeight: "bold",
            fontSize: "1rem",
            transition: "0.2s"
        });
        btn.onmouseover = () => btn.style.filter = "brightness(0.9)";
        btn.onmouseout = () => btn.style.filter = "brightness(1)";
    });

    // Direkt berechnen, wenn initial eine Formel da war
    if (initialQuery) {
        div.querySelector('[data-val="="]').click();
    }
}
