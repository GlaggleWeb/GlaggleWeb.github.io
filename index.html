    <style>
        body {
            background-color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem); 
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin-bottom: 40px;
            mix-blend-mode: multiply;
        }

        .button-container {
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center;
        }

        .web-button {
            display: inline-block; 
            padding: 15px 30px;  
            background-color: #70C4F7;
            color: white; 
            text-decoration: none; 
            font-weight: bold;
            border-radius: 50px; 
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
            min-width: 200px;
        }

        .web-button:hover {
            background-color: #2E94D1;
            transform: scale(1.05);
        }

       /* Globale Einstellungen für den sauberen Look */
/* Grundlegende Bereinigung */
body {
  margin: 0;
  padding: 0;
  font-family: 'Arial Rounded MT Bold', sans-serif;
}

/* Die Navbar über die volle Breite */
.navbar {
  display: flex;
  align-items: center;
  justify-content: flex-start; /* Logo und Links starten links */
  width: 100%;
  background-color: #ffffff;
  padding: 20px 50px; /* Mehr Platz nach oben und unten */
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Weicherer, tieferer Schatten */
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  box-sizing: border-box;
}

/* LOGO GRÖSSE: Hier stellst du ein, wie groß es sein soll */
.logo-img {
  height: 110px; /* Deutlich größer (vorher war es oft nur 40-50px) */
  width: auto;
  transition: transform 0.3s ease;
  cursor: pointer;
}

/* Kleiner Effekt beim Drüberfahren mit der Maus */
.logo-img:hover {
  transform: scale(1.05);
}

/* Die Link-Liste */
.nav-links {
  display: flex;
  list-style: none;
  margin: 0;
  padding: 0;
  margin-left: 50px; /* Großer Abstand zum Logo */
}

.nav-links li {
  margin-right: 20px;
}

/* Buttons im Glaggle-Stil */
.nav-links a {
  text-decoration: none;
  color: white;
  background-color: #8cc9f5;
  padding: 15px 30px; /* Größere Buttons */
  border-radius: 40px; /* Schön rund */
  font-weight: bold;
  font-size: 16px;
  transition: all 0.3s ease;
  display: inline-block;
}

.nav-links a:hover {
  background-color: #7ab8e6;
  box-shadow: 0 5px 15px rgba(140, 201, 245, 0.4);
}

/* Platzhalter für den Rest der Seite */
.content-spacer {
  height: 120px; /* Muss so hoch sein wie die Navbar */
}

        @media (max-width: 600px) {
            .button-container {
                flex-direction: column;
                width: 100%;
            }
            .web-button {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

            Glaggle Zahlenraten →
        </a>
    </div>
    
</body>
