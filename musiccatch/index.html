<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Music Catch</title>
    <style>
        :root {
            --bg-color: #1a0b2e;
            --text-color: #ffffff;
            --nav-bg: #2a1b41;
            --card-bg: #2a1b41;
            --card-border: #9d4edd;
            --accent: #ff9e00;
            --danger: #FF6B6B;
            --coin-gold: #FFD700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Wichtig für eigene Touch-Steuerung */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 500px; 
            background: linear-gradient(to top, #2a1b41, #1a0b2e);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px);
            padding: 20px;
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #cc7a00; margin-bottom: 10px;
            width: 200px;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #cc7a00; }

        .btn-secondary {
            background: transparent !important;
            border: 2px solid var(--accent) !important;
            box-shadow: none !important;
            margin-top: 5px;
            color: var(--accent) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .btn-secondary:active {
            background: rgba(255, 158, 0, 0.1) !important;
            transform: scale(0.98);
        }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .coin-img { width: 24px; height: 24px; object-fit: contain; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); border-color: #FFD700; }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="color: var(--accent); font-weight: bold;">Music Catch</div>
        <div style="font-size: 24px;">🎵</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Punkte <b id="score">0</b></div>
            <div class="score-val">Rekord <b id="highscore">0</b></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">🎵 Music Catch</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.9; text-align: center;">
                    Tippe auf die Note, bevor sie den Boden berührt!<br>
                    Sie wird immer schneller.<br><br>
                    <span style="color: var(--accent);">Alle 20 Noten = 1 Glaggle Coin!</span>
                </p>
                
                <button class="btn" onclick="startGame(event)">Starten</button>

                <a href="https://glaggle.ch/gamecenter" class="btn btn-secondary">
                    Game Center 🏠
                </a>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="coin.png" class="coin-img" alt="Coin" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <button id="music-toggle" onclick="toggleMusic(event)" style="position: fixed; bottom: 20px; left: 20px; background: var(--nav-bg); border: 2px solid var(--accent); color: white; padding: 10px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; font-size: 20px;">
    🔊
    </button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu-overlay');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const container = document.getElementById('game-container');

        let gameRunning = false;
        let score = 0;
        
        // Highscore Key für Music Catch
        const HS_KEY = 'musiccatch_highscore';
        let highscore = parseInt(localStorage.getItem(HS_KEY)) || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;

        highscoreEl.innerText = highscore;
        coinEl.innerText = coins;

        // Musik Setup
        const bgMusic = new Audio('https://res.cloudinary.com/pyxlc0q4/video/upload/soulprodmusic-dance-mood-132148_rv3opu.mp3'); 
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        let musicActive = true;

        function toggleMusic(e) {
            if(e) e.stopPropagation();
            const btn = document.getElementById('music-toggle');
            if (!bgMusic.paused) {
                bgMusic.pause();
                btn.innerText = "🔈";
                musicActive = false;
            } else {
                bgMusic.play().catch(err => console.log("Audio blockiert"));
                btn.innerText = "🔊";
                musicActive = true;
            }
        }

        // Note Objekt
        const note = {
            x: 0, 
            y: 0, 
            radius: 50, // Sehr große Hitbox für Mobile
            speed: 0
        };

        const groundHeight = 40;
        let baseSpeed = 2.5;
        
        let particles = [];
        let clickEffects = [];

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function spawnNote() {
            // Zufällige X-Position, unter Berücksichtigung der Ränder
            note.x = Math.random() * (canvas.width - 100) + 50;
            note.y = -50; // Startet leicht über dem Bildschirm
            
            // Note wird mit jedem Punkt minimal schneller
            note.speed = baseSpeed + (score * 0.15);
        }

        function catchNote() {
            score++;
            scoreEl.innerText = score;
            
            // Effekt spawnen (Note wird orange und wächst)
            clickEffects.push({
                x: note.x, 
                y: note.y, 
                life: 1.0, 
                scale: 1.5 // Start-Skalierung für den Effekt
            });
            
            // Partikel spawnen (spicken weg)
            for(let i = 0; i < 20; i++) {
                particles.push({
                    x: note.x, 
                    y: note.y,
                    vx: (Math.random() - 0.5) * 16, // Schnellere Streuung
                    vy: (Math.random() - 0.5) * 16,
                    size: Math.random() * 5 + 3,
                    life: 1.0
                });
            }

            // Jeden 10. Punkt einen Glaggle Coin geben
            if (score % 20 === 0) {
                coins++;
                localStorage.setItem('glaggleCoins', coins);
                coinEl.innerText = coins;
                document.getElementById('coin-display').classList.add('pulse');
                setTimeout(() => document.getElementById('coin-display').classList.remove('pulse'), 500);
            }

            // Sofort neue Note spawnen
            spawnNote();
        }

        function handleInput(clientX, clientY) {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            // Umrechnung der Koordinaten (wichtig für responsive/mobile)
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            
            // Abstand zur Note berechnen
            const dist = Math.hypot(x - note.x, y - note.y);
            
            // Hitbox-Prüfung (etwas größer als die sichtbare Note für besseres Spielgefühl)
            if (dist < note.radius * 1.8) {
                catchNote();
            }
        }

        // Event Listener für Klick und Touch
        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Verhindert Scrollen beim Tippen
            if(e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        function startGame(e) {
            if(e) e.stopPropagation();
            
            if (musicActive) {
                bgMusic.play().catch(() => console.log("Audio braucht Nutzerinteraktion..."));
            }

            score = 0;
            scoreEl.innerText = score;
            gameRunning = true;
            menu.style.display = "none";
            
            particles = [];
            clickEffects = [];
            
            spawnNote();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if(!gameRunning) return;

            // Note nach unten bewegen
            note.y += note.speed;

            // Partikel updaten
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= 0.04;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            // Klick-Effekte (verblassende orange Noten) updaten
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                clickEffects[i].life -= 0.05;
                clickEffects[i].scale += 0.05;
                if (clickEffects[i].life <= 0) clickEffects.splice(i, 1);
            }

            // Prüfen, ob Note den Boden berührt hat (Game Over)
            if (note.y + (note.radius/2) > canvas.height - groundHeight) {
                gameOver();
                return; // Loop stoppen
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function draw() {
            // Hintergrund löschen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Boden (grünlich/braun wie in der Vorlage, aber an das Space-Theme angepasst)
            ctx.fillStyle = "#2a1b41";
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Leuchtende Kante für den Boden
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--card-border').trim();
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 4);

            const accentColor = getComputedStyle(document.body).getPropertyValue('--accent').trim();

            // Geklickte (orange) Noten zeichnen
            clickEffects.forEach(ce => {
                ctx.save();
                ctx.translate(ce.x, ce.y);
                ctx.scale(ce.scale, ce.scale);
                ctx.globalAlpha = ce.life;
                ctx.shadowBlur = 25;
                ctx.shadowColor = accentColor;
                ctx.fillStyle = accentColor;
                
                // Noten-Zeichnung (verbesserte, glatte Form)
                ctx.beginPath();
                ctx.ellipse(-2, 14, 12, 9, -0.2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillRect(7, -20, 4, 34); // Hals bündig anliegend
                ctx.beginPath(); // Sanft geschwungenes Fähnchen
                ctx.moveTo(11, -20);
                ctx.bezierCurveTo(25, -15, 25, 0, 11, 10);
                ctx.bezierCurveTo(18, 0, 18, -10, 11, -8);
                ctx.fill();
                
                ctx.restore();
            });

            // Partikel zeichnen (orange)
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = accentColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = accentColor;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });

            // Fallende Note Zeichnen (Weiß)
            ctx.save();
            ctx.translate(note.x, note.y);
            ctx.scale(1.5, 1.5); // Etwas größer gemacht
            
            // Leuchteffekt (weiß)
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffffff';

            // Noten-Kopf (weiß, glatt)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(-2, 14, 12, 9, -0.2, 0, Math.PI*2);
            ctx.fill();

            // Noten-Hals
            ctx.fillRect(7, -20, 4, 34);

            // Noten-Fähnchen (glatte Bézier-Kurve)
            ctx.beginPath();
            ctx.moveTo(11, -20);
            ctx.bezierCurveTo(25, -15, 25, 0, 11, 10);
            ctx.bezierCurveTo(18, 0, 18, -10, 11, -8);
            ctx.fill();

            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            
            if (score > highscore) {
                highscore = score;
                localStorage.setItem(HS_KEY, highscore);
                highscoreEl.innerText = highscore;
                document.getElementById('msg').innerHTML = "🏆 NEUER REKORD!<br><span style='color:var(--accent)'>" + score + " Punkte</span>";
            } else {
                document.getElementById('msg').innerHTML = "💀 VERFEHLT!<br>Punkte: " + score;
            }
            
            // Letztes Bild zeichnen
            draw();
            menu.style.display = "flex";
        }
    </script>
</body>
</html>
