<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Racing</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent: #70C4F7;
            --card-bg: #fdfdfd;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --card-bg: #303134;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0; overflow: hidden; touch-action: none;
            display: flex; flex-direction: column; align-items: center;
        }

        #game-container {
            position: relative;
            width: 300px;
            height: 500px;
            background: #444;
            border-left: 5px dashed white;
            border-right: 5px dashed white;
            margin-top: 50px;
            overflow: hidden;
        }

        .lane-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.3);
        }

        #player {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 90px;
            background: var(--accent);
            border-radius: 10px;
            transition: left 0.15s ease-out;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px;
            z-index: 10;
        }

        .obstacle {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff4444;
            border-radius: 5px;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px;
        }

        /* NEU: Glaggle Meldung (Modal) */
        #glaggle-popup {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; /* Standardmäßig versteckt */
            align-items: center; justify-content: center;
            z-index: 3000;
        }

        .popup-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            border: 4px solid var(--accent);
            text-align: center;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-retry {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* Touch Zonen */
        .touch-zone {
            position: absolute;
            top: 0; width: 50%; height: 100%; z-index: 20;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        #coin-container {
            position: fixed; bottom: 20px; right: 20px; 
            background: var(--card-bg); border: 2px solid var(--accent); 
            padding: 10px 20px; border-radius: 50px; 
            display: flex; align-items: center; gap: 10px; z-index: 1000;
        }
        @keyframes pop { 0% {transform: scale(1);} 50% {transform: scale(1.3);} 100% {transform: scale(1);} }
        .coin-animation { animation: pop 0.5s ease; }
    </style>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
    </div>

    <div id="game-container">
        <div id="left-zone" class="touch-zone"></div>
        <div id="right-zone" class="touch-zone"></div>
        <div class="lane-line" style="left: 100px;"></div>
        <div class="lane-line" style="left: 200px;"></div>
        <div id="player">🚗</div>
    </div>

    <div id="coin-container">
        <img src="coin.png" style="width:24px; height:24px;" alt="Coin"> 
        <span id="coin-count">0</span>
    </div>

    <div id="glaggle-popup">
        <div class="popup-content">
            <h2 id="popup-title" style="margin-top: 0; color: var(--accent);">Crash!</h2>
            <p id="popup-text">Leider verloren.</p>
            <button class="btn-retry" onclick="location.reload()">Nochmal!</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const coinCountEl = document.getElementById('coin-count');
        const popup = document.getElementById('glaggle-popup');
        const popupText = document.getElementById('popup-text');
        const popupTitle = document.getElementById('popup-title');

        const lanes = [20, 120, 220]; 
        let currentLane = 1;
        let score = 0;
        let speed = 5;
        let gameActive = true;
        let bestScore = localStorage.getItem('racingBest') || 0;

        player.style.left = lanes[currentLane] + 'px';
        bestEl.innerText = bestScore;
        coinCountEl.innerText = localStorage.getItem('glaggleCoins') || 0;

        function move(dir) {
            if(!gameActive) return;
            currentLane = Math.max(0, Math.min(2, currentLane + dir));
            player.style.left = lanes[currentLane] + 'px';
        }

        document.getElementById('left-zone').onclick = () => move(-1);
        document.getElementById('right-zone').onclick = () => move(1);
        
        // Touch support
        document.getElementById('left-zone').ontouchstart = (e) => { e.preventDefault(); move(-1); };
        document.getElementById('right-zone').ontouchstart = (e) => { e.preventDefault(); move(1); };

        function showGlaggleMessage(title, text) {
            popupTitle.innerText = title;
            popupText.innerText = text;
            popup.style.display = 'flex';
        }

        function createObstacle() {
            if(!gameActive) return;
            const obs = document.createElement('div');
            obs.className = 'obstacle';
            obs.innerHTML = '🚧';
            const lane = Math.floor(Math.random() * 3);
            obs.style.left = (lanes[lane] + 5) + 'px';
            obs.style.top = '-100px';
            container.appendChild(obs);

            let pos = -100;
            const interval = setInterval(() => {
                if(!gameActive) { clearInterval(interval); obs.remove(); return; }
                pos += speed;
                obs.style.top = pos + 'px';

                if(pos > 380 && pos < 470 && lane === currentLane) gameOver();

                if(pos > 500) {
                    score++;
                    scoreEl.innerText = score;
                    speed += 0.08;
                    obs.remove();
                    clearInterval(interval);
                }
            }, 20);
        }

        let obsSpawner = setInterval(createObstacle, 1400);

        function gameOver() {
            gameActive = false;
            clearInterval(obsSpawner);
            
            if(score > bestScore) localStorage.setItem('racingBest', score);

            if(score >= 5) {
                earnCoin();
            } else {
                showGlaggleMessage("Crash!", `Score: ${score}. Du brauchst 5 Punkte für einen Coin!`);
            }
        }

        function earnCoin() {
            let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;
            coins++;
            localStorage.setItem('glaggleCoins', coins);
            coinCountEl.innerText = coins;
            document.getElementById('coin-container').classList.add('coin-animation');
            
            showGlaggleMessage("Sieg!", `Score: ${score}. Du hast 1 Glaggle Coin verdient!`);
        }
    </script>
</body>
</html>
