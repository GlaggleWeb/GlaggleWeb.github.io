<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Juggling Master</title>
    <style>
        :root {
            --bg-color: #0b2d41;
            --text-color: #ffffff;
            --nav-bg: #1a4b66;
            --card-bg: #1a4b66;
            --card-border: #2E94D1;
            --accent: #70C4F7;
            --grass: #2ecc71;
            --danger: #FF6B6B;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 450px; 
            background: linear-gradient(to bottom, #1a4b66, #0b2d41);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; /* Höherer Z-Index */
            backdrop-filter: blur(4px);
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 16px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #2E94D1; margin-bottom: 10px;
            width: 220px; /* Etwas breiter für Finger */
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            z-index: 30; /* Sicherstellen, dass oben */
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #2E94D1; }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div style="font-size: 24px;">⚽</div>
        <div style="color: var(--accent); font-weight: bold;">Glaggle Soccer</div>
        <div style="font-size: 24px;">🐙</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Jongliert <b id="score">0</b></div>
            <div class="score-val">Rekord <b id="highscore">0</b></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">⚽ Glaggle Juggle!</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.8;">Tippe den Ball an!</p>
                <!-- onclick und ontouchend für maximale Kompatibilität -->
                <button class="btn" onclick="startGame(event)" ontouchend="startGame(event)">Anpfiff!</button>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <span style="color:gold">🪙</span>
        <span id="coin-count">0</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu-overlay');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const container = document.getElementById('game-container');

        let gameRunning = false;
        let score = 0;
        let highscore = localStorage.getItem('glaggleSoccerHighscore') || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;

        highscoreEl.innerText = highscore;
        coinEl.innerText = coins;

        const ball = {
            x: 0, y: 0, radius: 25,
            vx: 0, vy: 0,
            gravity: 0.25,
            rotation: 0,
            vRotation: 0
        };

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function handleInteraction(e) {
            // Verhindert, dass das Spiel reagiert, wenn das Menü offen ist
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            // Unterstützung für Maus und Touch
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            const dist = Math.sqrt((clickX - ball.x)**2 + (clickY - ball.y)**2);
            
            if (dist < ball.radius + 25) {
                ball.vy = -9;
                ball.vx = (ball.x - clickX) * 0.45;
                ball.vRotation = ball.vx * 0.12;
                
                score++;
                scoreEl.innerText = score;
                createParticles(ball.x, ball.y);
            }
        }

        // Gamepad/Canvas Inputs
        container.addEventListener('mousedown', handleInteraction);
        container.addEventListener('touchstart', (e) => {
            if (!gameRunning) return; 
            e.preventDefault(); // Verhindert Scrollen beim Spielen
            handleInteraction(e);
        }, {passive: false});

        let particles = [];
        function createParticles(x, y) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: i % 2 === 0 ? '#70C4F7' : '#ffffff'
                });
            }
        }

        function startGame(e) {
            if(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            score = 0;
            scoreEl.innerText = "0";
            ball.x = canvas.width / 2;
            ball.y = 100;
            ball.vx = 0;
            ball.vy = 0;
            ball.vRotation = 0;
            particles = [];
            gameRunning = true;
            menu.style.display = "none";
            
            // Loop nur starten, wenn nicht bereits aktiv
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if(!gameRunning) return;

            ball.vy += ball.gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.rotation += ball.vRotation;

            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx *= -0.7;
                ball.vRotation *= -1;
                ball.x = ball.x - ball.radius < 0 ? ball.radius : canvas.width - ball.radius;
            }

            if (ball.y + ball.radius > canvas.height) {
                gameOver();
                return;
            }

            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= -0.5;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);

            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#000";
            for(let i=0; i<5; i++) {
                ctx.rotate((Math.PI * 2) / 5);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(ball.radius * 0.6, -ball.radius * 0.3);
                ctx.lineTo(ball.radius * 0.6, ball.radius * 0.3);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(-7, -5, 3, 0, Math.PI * 2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(7, -5, 3, 0, Math.PI * 2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(0, 5, 6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); 
            
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(46, 204, 113, 0.3)";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
                if(p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1.0;
            drawBall();
        }

        function gameOver() {
            gameRunning = false;
            
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('glaggleSoccerHighscore', highscore);
                highscoreEl.innerText = highscore;
                document.getElementById('msg').innerText = "🏆 Neuer Rekord!";
            } else {
                document.getElementById('msg').innerText = "Aus! Score: " + score;
            }

            if (score > 0) {
                let earned = Math.floor(score / 5) + 1;
                coins += earned;
                localStorage.setItem('glaggleCoins', coins);
                coinEl.innerText = coins;
            }

            menu.style.display = "flex";
        }
    </script>
</body>
</html>
