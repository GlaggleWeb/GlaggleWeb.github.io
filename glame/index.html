<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Glame - Dein Chatbot">
    <meta name="keywords" content="Glame, Chatbot, Glaggle">
    <meta name="author" content="Glaggle">
    <title>Glame</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-wrapper {
            width: 100%;
            max-width: 400px;
            height: 500px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        #chat-header {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        #chat-window {
            flex: 1;
            padding: 15px;
            background: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bot-msg, .user-msg {
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot-msg {
            align-self: flex-start;
            background: #008C9C;
            color: #FFFFFF;
        }

        .user-msg {
            align-self: flex-end;
            background: #B00000;
            color: white;
            border-radius: 20px;
            border-bottom-right-radius: 2px;
        }

        #chat-input-area {
            display: flex;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
            transition: border 0.3s;
        }

        #user-input:focus {
            border-color: #008C9C;
        }

        #send-btn {
            background: #008C9C;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.5s;
        }

        #send-btn:hover {
            background: #00616E;
        }
    </style>
    <script>
async function antwortSenden() {
    const inputField = document.getElementById("user-input");
    const chatWindow = document.getElementById("chat-window");
    const text = inputField.value.trim();

    if (text === "") return;

    // Nachricht anzeigen
    chatWindow.innerHTML += `<div class="user-msg">${text}</div>`;
    inputField.value = "";
    chatWindow.scrollTop = chatWindow.scrollHeight;

    const botMsgId = "bot-" + Date.now();
    chatWindow.innerHTML += `<div class="bot-msg" id="${botMsgId}"><b>Glame:</b> ...</div>`;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu"; // Hier nur den Teil nach gsk_ einfügen
        
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + p1 + p2,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: text }]
            })
        });

        const data = await response.json();
        const antwort = data.choices[0].message.content;
        document.getElementById(botMsgId).innerHTML = `<b>Glame:</b> ${antwort}`;

    } catch (error) {
        document.getElementById(botMsgId).innerHTML = `<b>Glame:</b> Verbindung unterbrochen.`;
    }
    chatWindow.scrollTop = chatWindow.scrollHeight;
}
    </script>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <div id="bot-logo-wrapper" style="width: 30px; height: 30px; background: #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
            <img src="glagglesonne.png" 
                 alt="Glame" 
                 style="width: 100%; height: 100%; object-fit: cover;"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='G';">
        </div>
        
        <span style="margin-left: 10px;">Glame 1.5</span>
        
        <div id="status-dot"></div>
    </div> <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame. Wie kann ich dir heute helfen?</div>
    </div>

    <div id="chat-input-area">
        <input type="text" id="user-input" placeholder="Chatte mit Glame 1.5" autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

</body>
</html>
