<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Glame - Dein Chatbot">
    <meta name="keywords" content="Glame, Chatbot, Glaggle">
    <meta name="author" content="Glaggle">
    <title>Glame</title>
    <style>
        /* 1. GRUNDGERÜST */
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 2. DER CHAT-CONTAINER */
        #chat-wrapper {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            max-height: 750px;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            margin: 20px auto;
        }

        /* 3. HEADER */
        #chat-header {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* 4. DAS NACHRICHTEN-FENSTER */
        #chat-window {
            flex: 1;
            padding: 15px;
            background: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* 5. SPRECHBLASEN-DESIGN */
        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            max-width: 85%;
            width: fit-content;
            display: block;
            position: relative;
            animation: FadeIn 0.4s ease-out forwards; 
        }

        .bot-msg {
            align-self: flex-start;
            background: #008C9C;
            color: white;
            border-bottom-left-radius: 4px;
        }

        /* Stellt sicher, dass Fettgedrucktes im Bot-Feld sichtbar ist */
        .bot-msg b {
            font-weight: 800;
            color: #ffffff;
        }

        /* Erzeugt Abstände bei Zeilenumbrüchen */
        .bot-msg br {
            display: block;
            margin-bottom: 8px;
            content: "";
        }

        .user-msg {
            align-self: flex-end;
            background: #B00000;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* 6. EINGABE-BEREICH */
        #chat-input-area {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            gap: 10px;
            flex-shrink: 0;
        }

        #user-input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            transition: all 0.5s ease-in-out;
        }

        #user-input:focus {
            border: 3px solid #00616E; 
        }

        #send-btn {
            background: #008C9C;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.5s ease-in-out;
            flex-shrink: 0;
        }

        #send-btn:hover { background: #00616E; }

        /* 7. ANIMATIONEN & CURSOR */
        @keyframes FadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 7. ANIMATIONEN & LOGO-CURSOR */
.typing-cursor::after {
    content: ""; /* Kein Text-Symbol mehr */
    display: inline-block;
    width: 18px;  /* Größe der kleinen Sonne */
    height: 18px;
    background: url('glagglesonne.png') no-repeat center center;
    background-size: contain;
    margin-left: 5px;
    vertical-align: middle;
    animation: blink 0.8s infinite, pulse 1.5s infinite ease-in-out;
}

/* 7. ANIMATIONEN & SPEZIAL-EFFEKTE */

/* Das Logo im Header drehen lassen */
.loading-spin {
    animation: spin-logo 2s linear infinite;
}

@keyframes spin-logo {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Die Cursor-Sonne im Text: Blinken und Pulsieren kombiniert */
.typing-cursor::after {
    content: "";
    display: inline-block;
    width: 18px;
    height: 18px;
    background: url('glagglesonne.png') no-repeat center center;
    background-size: contain;
    margin-left: 5px;
    vertical-align: middle;
    /* Hier werden beide Animationen gleichzeitig aufgerufen */
    animation: blink-soft 0.8s infinite, pulse 1.5s infinite ease-in-out;
}

/* Sanftes Blinken (edler als hartes An/Aus) */
@keyframes blink-soft {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* Leichtes Vergrößern/Verkleinern */
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

/* Standard Fade-In für die Sprechblasen beim Erscheinen */
@keyframes FadeIn {
    from { 
        opacity: 0; 
        transform: translateY(20px); 
    }
    to { 
        opacity: 1; 
        transform: translateY(0); 
    }
}

        /* 8. MOBILE OPTIMIERUNG */
        @media (max-width: 500px) {
            #chat-wrapper {
                width: 100%;
                height: 100dvh;
                max-height: none;
                border-radius: 0;
                margin: 0;
            }
        }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <div id="bot-logo-wrapper" style="width: 30px; height: 30px; background: #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
            <img src="glagglesonne.png" alt="Glame" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'; this.parentElement.innerHTML='G';">
        </div>
        <span style="margin-left: 10px;">Glame 2.1</span>
    </div> 
    
    <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame. Wie kann ich dir heute helfen?</div>
    </div>

    <div id="chat-input-area">
        <input type="text" id="user-input" placeholder="Chatte mit Glame 2.1" autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

<script>
<script>
// Chatverlauf mit System-Anweisung
let chatVerlauf = [
    { role: "system", content: "Du bist Glame, der freundliche Chatbot von glaggle.ch." }
];

// --- TYPING-FUNKTION (Mit 1 Sekunde Extra-Zeit für die Sonne) ---
function typeWriter(element, text, speed = 10) {
    let i = 0;
    element.innerHTML = ""; 
    element.classList.add("typing-cursor"); 
    
    function typing() {
        if (i < text.length) {
            // HTML-Tags (wie <b> oder <br>) sofort einfügen
            if (text.charAt(i) === '<') {
                let tagEnd = text.indexOf('>', i);
                element.innerHTML += text.substring(i, tagEnd + 1);
                i = tagEnd + 1;
            } else {
                element.innerHTML += text.charAt(i);
                i++;
            }
            
            const chatWindow = document.getElementById("chat-window");
            chatWindow.scrollTop = chatWindow.scrollHeight;
            setTimeout(typing, speed);
        } else {
            // Wenn fertig getippt: 1 Sekunde warten, dann alles stoppen
            setTimeout(() => {
                element.classList.remove("typing-cursor"); // Sonne im Text weg
                
                // Logo im Header oben stoppen
                const logo = document.querySelector("#bot-logo-wrapper img");
                if (logo) logo.classList.remove("loading-spin");
            }, 2000);
        }
    }
    typing();
}

async function antwortSenden() {
    const inputField = document.getElementById("user-input");
    const chatWindow = document.getElementById("chat-window");
    const logo = document.querySelector("#bot-logo-wrapper img");
    const text = inputField.value.trim();

    if (text === "") return;

    // Logo im Header zum Drehen bringen
    if (logo) logo.classList.add("loading-spin");

    // 1. Nutzernachricht anzeigen
    chatWindow.innerHTML += `<div class="user-msg">${text}</div>`;
    inputField.value = "";
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // 2. Nachricht in den Verlauf speichern
    chatVerlauf.push({ role: "user", content: text });

    // Bot-Platzhalter erstellen
    const botMsgId = "bot-" + Date.now();
    const textId = "text-" + botMsgId;
    chatWindow.innerHTML += `
        <div class="bot-msg" id="${botMsgId}">
            <b>Glame:</b> <span id="${textId}" class="typing">...</span>
        </div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + p1 + p2,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: chatVerlauf 
            })
        });

        const data = await response.json();
        let antwort = data.choices[0].message.content;

        // --- FORMATIERUNG ---
        // Doppelte Sterne zu Fettdruck
        antwort = antwort.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        // Einzelne Sterne am Zeilenanfang zu Aufzählungspunkten
        antwort = antwort.replace(/^\s*\*\s+/gm, '• ');
        // Zeilenumbrüche für HTML umwandeln
        antwort = antwort.replace(/\n/g, '<br>');

        // Antwort im Verlauf speichern
        chatVerlauf.push({ role: "assistant", content: antwort });

        // --- SCHREIBEFFEKT STARTEN ---
        const responseElement = document.getElementById(textId);
        responseElement.classList.remove("typing");
        typeWriter(responseElement, antwort);

    } catch (error) {
        console.error(error);
        const errEl = document.getElementById(textId);
        if(errEl) errEl.innerHTML = "Verbindung unterbrochen.";
        if (logo) logo.classList.remove("loading-spin");
    }
}

window.onload = function() {
    const sendBtn = document.getElementById("send-btn");
    const inputField = document.getElementById("user-input");

    sendBtn.onclick = antwortSenden;
    inputField.onkeypress = function(e) {
        if (e.key === "Enter") antwortSenden();
    };
};
</script>
</script>

</body>
</html>
