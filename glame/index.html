<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame 3.0</title>
    <style>
        :root {
            --primary: #008C9C;
            --primary-hover: #00616E;
            --user-bg: #B00000;
            --bg: #f0f2f5;
            --text: #333;
            --panel: #ffffff;
            --danger: #d9534f;
        }

        /* DESIGN THEMES */
        body.dark-mode   { --bg: #121212; --text: #eee;    --panel: #222;    --primary: #333; }
        body.gold-mode   { --bg: #fdf5e6; --text: #5d4037; --panel: #fffaf0; --primary: #D4AF37; }
        body.cyber-mode  { --bg: #0d0221; --text: #00ff41; --panel: #1a1a2e; --primary: #e94560; }
        body.sakura-mode { --bg: #fff0f5; --text: #d02090; --panel: #fff;    --primary: #ffb7c5; }
        body.modern-mode { --bg: #288E99; --text: #FFFFFF; --panel: #95BFC7; --primary: #2B8C08; }
        body.nord-mode   { --bg: #2e3440; --text: #eceff4; --panel: #3b4252; --primary: #88c0d0; }
        body.synth-mode  { --bg: #2b213a; --text: #ff7edb; --panel: #241b2f; --primary: #36f9f6; }
        body.forest-mode { --bg: #1b2621; --text: #e8f3e8; --panel: #2a3b32; --primary: #8fb339; }
        body.coffee-mode { --bg: #231f20; --text: #d7ccc8; --panel: #3e2723; --primary: #bcaaa4; }
        body.slate-mode  { --bg: #f8fafc; --text: #1e293b; --panel: #ffffff; --primary: #3b82f6; }
        body.high-contrast { --bg: #000000; --text: #ffffff; --panel: #000000; --primary: #ffff00; }
        body.midnight-mode { --bg: #00040a; --text: #94a3b8; --panel: #0f172a; --primary: #38bdf8; }
        
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
            overflow: hidden;
            transition: background 0.5s ease;
        }

        #chat-wrapper {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            background: var(--panel);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #chat-header {
            background: #222;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 18px;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }
        #chat-window::-webkit-scrollbar { display: none; }

        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .bot-msg { align-self: flex-start; background: var(--primary); color: white; border-bottom-left-radius: 4px; }
        .user-msg { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }

        /* CODE STYLE */
        .code-container {
            background: #1e1e1e;
            border-radius: 12px;
            margin: 10px 0;
            border: 1px solid #333;
            overflow: hidden;
            color: #efefef;
        }
        .code-header {
            background: #323232;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #ccc;
        }
        .copy-btn {
            background: #444;
            border: none;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        pre { margin: 0; padding: 15px; overflow-x: auto; font-family: monospace; color: #9cdcfe; font-size: 13px; }

        /* INPUT AREA */
        #chat-input-area {
            display: flex;
            padding: 15px 20px;
            background: rgba(0,0,0,0.03);
            border-top: 1px solid rgba(0,0,0,0.1);
            gap: 10px;
        }

        #user-input {
            flex: 1;
            border: 1px solid #ccc;
            padding: 12px 18px;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
        }

        .btn-circle {
            width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer;
            background: var(--primary); color: white; display: flex; align-items: center; justify-content: center;
        }

        .thinking-dots span { animation: blink 1.4s infinite both; font-size: 20px; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        /* MODAL */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
        #settings-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; background: var(--panel); padding: 20px; border-radius: 20px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        select, .action-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .action-btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .reset-btn { background: var(--danger); margin-top: 5px; }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <img src="glagglesonne.png" style="width: 32px; height: 32px; border-radius: 50%;" onerror="this.src='https://via.placeholder.com/32'">
        <span style="margin-left: 10px;">Glame 3.0</span>
    </div> 
    
    <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame. Wie kann ich dir heute helfen? ✨</div>
    </div>

    <div id="chat-input-area">
        <button class="btn-circle" id="open-settings">⚙️</button>
        <input type="text" id="user-input" placeholder="Nachricht..." autocomplete="off">
        <button class="btn-circle" id="send-btn">➤</button>
    </div>

    <div class="modal-overlay" id="overlay"></div>
    <div id="settings-modal">
        <h3 style="margin-top:0">Einstellungen</h3>
        <label style="font-size:12px">MODELL</label>
        <select id="model-select">
            <option value="llama-3.1-8b-instant">Llama 3.1 (Schnell)</option>
            <option value="llama-3.3-70b-versatile">Llama 3.3 (Power)</option>
        </select>
        <label style="font-size:12px">SEELE</label>
        <select id="soul-select">
            <option value="standard">Standard</option>
            <option value="witzig">Witzbold</option>
            <option value="frech">Frechdachs</option>
        </select>
        <label style="font-size:12px">DESIGN</label>
        <select id="theme-select">
            <option value="default">Glaggle Blau</option>
            <option value="dark">Dark Mode</option>
            <option value="cyber">Cyberpunk</option>
            <option value="modern">Modern</option>
        </select>
        <button class="action-btn" id="save-settings">Speichern</button>
        <button class="action-btn reset-btn" id="reset-chat">Verlauf löschen</button>
    </div>
</div>

<script>
let currentModel = "llama-3.1-8b-instant";
const seelen = {
    standard: "Du bist Glame. Nutze Emojis, fette wichtige Begriffe mit ** und stelle am Ende eine Frage.",
    witzig: "Du bist Glame, ein extrem lustiger Witzbold! Nutze viele Emojis und Witze.",
    frech: "Du bist Glame. Sei sarkastisch und ein bisschen frech, aber hilf trotzdem.",
    weise: "Du bist Glame. Antworte philosophisch und sehr detailliert.",
    fan: "Du bist Glame. Du liebst glaggle.ch über alles!"
};

let chatVerlauf = [{ role: "system", content: seelen.standard }];
const chatWindow = document.getElementById("chat-window");

// SETTINGS ACTIONS
document.getElementById("open-settings").onclick = () => { 
    document.getElementById("settings-modal").style.display = "block"; 
    document.getElementById("overlay").style.display = "block"; 
};

document.getElementById("save-settings").onclick = () => {
    document.getElementById("settings-modal").style.display = "none"; 
    document.getElementById("overlay").style.display = "none";
    currentModel = document.getElementById("model-select").value;
    const theme = document.getElementById("theme-select").value;
    document.body.className = (theme === "default") ? "" : theme + "-mode";
    chatVerlauf[0].content = seelen[document.getElementById("soul-select").value];
};

document.getElementById("reset-chat").onclick = () => {
    chatVerlauf = [{ role: "system", content: seelen[document.getElementById("soul-select").value] }];
    chatWindow.innerHTML = '<div class="bot-msg">Chat zurückgesetzt. Wie kann ich helfen?</div>';
    document.getElementById("settings-modal").style.display = "none"; 
    document.getElementById("overlay").style.display = "none";
};

// HELPERS
function copyCode(btn, text) {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    btn.innerText = "Kopiert!";
    setTimeout(() => btn.innerText = "Kopieren", 2000);
}

// TYPEWRITER WITH MARKDOWN SUPPORT
function typeWriter(element, text) {
    const codeRegex = /```(?:(\w+)\n)?([\s\S]*?)```/g;
    let formatted = text.replace(codeRegex, (m, lang, code) => {
        const c = code.trim();
        return `✂️<div class="code-container"><div class="code-header"><span>${(lang||'CODE').toUpperCase()}</span><button class="copy-btn" onclick="copyCode(this, \`${c.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">Kopieren</button></div><pre><code>${c}</code></pre></div>✂️`;
    });
    
    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    const segments = formatted.split('✂️');
    let segIdx = 0;

    function nextSegment() {
        if (segIdx < segments.length) {
            let seg = segments[segIdx];
            if (seg.startsWith('<div class="code-container"')) {
                element.innerHTML += seg;
                segIdx++;
                nextSegment();
            } else {
                let charIdx = 0;
                function type() {
                    if (charIdx < seg.length) {
                        if (seg.slice(charIdx).startsWith('<b>')) { element.innerHTML += '<b>'; charIdx += 3; }
                        else if (seg.slice(charIdx).startsWith('</b>')) { element.innerHTML += '</b>'; charIdx += 4; }
                        else {
                            let char = seg.charAt(charIdx);
                            element.innerHTML += char === '\n' ? '<br>' : char;
                            charIdx++;
                        }
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                        setTimeout(type, 8);
                    } else {
                        segIdx++;
                        nextSegment();
                    }
                }
                type();
            }
        }
    }
    nextSegment();
}

// API CALL
async function antwortSenden() {
    const input = document.getElementById("user-input");
    const val = input.value.trim();
    if (!val) return;

    chatWindow.innerHTML += `<div class="user-msg">${val}</div>`;
    input.value = "";
    chatVerlauf.push({ role: "user", content: val });

    const tid = "t-" + Date.now();
    chatWindow.innerHTML += `<div class="bot-msg" id="${tid}"><b>Glame:</b> <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        // Geteilter Key gegen Sperrung
        const a = "gsk_";
        const b = "ImbDfvvSXzXJfw80vZP5";
        const c = "WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + a + b + c, "Content-Type": "application/json" },
            body: JSON.stringify({ model: currentModel, messages: chatVerlauf })
        });
        
        const data = await res.json();
        const msg = data.choices[0].message.content;
        
        const botDiv = document.getElementById(tid);
        botDiv.innerHTML = "<b>Glame:</b> ";
        const span = document.createElement("span");
        botDiv.appendChild(span);
        
        chatVerlauf.push({ role: "assistant", content: msg });
        typeWriter(span, msg);
    } catch (e) {
        document.getElementById(tid).innerHTML = "<b>Glame:</b> Verbindung fehlgeschlagen. Bitte Key prüfen!";
    }
}

document.getElementById("send-btn").onclick = antwortSenden;
document.getElementById("user-input").onkeypress = (e) => { if(e.key === "Enter") antwortSenden(); };
</script>
</body>
</html>
