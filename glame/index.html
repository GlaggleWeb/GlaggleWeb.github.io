<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame 2.4 - Design Edition</title>
    <style>
        :root {
            --primary: #008C9C;
            --primary-hover: #00616E;
            --user-bg: #B00000;
            --bg: #f0f2f5;
            --text: #333;
            --panel: #ffffff;
        }

        /* VERSCHIEDENE DESIGNS */
        body.dark-mode { --bg: #121212; --text: #eee; --panel: #222; --primary: #333; }
        body.gold-mode { --bg: #fdf5e6; --text: #5d4037; --panel: #fffaf0; --primary: #D4AF37; }
        body.cyber-mode { --bg: #0d0221; --text: #00ff41; --panel: #1a1a2e; --primary: #e94560; }
        body.sakura-mode { --bg: #fff0f5; --text: #d02090; --panel: #fff; --primary: #ffb7c5; }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
            overflow: hidden;
            transition: background 0.5s ease;
        }

        #chat-wrapper {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            background: var(--panel);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #chat-header {
            background: #222;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        #chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            max-width: 85%;
            animation: FadeIn 0.3s ease;
        }
        .bot-msg { align-self: flex-start; background: var(--primary); color: white; border-bottom-left-radius: 4px; }
        .user-msg { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }

        /* EINGABEBEREICH */
        #chat-input-area {
            display: flex;
            padding: 15px;
            background: rgba(0,0,0,0.05);
            border-top: 1px solid rgba(0,0,0,0.1);
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            border: 1px solid #ccc;
            padding: 12px 15px;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }

        /* BUTTON STYLES (EINHEITLICH) */
        .round-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: white;
            flex-shrink: 0;
        }

        #settings-btn { background: #666; font-size: 22px; }
        #settings-btn:hover { transform: rotate(90deg); background: #444; }

        #send-btn { background: var(--primary); font-size: 26px; } /* Pfeil größer gemacht */
        #send-btn:hover { background: var(--primary-hover); transform: scale(1.1); }
        #send-btn:active { transform: scale(0.9); }

        /* THINKING DOTS */
        .thinking-dots span { animation: blink 1.4s infinite both; font-size: 24px; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        /* SETTINGS MODAL */
        #settings-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; background: var(--panel); padding: 25px; border-radius: 20px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.3); z-index: 100;
        }
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 95; }
        
        select, .save-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; }
        .save-btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }

        @keyframes FadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <img src="glagglesonne.png" style="width: 30px; height: 30px; border-radius: 50%;" id="header-logo">
        <span style="margin-left: 10px;">Glame 2.4</span>
    </div> 
    
    <div id="chat-window">
        <div class="bot-msg">Hey! Klick auf das graue Zahnrad, um mein <b>Design</b> oder meine <b>Seele</b> zu ändern! 🎨</div>
    </div>

    <div id="chat-input-area">
        <button class="round-btn" id="settings-btn">⚙️</button>
        <input type="text" id="user-input" placeholder="Schreib Glame..." autocomplete="off">
        <button class="round-btn" id="send-btn">➤</button>
    </div>

    <div class="modal-overlay" id="overlay"></div>
    <div id="settings-modal">
        <h2 style="margin-top:0;">Glame Setup</h2>
        
        <label>Design-Thema:</label>
        <select id="theme-select">
            <option value="default">Glaggle Blau</option>
            <option value="dark">Dark Mode</option>
            <option value="gold">Luxury Gold</option>
            <option value="cyber">Cyberpunk (Neon)</option>
            <option value="sakura">Sakura (Pink)</option>
        </select>

        <label style="display:block; margin-top:15px;">Glame's Seele:</label>
        <select id="soul-select">
            <option value="standard">Standard</option>
            <option value="lustig">Witzbold</option>
            <option value="thinker">Einstein Mode</option>
            <option value="frech">Frechdachs</option>
            <option value="weise">Der Weise</option>
            <option value="fan">Glaggle Fanboy</option>
        </select>

        <button class="save-btn" id="save-settings">Speichern & Anwenden</button>
    </div>
</div>

<script>
let currentModel = "llama-3.3-70b-versatile";
const seelen = {
    standard: "Du bist Glame, der freundliche Schweizer Bot von glaggle.ch.",
    lustig: "Du bist Glame. Sei extrem lustig und mach Witze!",
    thinker: "Du bist Glame. Antworte extrem klug und tiefgründig.",
    frech: "Du bist Glame. Sei frech, aber charmant.",
    weise: "Du bist Glame. Sprich in Rätseln und Weisheiten.",
    fan: "Du bist Glame. Du liebst glaggle.ch über alles!"
};

let chatVerlauf = [{ role: "system", content: seelen.standard }];

const modal = document.getElementById("settings-modal");
const overlay = document.getElementById("overlay");

document.getElementById("settings-btn").onclick = () => {
    modal.style.display = "block";
    overlay.style.display = "block";
};

document.getElementById("save-settings").onclick = () => {
    modal.style.display = "none";
    overlay.style.display = "none";
    
    // Theme wechseln
    const theme = document.getElementById("theme-select").value;
    document.body.className = "";
    if(theme !== "default") document.body.classList.add(theme + "-mode");

    // Seele wechseln
    const soul = document.getElementById("soul-select").value;
    chatVerlauf[0].content = seelen[soul];
};

async function antwortSenden() {
    const input = document.getElementById("user-input");
    const window = document.getElementById("chat-window");
    const text = input.value.trim();
    if (!text) return;

    window.innerHTML += `<div class="user-msg">${text}</div>`;
    input.value = "";
    chatVerlauf.push({ role: "user", content: text });

    const thinkId = "t-" + Date.now();
    window.innerHTML += `<div class="bot-msg" id="${thinkId}"><b>Glame:</b> <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    window.scrollTop = window.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + p1 + p2, "Content-Type": "application/json" },
            body: JSON.stringify({ model: currentModel, messages: chatVerlauf })
        });
        const data = await res.json();
        const antwort = data.choices[0].message.content;
        
        document.getElementById(thinkId).innerHTML = `<b>Glame:</b> ${antwort.replace(/\n/g, '<br>')}`;
        chatVerlauf.push({ role: "assistant", content: antwort });
        window.scrollTop = window.scrollHeight;
    } catch (e) {
        document.getElementById(thinkId).innerHTML = "Ups, Fehler!";
    }
}

document.getElementById("send-btn").onclick = antwortSenden;
document.getElementById("user-input").onkeypress = (e) => { if(e.key === "Enter") antwortSenden(); };
</script>
</body>
</html>
