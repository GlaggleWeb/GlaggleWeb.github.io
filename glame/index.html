<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame</title>
    <style>
        /* 1. GRUNDGERÜST */
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #chat-wrapper {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        #chat-header {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        #chat-window {
            flex: 1;
            padding: 15px;
            background: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* NACHRICHTEN STYLES */
        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            max-width: 85%;
            width: fit-content;
            animation: FadeIn 0.4s ease-out forwards; 
        }

        .bot-msg { align-self: flex-start; background: #008C9C; color: white; border-bottom-left-radius: 4px; }
        .bot-msg b { font-weight: 800; }
        .bot-msg br { display: block; margin-bottom: 8px; content: ""; }

        .user-msg { align-self: flex-end; background: #B00000; color: white; border-bottom-right-radius: 4px; }

        /* EINGABE BEREICH & EFFEKTE */
        #chat-input-area {
            display: flex;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            transition: border 0.3s ease;
        }

        /* Fokus Effekt für Input */
        #user-input:focus {
            border: 3px solid #008C9C;
        }

        #send-btn {
            background: #008C9C;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover Effekt für Sende-Button */
        #send-btn:hover {
            background: #00616E;
            transform: scale(1.1);
        }

        /* ANIMATIONEN */
        @keyframes FadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .loading-spin { animation: spin-logo 2s linear infinite; }
        @keyframes spin-logo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .typing-cursor::after {
            content: "";
            display: inline-block;
            width: 18px;
            height: 18px;
            background: url('glagglesonne.png') no-repeat center center;
            background-size: contain;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink-soft 0.8s infinite, pulse 1.5s infinite ease-in-out;
        }

        @keyframes blink-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        @media (max-width: 500px) { #chat-wrapper { width: 100%; height: 100dvh; border-radius: 0; } }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <div id="bot-logo-wrapper" style="width: 30px; height: 30px; border-radius: 50%; overflow: hidden;">
            <img src="glagglesonne.png" id="header-logo" alt="Glame" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <span style="margin-left: 10px;">Glame 2.1</span>
    </div> 
    
    <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame. Wie kann ich dir heute helfen?</div>
    </div>

    <div id="chat-input-area">
        <input type="text" id="user-input" placeholder="Chatte mit Glame..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

<script>
let chatVerlauf = [
    { 
        role: "system", 
        content: `Du bist Glame, der offizielle KI-Assistent von glaggle.ch.
        
        Über glaggle.ch:
        - Wir sind eine Plattform für [HIER DEIN THEMA, z.B. Witze, Spiele oder Infos].
        - Unser Ziel ist es, [DEIN ZIEL, z.B. Menschen zum Lachen zu bringen].
        - Die Glaggle-Sonne ist unser Markenzeichen.
        - Glaggle.ch gehört der GAB-Group
        - Bei Glaggle handelt es sich über ein Schweizer Unternehmen

        Deine Persönlichkeit:
        - Du bist extrem freundlich, hilfsbereit und hast einen Sinn für Humor.
        - Du nutzt gerne passende Emojis (☀️, 😎, 🚀).
        - Du kennst dich bestens mit den Inhalten von glaggle.ch aus.
        - Antworte kurz und knackig, außer der Nutzer fragt nach Details.`
        - Du erklärst Sachen, so dass man sie gut verstehen kann.
    }
];
function typeWriter(element, text, speed = 10) {
    let i = 0;
    element.innerHTML = ""; 
    element.classList.add("typing-cursor"); 
    
    function typing() {
        if (i < text.length) {
            if (text.charAt(i) === '<') {
                let tagEnd = text.indexOf('>', i);
                element.innerHTML += text.substring(i, tagEnd + 1);
                i = tagEnd + 1;
            } else {
                element.innerHTML += text.charAt(i);
                i++;
            }
            const win = document.getElementById("chat-window");
            win.scrollTop = win.scrollHeight;
            setTimeout(typing, speed);
        } else {
            setTimeout(() => {
                element.classList.remove("typing-cursor");
                const logo = document.getElementById("header-logo");
                if (logo) logo.classList.remove("loading-spin");
            }, 1000);
        }
    }
    typing();
}

async function antwortSenden() {
    const inputField = document.getElementById("user-input");
    const chatWindow = document.getElementById("chat-window");
    const logo = document.getElementById("header-logo");
    const text = inputField.value.trim();

    if (text === "") return;

    if (logo) logo.classList.add("loading-spin");
    chatWindow.innerHTML += `<div class="user-msg">${text}</div>`;
    inputField.value = "";
    chatVerlauf.push({ role: "user", content: text });

    const textId = "text-" + Date.now();
    chatWindow.innerHTML += `<div class="bot-msg"><b>Glame:</b> <span id="${textId}">...</span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + p1 + p2,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: chatVerlauf })
        });

        const data = await response.json();
        let antwort = data.choices[0].message.content;

        antwort = antwort.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        antwort = antwort.replace(/^\s*\*\s+/gm, '• ');
        antwort = antwort.replace(/\n/g, '<br>');

        chatVerlauf.push({ role: "assistant", content: antwort });
        typeWriter(document.getElementById(textId), antwort);

    } catch (error) {
        console.error(error);
        const errEl = document.getElementById(textId);
        if(errEl) errEl.innerHTML = "Fehler bei der Verbindung.";
        if (logo) logo.classList.remove("loading-spin");
    }
}

// Hier war wahrscheinlich der Fehler: Die Event Listener müssen sauber sitzen
document.addEventListener("DOMContentLoaded", function() {
    const btn = document.getElementById("send-btn");
    const input = document.getElementById("user-input");

    btn.onclick = antwortSenden;
    input.onkeypress = function(e) {
        if (e.key === "Enter") {
            antwortSenden();
        }
    };
});
</script>
</body>
</html>
