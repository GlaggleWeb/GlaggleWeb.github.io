<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame 2.3 - Pro</title>
    <style>
        :root {
            --primary: #008C9C;
            --primary-hover: #00616E;
            --user-bg: #B00000;
            --bg: #f0f2f5;
            --text: #333;
        }

        body.dark-mode { --bg: #1a1a1a; --text: #f0f2f5; }
        body.gold-mode { --bg: #fffcf0; --primary: #D4AF37; --primary-hover: #AA8F39; }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
            overflow: hidden;
        }

        /* 4. ABGERUNDETE ECKEN FÜR DAS FENSTER */
        #chat-wrapper {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            background: white;
            border-radius: 20px; /* Hier sind die abgerundeten Ecken */
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden; /* Wichtig, damit Inhalte nicht über die Ecken ragen */
        }

        body.dark-mode #chat-wrapper { background: #2d2d2d; }

        #chat-header {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        #chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* SPRECHBLASEN */
        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            max-width: 85%;
            animation: FadeIn 0.4s ease-out forwards;
        }
        .bot-msg { align-self: flex-start; background: var(--primary); color: white; border-bottom-left-radius: 4px; }
        .user-msg { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }

        /* EINGABEBEREICH & EFFEKTE */
        #chat-input-area {
            display: flex;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            gap: 10px;
            align-items: center;
        }
        body.dark-mode #chat-input-area { background: #3d3d3d; border-top: 1px solid #444; }

        #user-input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
        }
        #user-input:focus {
            border: 3px solid var(--primary);
            box-shadow: 0 0 8px rgba(0, 140, 156, 0.2);
        }

        #send-btn {
            background: var(--primary);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        #send-btn:hover { background: var(--primary-hover); transform: scale(1.15); }

        .icon-btn { background: none; border: none; cursor: pointer; font-size: 24px; transition: transform 0.3s; }
        .icon-btn:hover { transform: rotate(90deg); }

        /* THINKING DOTS ANIMATION */
        .thinking-dots span {
            animation: blink 1.4s infinite both;
            font-size: 20px;
            font-weight: bold;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        /* MODAL */
        #settings-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: white; padding: 20px; border-radius: 15px; z-index: 100;
        }
        body.dark-mode #settings-modal { background: #333; color: white; }
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 90; }

        select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 8px; }

        @keyframes FadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loading-spin { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <div id="bot-logo-wrapper" style="width: 30px; height: 30px; border-radius: 50%; overflow: hidden;">
            <img src="glagglesonne.png" id="header-logo" alt="Glame" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <span style="margin-left: 10px;">Glame 2.3</span>
    </div> 
    
    <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame.  <b>Frage</b> mich etwas. Oder ändere in den  <b>Einstellungen</b> meine Eigenschaften</div>
    </div>

    <div id="chat-input-area">
        <button class="icon-btn" id="open-settings">⚙️</button>
        <input type="text" id="user-input" placeholder="Frag mich was..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <div class="modal-overlay" id="overlay"></div>
    <div id="settings-modal">
        <h3>Einstellungen</h3>
        <label>Seele:</label>
        <select id="soul-select">
            <option value="standard">☀️ Standard</option>
            <option value="lustig">😂 Lustig</option>
            <option value="thinker">🧠 Deep Thinker</option>
            <option value="frech">😈 Frech</option>
            <option value="weise">👴 Der Weise (Philosophisch)</option>
            <option value="sport">🏃 Sportskanone (Viel Energie)</option>
            <option value="fan">🌻 Glaggle-Fan (Liebt die Seite)</option>
        </select>
        <label>Modell:</label>
        <select id="model-select">
            <option value="llama-3.3-70b-versatile">Llama 3.3 (High End)</option>
            <option value="llama-3.1-8b-instant">Llama 3.1 (Schnell)</option>
            <option value="llama-3.2-3b-preview">Llama 3.2 (Leichtgewicht)</option>
        </select>
        <button id="close-settings" style="width:100%; margin-top:15px; padding:10px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer;">Speichern</button>
    </div>
</div>

<script>
let currentModel = "llama-3.3-70b-versatile";
const seelen = {
    standard: "Du bist Glame, der freundliche Bot von glaggle.ch.",
    lustig: "Du bist Glame. Sei extrem lustig, erzähle Witze und nutze viele Emojis!",
    thinker: "Du bist Glame. Antworte hochwissenschaftlich und sehr detailliert.",
    frech: "Du bist Glame. Sei ein bisschen frech und sarkastisch, aber bleib nett.",
    weise: "Du bist Glame. Antworte wie ein alter weiser Mann mit Zitaten und Metaphern.",
    sport: "Du bist Glame. Sei extrem motiviert, benutze Wörter wie 'Power' und 'Action'!",
    fan: "Du bist Glame. Du bist der größte Fan von glaggle.ch und schwärmst nur von der Seite."
};

let chatVerlauf = [{ role: "system", content: seelen.standard }];

const modal = document.getElementById("settings-modal");
const overlay = document.getElementById("overlay");

document.getElementById("open-settings").onclick = () => { modal.style.display = "block"; overlay.style.display = "block"; };
document.getElementById("close-settings").onclick = () => {
    modal.style.display = "none"; overlay.style.display = "none";
    currentModel = document.getElementById("model-select").value;
    chatVerlauf[0].content = seelen[document.getElementById("soul-select").value];
};

function typeWriter(element, text, speed = 15) {
    let i = 0;
    element.innerHTML = "";
    function typing() {
        if (i < text.length) {
            element.innerHTML += (text.charAt(i) === '\n' ? '<br>' : text.charAt(i));
            i++;
            document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;
            setTimeout(typing, speed);
        } else {
            document.getElementById("header-logo").classList.remove("loading-spin");
        }
    }
    typing();
}

async function antwortSenden() {
    const inputField = document.getElementById("user-input");
    const chatWindow = document.getElementById("chat-window");
    const text = inputField.value.trim();
    if (text === "") return;

    document.getElementById("header-logo").classList.add("loading-spin");
    chatWindow.innerHTML += `<div class="user-msg">${text}</div>`;
    inputField.value = "";
    chatVerlauf.push({ role: "user", content: text });

    // ÜBERLEGE-EFFEKT (BLINKENDE PUNKTE)
    const thinkingId = "think-" + Date.now();
    chatWindow.innerHTML += `<div class="bot-msg" id="${thinkingId}"><b>Glame:</b> <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + p1 + p2, "Content-Type": "application/json" },
            body: JSON.stringify({ model: currentModel, messages: chatVerlauf })
        });
        const data = await response.json();
        let antwort = data.choices[0].message.content;

        document.getElementById(thinkingId).innerHTML = `<b>Glame:</b> <span id="text-${thinkingId}"></span>`;
        chatVerlauf.push({ role: "assistant", content: antwort });
        typeWriter(document.getElementById("text-" + thinkingId), antwort);
    } catch (e) {
        document.getElementById(thinkingId).innerHTML = "Fehler!";
    }
}

document.getElementById("send-btn").onclick = antwortSenden;
document.getElementById("user-input").onkeypress = (e) => { if (e.key === "Enter") antwortSenden(); };
</script>
</body>
</html>
