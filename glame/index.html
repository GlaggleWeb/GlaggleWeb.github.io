<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame</title>
    <style>
        :root {
            --primary: #008C9C;
            --primary-hover: #00616E;
            --user-bg: #B00000;
            --bg: #f0f2f5;
            --text: #333;
            --panel: #ffffff;
            --danger: #d9534f;
        }

        /* DESIGN THEMES */
       /* --- Deine Originalen Designs --- */
body.dark-mode   { --bg: #121212; --text: #eee;    --panel: #222;    --primary: #333; }
body.gold-mode   { --bg: #fdf5e6; --text: #5d4037; --panel: #fffaf0; --primary: #D4AF37; }
body.cyber-mode  { --bg: #0d0221; --text: #00ff41; --panel: #1a1a2e; --primary: #e94560; }
body.sakura-mode { --bg: #fff0f5; --text: #d02090; --panel: #fff;    --primary: #ffb7c5; }
body.modern-mode { --bg: #288E99; --text: #FFFFFF; --panel: #95BFC7; --primary: #2B8C08; }

/* --- Neue Ergänzungen --- */
body.nord-mode   { --bg: #2e3440; --text: #eceff4; --panel: #3b4252; --primary: #88c0d0; }
body.synth-mode  { --bg: #2b213a; --text: #ff7edb; --panel: #241b2f; --primary: #36f9f6; }
body.forest-mode { --bg: #1b2621; --text: #e8f3e8; --panel: #2a3b32; --primary: #8fb339; }
body.coffee-mode { --bg: #231f20; --text: #d7ccc8; --panel: #3e2723; --primary: #bcaaa4; }
body.slate-mode  { --bg: #f8fafc; --text: #1e293b; --panel: #ffffff; --primary: #3b82f6; }

/* --- Bonus: High-Contrast & Midnight --- */
body.high-contrast { --bg: #000000; --text: #ffffff; --panel: #000000; --primary: #ffff00; }
body.midnight-mode { --bg: #00040a; --text: #94a3b8; --panel: #0f172a; --primary: #38bdf8; }
        
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* 1. ABGERUNDETE ECKEN FÜR DAS FENSTER */
        #chat-wrapper {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            background: var(--panel);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #chat-header {
            background: #222;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 18px;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }
        #chat-window::-webkit-scrollbar { display: none; }

        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .bot-msg { align-self: flex-start; background: var(--primary); color: white; border-bottom-left-radius: 4px; }
        .user-msg { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }

        /* INPUT AREA */
        #chat-input-area {
            display: flex;
            padding: 15px 20px;
            background: rgba(0,0,0,0.03);
            border-top: 1px solid rgba(0,0,0,0.1);
            gap: 12px;
            align-items: center;
        }

        /* INPUT FOKUS ERHALTEN */
        #user-input {
            flex: 1;
            border: 1px solid #ccc;
            padding: 12px 18px;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }
        #user-input:focus {
            border: 3px solid var(--primary);
            box-shadow: 0 0 10px rgba(0, 140, 156, 0.2);
        }

        /* BUTTON STYLES */
        .btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-circle:hover { transform: scale(1.1); background: var(--primary-hover); }
        .btn-circle:active { transform: scale(0.95); }

        /* WEISSES ZAHNRAD */
        .icon-white {
            filter: brightness(0) invert(1);
            width: 24px;
            height: 24px;
        }

        /* THINKING DOTS EFFECT */
        .thinking-dots span { animation: blink 1.4s infinite both; font-size: 24px; font-weight: bold; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        /* MODAL */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(3px); }
        #settings-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; background: var(--panel); padding: 25px; border-radius: 20px; z-index: 100;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        select, .action-btn { width: 100%; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; font-size: 14px; outline: none; }
        .action-btn { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        .reset-btn { background: var(--danger); }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <img src="glagglesonne.png" style="width: 32px; height: 32px; border-radius: 50%;" id="header-logo" onerror="this.src='https://via.placeholder.com/32'">
        <span style="margin-left: 10px;">Glame 3.0</span>
    </div> 
    
    <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame. Wie kann <b>Glame</b> dir heute <b>helfen</b> ?</div>
    </div>

    <div id="chat-input-area">
        <button class="btn-circle" id="open-settings">
            <!-- Weißes Zahnrad Icon -->
            <svg class="icon-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19.4 15L21.7 12.8C22.1 12.4 22.1 11.7 21.7 11.3L19.4 9.1C19.1 8.8 19 8.4 19.1 8L19.7 4.9C19.8 4.3 19.4 3.7 18.8 3.6L15.7 3C15.3 2.9 14.9 2.8 14.6 2.5L12.4 0.3C12 -0.1 11.3 -0.1 10.9 0.3L8.7 2.5C8.4 2.8 8 2.9 7.6 3L4.5 3.6C3.9 3.7 3.5 4.3 3.6 4.9L4.2 8C4.3 8.4 4.2 8.8 3.9 9.1L1.6 11.3C1.2 11.7 1.2 12.4 1.6 12.8L3.9 15C4.2 15.3 4.3 15.7 4.2 16.1L3.6 19.2C3.5 19.8 3.9 20.4 4.5 20.5L7.6 21.1C8 21.2 8.4 21.3 8.7 21.6L10.9 23.8C11.3 24.2 12 24.2 12.4 23.8L14.6 21.6C14.9 21.3 15.3 21.2 15.7 21.1L18.8 20.5C19.4 20.4 19.8 19.8 19.7 19.2L19.1 16.1C19 15.7 19.1 15.3 19.4 15Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <input type="text" id="user-input" placeholder="Nachricht..." autocomplete="off">
        <button class="btn-circle" id="send-btn" style="font-size: 24px;">➤</button>
    </div>

    <div class="modal-overlay" id="overlay"></div>
    <div id="settings-modal">
        <h3 style="margin:0 0 15px 0;">Einstellungen</h3>
        
        <label style="font-size:12px; font-weight:bold;">KI-MODELL</label>
        <select id="model-select">
            <option value="llama-3.1-8b-instant">Llama 3.1 (Schnell)</option>
            <option value="llama-3.3-70b-versatile">Llama 3.3 (Power)</option>
            <option value="llama-3.2-3b-preview">Llama 3.2 (Mini)</option>
        </select>

        <label style="font-size:12px; font-weight:bold; display:block; margin-top:10px;">SEELE</label>
        <select id="soul-select">
            <option value="standard">Standard (Hilfreich)</option>
            <option value="witzig">Witzbold (Emojis & Humor)</option>
            <option value="frech">Frechdachs (Sarkastisch)</option>
            <option value="weise">Wissen (Philosophisch)</option>
            <option value="fan">Glaggle-Fan (Begeistert)</option>
        </select>

        <label style="font-size:12px; font-weight:bold; display:block; margin-top:10px;">DESIGN</label>
        <select id="theme-select">
            <label style="font-size:12px; font-weight:bold; display:block; margin-top:10px;">DESIGN</label>
<select id="theme-select">
    <option value="default">Glaggle Blau</option>
    <option value="dark">Dark Mode</option>
    <option value="gold">Gold Edition</option>
    <option value="cyber">Cyberpunk</option>
    <option value="sakura">Sakura Pink</option>
    <option value="modern">Modern</option>
    <option value="nord">Nordic Ice</option>
    <option value="synth">Synthwave 84</option>
    <option value="forest">Evergreen</option>
    <option value="coffee">Espresso</option>
    <option value="slate">Slate</option>
    <option value="high-contrast">High Contrast</option>
    <option value="midnight">Midnight</option>
</select> <button class="action-btn" id="save-settings">Speichern</button>
<button class="action-btn reset-btn" id="reset-chat">Chat zurücksetzen</button>
    </div>
</div>

<script>
let currentModel = "llama-3.1-8b-instant";
const seelen = {
    standard: "Du bist Glame, und bist so wie ChatGPT du benutzt emojis und schreibst unten meistens die wichtigsten Punkte zu diesem Thema. Ebenso stellst du teilweise dem Benutzer noch eine Frage(ganz unten) Was möchtest du über dieses Thema wissen",
    witzig: "Du bist Glame. Erzähle Witze, benutze viele Emojis und sei extrem lustig!",
    frech: "Du bist Glame. Sei frech, sarkastisch und ein bisschen respektlos, aber bleib im Kern freundlich.",
    weise: "Du bist Glame. Du gibst sehr sachliche Antworten. Ebenso sind deine Antworten sehr Detailiert",
    fan: "Du bist Glame. Du bist der größte Fan von glaggle.ch und liebst alles an dieser Website!"
};

let chatVerlauf = [{ role: "system", content: seelen.standard }];

const modal = document.getElementById("settings-modal");
const overlay = document.getElementById("overlay");
const chatWindow = document.getElementById("chat-window");

document.getElementById("open-settings").onclick = () => { modal.style.display = "block"; overlay.style.display = "block"; };

document.getElementById("save-settings").onclick = () => {
    modal.style.display = "none";
    overlay.style.display = "none";
    currentModel = document.getElementById("model-select").value;
    const theme = document.getElementById("theme-select").value;
    document.body.className = (theme === "default") ? "" : theme + "-mode";
    chatVerlauf[0].content = seelen[document.getElementById("soul-select").value];
};

document.getElementById("reset-chat").onclick = () => {
    chatVerlauf = [{ role: "system", content: seelen[document.getElementById("soul-select").value] }];
    chatWindow.innerHTML = '<div class="bot-msg">Verlauf gelöscht. Wie kann ich dir helfen?</div>';
    modal.style.display = "none"; overlay.style.display = "none";
};

// TYPING EFFEKT
function typeWriter(element, text, i = 0) {
    if (i < text.length) {
        element.innerHTML += text.charAt(i).replace(/\n/g, '<br>');
        i++;
        chatWindow.scrollTop = chatWindow.scrollHeight;
        setTimeout(() => typeWriter(element, text, i), 20);
    }
}

async function antwortSenden() {
    const inputField = document.getElementById("user-input");
    const text = inputField.value.trim();
    if (!text) return;

    // User Nachricht anzeigen
    chatWindow.innerHTML += `<div class="user-msg">${text}</div>`;
    inputField.value = "";
    chatVerlauf.push({ role: "user", content: text });

    // 2. DENK-EFFEKT (BLINKENDE PUNKTE)
    const thinkingId = "think-" + Date.now();
    chatWindow.innerHTML += `<div class="bot-msg" id="${thinkingId}"><b>Glame:</b> <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + p1 + p2, "Content-Type": "application/json" },
            body: JSON.stringify({ model: currentModel, messages: chatVerlauf })
        });
        const data = await res.json();
        const antwort = data.choices[0].message.content;
        
        // Denker entfernen und 3. TYPING-EFFEKT starten
        const botDiv = document.getElementById(thinkingId);
        botDiv.innerHTML = "<b>Glame:</b> ";
        const textSpan = document.createElement("span");
        botDiv.appendChild(textSpan);
        
        chatVerlauf.push({ role: "assistant", content: antwort });
        typeWriter(textSpan, antwort);

    } catch (e) {
        document.getElementById(thinkingId).innerHTML = "<b>Glame:</b> Da gab es ein technisches Problem. Versuche es gleich nochmal!";
    }
}

document.getElementById("send-btn").onclick = antwortSenden;
document.getElementById("user-input").onkeypress = (e) => { if(e.key === "Enter") antwortSenden(); };
</script>
</body>
</html>
