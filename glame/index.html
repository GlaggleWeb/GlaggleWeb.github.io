<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Glame - Dein Chatbot">
    <meta name="keywords" content="Glame, Chatbot, Glaggle">
    <meta name="author" content="Glaggle">
    <title>Glame</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
#chat-wrapper {
    width: 95%;
    max-width: 450px;    /* Verhindert das Breitbild-Problem vom PC */
    height: 85vh;        /* Nutzt 85% der Bildschirmhöhe */
    max-height: 700px;   /* Begrenzt die Höhe auf großen Monitoren */
    background: white;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    overflow: hidden;
    margin: 20px auto;   /* Zentriert das Fenster */
}

/* WICHTIG: Die Blasen müssen "width: fit-content" haben */
.bot-msg, .user-msg {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    max-width: 85%;
    width: fit-content;  /* Die Blase zieht sich nur so weit wie der Text */
    display: block;      /* Verhindert, dass sie die ganze Zeile einnimmt */
}

.bot-msg {
    align-self: flex-start;
    background: #008C9C;
    color: white;
    border-bottom-left-radius: 4px;
}

.user-msg {
    align-self: flex-end;
    background: #B00000;
    color: white;
    border-bottom-right-radius: 4px;
}

/* Verhindert das automatische Zoomen auf dem iPhone */
#user-input {
    flex: 1;
    border: 1px solid #ddd;
    padding: 12px 15px;
    border-radius: 20px;
    outline: none;
    font-size: 16px; /* Mindestens 16px verhindert iOS-Auto-Zoom */
}

.new-msg {
    animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

        #user-input:focus {
            border-color: #008C9C;
        }

        #send-btn {
            background: #008C9C;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.5s;
        }

        #send-btn:hover {
            background: #00616E;
        }
        
    </style>
    <script>
// Variable außerhalb der Funktion, damit sich der Bot Dinge merken kann
let chatVerlauf = [
    { role: "system", content: "Du bist Glame, der freundliche Chatbot von glaggle.ch." }
];

async function antwortSenden() {
    const inputField = document.getElementById("user-input");
    const chatWindow = document.getElementById("chat-window");
    const text = inputField.value.trim();

    if (text === "") return;

    // 1. Nutzernachricht anzeigen
    chatWindow.innerHTML += `<div class="user-msg new-msg">${text}</div>`;
    inputField.value = "";
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // 2. Nachricht in den Verlauf speichern
    chatVerlauf.push({ role: "user", content: text });

    const botMsgId = "bot-" + Date.now();
    chatWindow.innerHTML += `<div class="bot-msg new-msg" id="${botMsgId}"><b>Glame:</b> <span class="typing">...</span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + p1 + p2,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: chatVerlauf // Hier schicken wir den ganzen Verlauf mit
            })
        });

        const data = await response.json();
        const antwort = data.choices[0].message.content;

        // Antwort im Verlauf speichern
        chatVerlauf.push({ role: "assistant", content: antwort });

        document.getElementById(botMsgId).innerHTML = `<b>Glame:</b> ${antwort}`;

    } catch (error) {
        console.error(error);
        document.getElementById(botMsgId).innerHTML = `<b>Glame:</b> Verbindung unterbrochen.`;
    }
    chatWindow.scrollTop = chatWindow.scrollHeight;
}
window.onload = function() {
    const sendBtn = document.getElementById("send-btn");
    const inputField = document.getElementById("user-input");

    sendBtn.onclick = antwortSenden;

    inputField.onkeypress = function(e) {
        if (e.key === "Enter") antwortSenden();
    };
};
    </script>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        <div id="bot-logo-wrapper" style="width: 30px; height: 30px; background: #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
            <img src="glagglesonne.png" 
                 alt="Glame" 
                 style="width: 100%; height: 100%; object-fit: cover;"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='G';">
        </div>
        
        <span style="margin-left: 10px;">Glame 1.5</span>
        
        <div id="status-dot"></div>
    </div> <div id="chat-window">
        <div class="bot-msg">Hallo! Ich bin Glame. Wie kann ich dir heute helfen?</div>
    </div>

    <div id="chat-input-area">
        <input type="text" id="user-input" placeholder="Chatte mit Glame 1.5" autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

</body>
</html>
