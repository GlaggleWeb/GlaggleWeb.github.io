<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI</title>
    <style>
        :root {
            --primary: #008C9C;
            --primary-hover: #00616E;
            --user-bg: #B00000;
            --bg: #f0f2f5;
            --text: #333;
            --panel: #ffffff;
            --danger: #d9534f;
            --code-bg: #0d1117;
            --code-text: #c9d1d9;
        }

        /* ────────────── THEMES ────────────── */
        body.dark-mode   { --bg: #0d1117; --text: #c9d1d9; --panel: #161b22; --primary: #58a6ff; --code-bg: #0d1117; }
        body.gold-mode   { --bg: #fdf5e6; --text: #5d4037; --panel: #fffaf0; --primary: #D4AF37; }
        body.cyber-mode  { --bg: #0d0221; --text: #00ff41; --panel: #1a1a2e; --primary: #e94560; --code-bg: #0a0015; }
        body.sakura-mode { --bg: #fff0f5; --text: #d02090; --panel: #fff;    --primary: #ffb7c5; }
        body.nord-mode   { --bg: #2e3440; --text: #eceff4; --panel: #3b4252; --primary: #88c0d0; }
        body.synth-mode  { --bg: #2b213a; --text: #ff7edb; --panel: #241b2f; --primary: #36f9f6; }
        body.forest-mode { --bg: #1b2621; --text: #e8f3e8; --panel: #2a3b32; --primary: #8fb339; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #chat-wrapper {
            width: 96%;
            max-width: 520px;
            height: 94vh;
            background: var(--panel);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: white;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #444;
        }

        #chat-window {
            flex: 1;
            padding: 18px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15.5px;
            line-height: 1.48;
            max-width: 84%;
            word-wrap: break-word;
            position: relative;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--primary);
            color: white;
            border-bottom-left-radius: 6px;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--user-bg);
            color: white;
            border-bottom-right-radius: 6px;
        }

        /* ────────────── Markdown Styling ────────────── */
        .bot-msg h1, .bot-msg h2, .bot-msg h3 {
            margin: 1em 0 0.5em;
            font-weight: 600;
        }
        .bot-msg h1 { font-size: 1.6em; }
        .bot-msg h2 { font-size: 1.38em; }
        .bot-msg h3 { font-size: 1.18em; }

        .bot-msg blockquote {
            margin: 14px 0;
            padding: 2px 0 2px 16px;
            border-left: 4px solid rgba(255,255,255,0.5);
            color: rgba(255,255,255,0.92);
            font-style: italic;
        }

        .bot-msg ul, .bot-msg ol {
            margin: 10px 0 10px 24px;
            padding: 0;
        }
        .bot-msg li { margin: 5px 0; }

        .bot-msg table {
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 0.94em;
            width: 100%;
        }
        .bot-msg th, .bot-msg td {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 9px 12px;
        }
        .bot-msg th {
            background: rgba(0,0,0,0.25);
            font-weight: 600;
        }

        .bot-msg input[type="checkbox"] {
            margin-right: 8px;
            accent-color: white;
        }

        .bot-msg code {
            background: rgba(0,0,0,0.4);
            padding: 3px 7px;
            border-radius: 5px;
            font-family: 'Consolas', 'SF Mono', monospace;
        }

        .bot-msg pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 0.93em;
            line-height: 1.45;
        }

        .code-container {
            margin: 14px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            background: var(--code-bg);
        }
        .code-header {
            background: #1e1e1e;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82em;
            color: #aaa;
        }
        .copy-btn {
            background: #333;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .copy-btn:hover { background: #444; }

        #chat-input-area {
            padding: 14px 18px;
            background: rgba(0,0,0,0.04);
            border-top: 1px solid rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 13px 18px;
            border-radius: 999px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
            background: white;
            transition: all 0.2s;
        }
        #user-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,140,156,0.2);
        }

        .btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }
        .btn-circle:hover { transform: scale(1.08); }

        .thinking-dots span {
            animation: blink 1.3s infinite;
            opacity: 0.4;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* Settings Modal */
        #settings-modal, .modal-overlay {
            display: none;
        }
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            z-index: 90;
        }
        #settings-modal {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 88%;
            max-width: 400px;
            background: var(--panel);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 70px rgba(0,0,0,0.45);
            z-index: 100;
        }
        select, button.action-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .reset-btn {
            background: var(--danger) !important;
        }
    </style>
</head>
<body>

<div id="chat-wrapper">
    <div id="chat-header">
        Glame 3.0
    </div>

    <div id="chat-window">
        <div class="msg bot-msg">
            Hallo! Ich bin Glame.<br><br>
            Ich kann jetzt richtig gut Markdown:<br>
            • **fett**, *kursiv*, ~~durchgestrichen~~<br>
            • Tabellen<br>
            • Aufzählungen & Nummerierungen<br>
            • > Zitate<br>
            • ```Code-Blöcke``` mit Kopier-Button<br><br>
            Was willst du testen? 🚀
        </div>
    </div>

    <div id="chat-input-area">
        <button class="btn-circle" id="open-settings">⚙</button>
        <input type="text" id="user-input" placeholder="Nachricht..." autocomplete="off">
        <button class="btn-circle" id="send-btn">➤</button>
    </div>

    <div class="modal-overlay" id="overlay"></div>

    <div id="settings-modal">
        <h3 style="margin:0 0 20px 0;">Einstellungen</h3>

        <label style="font-size:0.85rem; font-weight:600; display:block; margin:12px 0 6px;">Modell</label>
        <select id="model-select">
            <option value="llama-3.1-8b-instant" selected>Llama 3.1 8B · schnell & gratis</option>
            <option value="llama-3.3-70b-versatile">Llama 3.3 70B · leistungsstark</option>
        </select>

        <label style="font-size:0.85rem; font-weight:600; display:block; margin:16px 0 6px;">Persönlichkeit</label>
        <select id="soul-select">
            <option value="standard">Standard Glame</option>
            <option value="grok_style">Frech & direkt 😜</option>
            <option value="claude_style">Nachdenklich & präzise 🌿</option>
            <option value="chatgpt_style">Modern & strukturiert ✨</option>
            <!-- hier kannst du deine anderen Seelen wieder einfügen -->
        </select>

        <label style="font-size:0.85rem; font-weight:600; display:block; margin:16px 0 6px;">Design</label>
        <select id="theme-select">
            <option value="default">Standard</option>
            <option value="dark">Dark</option>
            <option value="cyber">Cyberpunk</option>
            <option value="sakura">Sakura</option>
            <option value="nord">Nord</option>
            <option value="synth">Synthwave</option>
            <option value="forest">Forest</option>
        </select>

        <button class="action-btn" id="save-settings">Speichern</button>
        <button class="action-btn reset-btn" id="reset-chat">Chat zurücksetzen</button>
    </div>
</div>

<script>
// ──────────────────────────────────────────────
const chatWindow   = document.getElementById("chat-window");
const userInput    = document.getElementById("user-input");
const sendBtn      = document.getElementById("send-btn");
const overlay      = document.getElementById("overlay");
const settingsModal = document.getElementById("settings-modal");

let currentModel = "llama-3.1-8b-instant";

const seelen = {
    standard: `Du bist Glame – eine hilfreiche, kluge und etwas freche KI.
Du benutzt **Markdown** sehr natürlich: Überschriften, Tabellen, Checklisten, Code-Blöcke, Zitate usw.
Du liebst emojis!!(✨ 🚀 ✅ 💡 😄).
Antworte klar, direkt und modern.`,

    grok_style: `Du bist frech, direkt, selbstbewusst und ein bisschen sarkastisch (aber nie fies).
Du benutzt Emojis wie 😜 ⚡ 🧠 🔥.
Markdown ja – aber lässig und nicht übertrieben.`,

    claude_style: `Du antwortest ruhig, präzise, nachdenklich und sehr hochwertig.
Kaum bis gar keine Emojis.
Markdown sehr sauber und strukturiert.
Ton: gebildet, reflektiert, fast literarisch.`,

    chatgpt_style: `Du bist modern, klar strukturiert und sehr hilfsbereit.
Nutze Emojis bewusst (✨ ✅ 🚀 📌).
Markdown sauber: Listen, Tabellen, Code-Blöcke, fett/kursiv.
Antworte professionell, aber freundlich.`
};

let chatVerlauf = [{ role: "system", content: seelen.standard }];

// ─── Settings ───
document.getElementById("open-settings").onclick = () => {
    settingsModal.style.display = "block";
    overlay.style.display = "block";
};

document.getElementById("save-settings").onclick = () => {
    currentModel = document.getElementById("model-select").value;
    document.body.className = document.getElementById("theme-select").value + (document.getElementById("theme-select").value === "default" ? "" : "-mode");
    chatVerlauf[0].content = seelen[document.getElementById("soul-select").value] || seelen.standard;
    settingsModal.style.display = "none";
    overlay.style.display = "none";
};

document.getElementById("reset-chat").onclick = () => {
    chatVerlauf = [{ role: "system", content: chatVerlauf[0].content }];
    chatWindow.innerHTML = '<div class="msg bot-msg">Chat zurückgesetzt. Was geht? 🚀</div>';
    settingsModal.style.display = "none";
    overlay.style.display = "none";
};

// ─── Sehr einfacher Markdown → HTML Renderer ───
function mdToHtml(text) {
    let html = text
        .replace(/^### (.*$)/gm,       '<h3>$1</h3>')
        .replace(/^## (.*$)/gm,        '<h2>$1</h2>')
        .replace(/^# (.*$)/gm,         '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/g,     '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g,         '<em>$1</em>')
        .replace(/~~(.*?)~~/g,         '<del>$1</del>')
        .replace(/`([^`]+)`/g,         '<code>$1</code>')
        .replace(/^> (.*$)/gm,         '<blockquote>$1</blockquote>')
        .replace(/^\s*[-*+] (.*$)/gm,  '<li>$1</li>')
        .replace(/^\s*\d+\. (.*$)/gm,  '<li>$1</li>')
        .replace(/^\[x\] (.*$)/gm,     '<li><input type="checkbox" checked> $1</li>')
        .replace(/^\[ \] (.*$)/gm,     '<li><input type="checkbox"> $1</li>')
        .replace(/\n/g, '<br>');

    // Listen umschließen
    html = html.replace(/(<li>.*<\/li>)/gs, match => {
        if (match.includes('<input type="checkbox"')) return `<ul class="task-list">${match}</ul>`;
        return match.includes('<li>1.') || match.includes('<li>2.') ? `<ol>${match}</ol>` : `<ul>${match}</ul>`;
    });

    // Code-Blöcke
    html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
        const language = lang || 'text';
        const safeCode = btoa(unescape(encodeURIComponent(code.trim())));
        return `
<div class="code-container">
    <div class="code-header">
        <span>${language}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText(decodeURIComponent(escape(atob('${safeCode}')))).then(()=>this.textContent='Kopiert!')">Kopieren</button>
    </div>
    <pre><code>${code.trim().replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>
</div>`;
    });

    return html;
}

function getApiKey() {
    const part1 = "gsk_ImbDfvv";
    const part2 = "SXzXJfw8";
    const part3 = "0vZP5WGdyb3FYkn";
    const part4 = "kYv77zRJZN3pfyA1PiRGWu";
    
    return part1 + part2 + part3 + part4;
}
  
function typeWriter(el, raw) {
    const html = mdToHtml(raw);
    el.innerHTML = '';
    let i = 0;
    function type() {
        if (i < html.length) {
            el.innerHTML += html[i];
            i++;
            chatWindow.scrollTop = chatWindow.scrollHeight;
            setTimeout(type, 3);
        }
    }
    type();
}

// ─── Senden ───
async function send() {
    const text = userInput.value.trim();
    if (!text) return;

    // Benutzernachricht anzeigen
    chatWindow.innerHTML += `<div class="msg user-msg">${text}</div>`;
    userInput.value = "";
    chatVerlauf.push({ role: "user", content: text });

    // "Denke"-Animation erstellen
    const thinkId = "think-" + Date.now();
    chatWindow.innerHTML += `<div class="msg bot-msg" id="${thinkId}">Denke <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        // Hier rufen wir den zusammengesetzten Key ab
        const key = getApiKey();

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${key}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: currentModel,
                messages: chatVerlauf,
                temperature: 0.7,
                max_tokens: 2048
            })
        });

        if (!res.ok) throw new Error(`API-Fehler: ${res.statusText}`);

        const data = await res.json();
        const antwort = data.choices[0].message.content;

        // Bot-Element vorbereiten (Denke-Text entfernen)
        const botEl = document.getElementById(thinkId);
        botEl.innerHTML = "";
        const span = document.createElement("span");
        botEl.appendChild(span);

        // Antwort speichern und mit Schreibmaschinen-Effekt anzeigen
        chatVerlauf.push({ role: "assistant", content: antwort });
        typeWriter(span, antwort);

    } catch (err) {
        console.error(err);
        const errorEl = document.getElementById(thinkId);
        if (errorEl) {
            errorEl.innerHTML = `Fehler: ${err.message}`;
        }
    }
}

sendBtn.onclick = send;
userInput.addEventListener("keypress", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
    }
});
</script>
</body>
</html>
