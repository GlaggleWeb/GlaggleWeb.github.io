<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --user-bubble: #334155;
            --bot-bubble: #1e293b;
            --accent: #38bdf8;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: #020617;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
        }

        #new-chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-slot {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-slot:hover { background: rgba(255,255,255,0.05); }
        .chat-slot.active { background: rgba(14, 165, 233, 0.1); color: var(--primary); border: 1px solid var(--primary); }

        /* Main */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        #chat-window {
            flex: 1;
            padding: 40px 15%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .msg-container { display: flex; width: 100%; }
        .msg-container.user { justify-content: flex-end; }
        .msg-container.bot { justify-content: flex-start; }

        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
        .bot .bubble { background: var(--bot-bubble); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

        /* Input Area */
        #input-area-wrapper { padding: 20px 15% 40px 15%; }

        #input-container {
            background: var(--panel-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            outline: none;
            font-size: 16px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: 50%;
        }

        .icon-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        #mic-btn.listening { color: #ef4444; background: rgba(239, 68, 68, 0.15); animation: pulse 1.5s infinite; }
        #send-btn { color: var(--primary); }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-bolt" style="color: var(--primary);"></i>
            <span>GLAME PRO</span>
        </div>
        <button id="new-chat-btn">Neuer Chat</button>
        <div id="chat-list"></div>
    </aside>

    <main id="main-container">
        <header id="chat-header">
            <div style="font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.03); padding: 5px 12px; border-radius: 20px;">
                <i class="fas fa-microchip" style="margin-right: 5px;"></i> Llama 3.3 Versatile
            </div>
            <div style="width: 35px; height: 35px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">U</div>
        </header>

        <div id="chat-window">
            <div class="msg-container bot">
                <div class="bubble">Hallo! Ich bin Glame Pro. Klicke auf das Mikrofon, um mit mir zu sprechen. 🎙️</div>
            </div>
        </div>

        <div id="input-area-wrapper">
            <div id="input-container">
                <button class="icon-btn" id="mic-btn" title="Spracheingabe starten">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="user-input" placeholder="Nachricht eingeben oder sprechen..." autocomplete="off">
                <button class="icon-btn" id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

<script>
    // API Key (Zerstückelt für Sicherheit)
    const lKey = "gsk_ImbDfvvSXzXJfw80" + "vZP5WGdyb3FYknkYv77z" + "RJZN3pfyA1PiRGWu";

    let allChats = JSON.parse(localStorage.getItem("glame_chats_v2")) || {};
    let currentChatId = localStorage.getItem("glame_active_id") || "chat_" + Date.now();

    const chatWindow = document.getElementById("chat-window");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const chatList = document.getElementById("chat-list");

    // --- SPRACHERKENNUNG SETUP ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = true; // Zwischenergebnisse zeigen
        recognition.continuous = false;   // Stoppt automatisch nach einem Satz

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add("listening");
            userInput.placeholder = "Ich höre zu...";
        };
        
        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove("listening");
            userInput.placeholder = "Nachricht eingeben oder sprechen...";
        };

        recognition.onerror = (event) => {
            isListening = false;
            micBtn.classList.remove("listening");
            
            if (event.error === 'not-allowed') {
                showSystemMessage("Mikrofon-Zugriff wurde verweigert. Bitte erlaube den Zugriff in deinen Browsereinstellungen.");
            } else if (event.error !== 'aborted') {
                console.warn("Erkennungsfehler:", event.error);
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript;
            userInput.value = transcript;
            
            // Wenn die Erkennung final ist, Nachricht senden
            if (event.results[event.results.length - 1].isFinal) {
                setTimeout(handleSend, 500); 
            }
        };
    }

    function showSystemMessage(text) {
        const container = document.createElement("div");
        container.className = "msg-container bot";
        container.innerHTML = `<div class="bubble" style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444;">${text}</div>`;
        chatWindow.appendChild(container);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // --- CHAT LOGIK ---
    window.onload = () => {
        if (!allChats[currentChatId]) {
            allChats[currentChatId] = [];
        }
        renderChatList();
        renderMessages();
    };

    function save() {
        localStorage.setItem("glame_chats_v2", JSON.stringify(allChats));
        localStorage.setItem("glame_active_id", currentChatId);
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        allChats[currentChatId].push({ role: "user", content: text });
        renderMessages();
        userInput.value = "";

        const tempId = "bot-" + Date.now();
        const container = document.createElement("div");
        container.className = "msg-container bot";
        container.innerHTML = `<div class="bubble" id="${tempId}">...</div>`;
        chatWindow.appendChild(container);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const history = (allChats[currentChatId] || []).slice(-6);
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${lKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "Du bist Glame Pro, ein hilfreicher Assistent. Antworte präzise auf Deutsch." },
                        ...history.map(m => ({ role: m.role, content: m.content }))
                    ]
                })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            document.getElementById(tempId).innerHTML = marked.parse(reply);
            allChats[currentChatId].push({ role: "assistant", content: reply });
            save();
            renderChatList();
        } catch (err) {
            document.getElementById(tempId).innerText = "Fehler bei der Verbindung zum Server.";
        }
    }

    function renderMessages() {
        chatWindow.innerHTML = "";
        const messages = allChats[currentChatId] || [];
        if (messages.length === 0) {
            chatWindow.innerHTML = `<div class="msg-container bot"><div class="bubble">Hallo! Wie kann ich dir heute helfen? 🎙️</div></div>`;
        }
        messages.forEach(msg => {
            const container = document.createElement("div");
            container.className = `msg-container ${msg.role === 'user' ? 'user' : 'bot'}`;
            container.innerHTML = `<div class="bubble">${msg.role === 'assistant' ? marked.parse(msg.content) : msg.content}</div>`;
            chatWindow.appendChild(container);
        });
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function renderChatList() {
        chatList.innerHTML = "";
        Object.keys(allChats).sort((a,b) => b.split("_")[1] - a.split("_")[1]).forEach(id => {
            const slot = document.createElement("div");
            slot.className = `chat-slot ${id === currentChatId ? 'active' : ''}`;
            const firstMsg = allChats[id].find(m => m.role === 'user');
            slot.innerText = firstMsg ? firstMsg.content.substring(0, 25) + "..." : "Leerer Chat";
            slot.onclick = () => {
                currentChatId = id;
                save();
                renderChatList();
                renderMessages();
            };
            chatList.appendChild(slot);
        });
    }

    document.getElementById("new-chat-btn").onclick = () => {
        currentChatId = "chat_" + Date.now();
        allChats[currentChatId] = [];
        save();
        renderChatList();
        renderMessages();
    };

    micBtn.onclick = () => {
        if (!recognition) {
            alert("Dein Browser unterstützt leider keine Spracherkennung.");
            return;
        }
        
        if (isListening) {
            recognition.stop();
        } else {
            try {
                // Hard reset vor Start
                recognition.abort(); 
                setTimeout(() => recognition.start(), 50);
            } catch (e) {
                isListening = false;
                micBtn.classList.remove("listening");
                console.warn("Neustart erforderlich...");
            }
        }
    };

    userInput.onkeypress = (e) => { if (e.key === "Enter") handleSend(); };
    sendBtn.onclick = handleSend;
</script>
</body>
</html>
