<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI Pro | Next Gen</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --user-bubble: #334155;
            --bot-bubble: #1e293b;
            --accent: #38bdf8;
            --glass: rgba(30, 41, 59, 0.7);
        }

        /* Themes */
        body.cyber-mode { --primary: #ff003c; --bg-dark: #050505; --panel-dark: #121212; --accent: #00ffcc; }
        body.gold-mode { --primary: #d4af37; --bg-dark: #1a1405; --panel-dark: #2a2410; --accent: #f3e5ab; }
        body.forest-mode { --primary: #22c55e; --bg-dark: #052e16; --panel-dark: #064e3b; --accent: #4ade80; }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 300px;
            background: #020617;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
            z-index: 50;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 10px;
        }

        .sidebar-header img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--primary);
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .chat-slot {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }

        .chat-slot:hover { background: rgba(255,255,255,0.08); color: white; }
        .chat-slot.active { background: var(--primary); color: white; border-color: var(--accent); }

        /* Main Content */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-dark);
        }

        #chat-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        #chat-window {
            flex: 1;
            padding: 40px 20%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        /* Messages */
        .msg-container { display: flex; flex-direction: column; max-width: 100%; }
        .msg-container.user { align-items: flex-end; }
        .msg-container.bot { align-items: flex-start; }

        .bubble {
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            max-width: 85%;
            position: relative;
        }

        .user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
        .bot .bubble { background: var(--bot-bubble); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .msg-image {
            max-width: 300px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 2px solid var(--primary);
        }

        /* Input Area */
        #input-area-wrapper {
            padding: 20px 20%;
            background: transparent;
        }

        #input-container {
            background: var(--panel-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        #send-btn { background: var(--primary); color: white; }
        #send-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 450px;
            background: var(--panel-dark);
            padding: 30px;
            border-radius: 28px;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* Image Preview */
        #image-preview-container {
            display: none;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            position: relative;
        }
        #image-preview-container img {
            max-height: 80px;
            border-radius: 8px;
        }
        .remove-img {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        /* Markdown Styles */
        .bubble h1, .bubble h2 { font-size: 1.2rem; margin-top: 10px; color: var(--primary); }
        .bubble code { background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; font-family: monospace; color: #fbbf24; }
        .bubble pre { background: #000; padding: 15px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
        
        @media (max-width: 1024px) {
            #sidebar { width: 80px; padding: 15px 10px; align-items: center; }
            .sidebar-header span, .chat-slot, #new-chat-btn span { display: none; }
            #chat-window, #input-area-wrapper { padding: 20px 5%; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <!-- Login Modal -->
    <div class="modal" id="login-modal">
        <h2 style="text-align: center;">Welcome to Glame AI Pro</h2>
        <p style="text-align: center; color: var(--text-muted);">Dein intelligenter Begleiter</p>
        <input type="text" id="user-name" placeholder="Dein Name">
        <button class="action-btn" id="login-confirm">Loslegen ⚡</button>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <h3>Einstellungen</h3>
        <label>KI-Modell</label>
        <select id="model-select">
            <option value="gemini-2.5-flash-preview-09-2025">Gemini 1.5 Flash (Bilder + Speed)</option>
            <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Text Pro)</option>
            <option value="llama-3.1-8b-instant">Llama 3.1 8B (Schnell)</option>
        </select>
        
        <label>Design</label>
        <select id="theme-select">
            <option value="default">Ocean Dark</option>
            <option value="cyber">Cyberpunk</option>
            <option value="gold">Luxury Gold</option>
            <option value="forest">Emerald Forest</option>
        </select>

        <button class="action-btn" id="settings-save">Speichern</button>
        <button class="action-btn" style="background: #ef4444;" id="delete-data">Daten löschen</button>
    </div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <img src="https://cdn-icons-png.flaticon.com/512/2103/2103633.png" alt="Logo">
            <span style="font-weight: bold; font-size: 1.2rem;">Glame AI</span>
        </div>
        <button class="action-btn" id="new-chat-btn" style="margin-top:0;">
            <i class="fas fa-plus"></i> <span>Neuer Chat</span>
        </button>
        <div id="chat-list"></div>
        <div style="margin-top: auto; padding-top: 20px; color: var(--text-muted); font-size: 12px; text-align: center;">
            Version 4.0 Pro
        </div>
    </aside>

    <main id="main-container">
        <header id="chat-header">
            <div id="model-badge" style="background: rgba(14, 165, 233, 0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--primary); font-size: 12px; color: var(--primary);">
                Gemini 1.5 Flash
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button class="icon-btn" id="open-settings"><i class="fas fa-cog"></i></button>
                <div id="avatar-circle" style="width: 35px; height: 35px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">G</div>
            </div>
        </header>

        <div id="chat-window">
            <div class="msg-container bot">
                <div class="bubble">
                    Hallo! Ich bin <b>Glame</b>. Ich nutze jetzt Gemini 1.5 Flash für blitzschnelle Antworten und Bildanalysen. Wie kann ich dir helfen? ✨
                </div>
            </div>
        </div>

        <div id="input-area-wrapper">
            <div id="image-preview-container">
                <span class="remove-img" id="remove-img-btn">×</span>
                <img id="image-preview" src="">
            </div>

            <div id="input-container">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <button class="icon-btn" id="attach-btn" title="Bild hochladen">
                    <i class="fas fa-camera"></i>
                </button>
                <input type="text" id="user-input" placeholder="Frag mich was..." autocomplete="off">
                <button class="icon-btn" id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // State
        let apiKey = "AIzaSyD7VztHGsr1UCI-0jprPdr0iRU3hFQrK-c"; // Wird von der Umgebung gefüllt
        let currentUser = JSON.parse(localStorage.getItem("glame_pro_user")) || null;
        let allChats = JSON.parse(localStorage.getItem("glame_pro_chats")) || {};
        let currentChatId = localStorage.getItem("glame_pro_active_id") || "chat_" + Date.now();
        let selectedModel = "gemini-1.5-flash-preview-09-2025";
        let currentImageBase64 = null;

        // UI Elements
        const chatWindow = document.getElementById("chat-window");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatList = document.getElementById("chat-list");
        const attachBtn = document.getElementById("attach-btn");
        const imageInput = document.getElementById("image-input");
        const imagePreviewContainer = document.getElementById("image-preview-container");
        const imagePreview = document.getElementById("image-preview");

        // Init
        window.onload = () => {
            if (!currentUser) {
                showModal("login-modal");
            } else {
                document.getElementById("avatar-circle").innerText = currentUser.name.charAt(0).toUpperCase();
            }

            if (!allChats[currentChatId]) {
                createNewChat();
            }
            renderChatList();
            renderMessages();
            updateModelBadge();
        };

        // Modal Management
        function showModal(id) {
            document.getElementById(id).style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function hideModals() {
            document.querySelectorAll(".modal").forEach(m => m.style.display = "none");
            document.getElementById("overlay").style.display = "none";
        }

        // Event Listeners
        document.getElementById("login-confirm").onclick = () => {
            const name = document.getElementById("user-name").value.trim();
            if (name) {
                currentUser = { name };
                localStorage.setItem("glame_pro_user", JSON.stringify(currentUser));
                document.getElementById("avatar-circle").innerText = name.charAt(0).toUpperCase();
                hideModals();
            }
        };

        document.getElementById("open-settings").onclick = () => showModal("settings-modal");
        document.getElementById("settings-save").onclick = () => {
            selectedModel = document.getElementById("model-select").value;
            const theme = document.getElementById("theme-select").value;
            document.body.className = theme === "default" ? "" : theme + "-mode";
            updateModelBadge();
            hideModals();
        };

        document.getElementById("delete-data").onclick = () => {
            if (confirm("Wirklich alles löschen?")) {
                localStorage.clear();
                location.reload();
            }
        };

        document.getElementById("new-chat-btn").onclick = createNewChat;

        attachBtn.onclick = () => {
            if (selectedModel.includes("gemini")) {
                imageInput.click();
            } else {
                alert("Bild-Upload ist nur mit Gemini-Modellen verfügbar.");
            }
        };

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageBase64 = event.target.result.split(',')[1];
                    imagePreview.src = event.target.result;
                    imagePreviewContainer.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById("remove-img-btn").onclick = () => {
            currentImageBase64 = null;
            imagePreviewContainer.style.display = "none";
            imageInput.value = "";
        };

        userInput.onkeypress = (e) => { if (e.key === "Enter") handleSend(); };
        sendBtn.onclick = handleSend;

        // Functions
        function createNewChat() {
            currentChatId = "chat_" + Date.now();
            allChats[currentChatId] = [];
            localStorage.setItem("glame_pro_active_id", currentChatId);
            localStorage.setItem("glame_pro_chats", JSON.stringify(allChats));
            renderChatList();
            renderMessages();
            imagePreviewContainer.style.display = "none";
            currentImageBase64 = null;
        }

        function updateModelBadge() {
            const badge = document.getElementById("model-badge");
            if (selectedModel.includes("gemini")) {
                badge.innerText = "Gemini 1.5 Flash";
                badge.style.borderColor = "#0ea5e9";
                attachBtn.style.opacity = "1";
            } else {
                badge.innerText = "Llama 3.3 Pro";
                badge.style.borderColor = "#22c55e";
                attachBtn.style.opacity = "0.3";
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text && !currentImageBase64) return;

            const userMsg = { 
                role: "user", 
                content: text, 
                image: currentImageBase64 ? imagePreview.src : null 
            };
            
            allChats[currentChatId].push(userMsg);
            renderMessages();
            
            userInput.value = "";
            const activeImage = currentImageBase64; // local copy
            currentImageBase64 = null;
            imagePreviewContainer.style.display = "none";

            // Typing Indicator
            const botMsgId = "bot-" + Date.now();
            addMessageToUI("bot", "...", botMsgId);

            try {
                const responseText = await callAI(text, activeImage);
                updateBotMessage(botMsgId, responseText);
                
                allChats[currentChatId].push({ role: "assistant", content: responseText });
                localStorage.setItem("glame_pro_chats", JSON.stringify(allChats));
                renderChatList();
            } catch (err) {
                updateBotMessage(botMsgId, "Hoppla, da ist was schiefgelaufen. " + err.message);
            }
        }

        async function callAI(prompt, base64Image = null) {
            let retryCount = 0;
            const maxRetries = 5;

            const executeRequest = async () => {
                let url, payload;

                if (selectedModel.includes("gemini")) {
                    url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
                    
                    const parts = [{ text: prompt }];
                    if (base64Image) {
                        parts.push({
                            inlineData: {
                                mimeType: "image/png",
                                data: base64Image
                            }
                        });
                    }

                    payload = {
                        contents: [{ parts: parts }],
                        systemInstruction: { parts: [{ text: "Du bist Glame Pro, eine hilfreiche und moderne KI. Antworte in klarem Deutsch mit Markdown-Formatierung." }] }
                    };
                } else {
                    // Fallback Groq (Legacy)
                    url = "https://api.groq.com/openai/v1/chat/completions";
                    payload = {
                        model: selectedModel,
                        messages: [{ role: "system", content: "Du bist Glame Pro." }, ...allChats[currentChatId]]
                    };
                }

                const res = await fetch(url, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        // Beispiel für einen Gemini Key (ersetze die Teile durch deinen echten Key)
const partA = "AIzaSy"; 
const partB = "D3fG_hIjkLmNoP"; 
const partC = "qRsTuVwXyZ1234";

// Die Funktion, die den Key erst "on-the-fly" zusammenbaut
function getKey() {
    return partA + partB + partC;
}
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("API Error");

                const data = await res.json();
                if (selectedModel.includes("gemini")) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return data.choices[0].message.content;
                }
            };

            while (retryCount < maxRetries) {
                try {
                    return await executeRequest();
                } catch (e) {
                    retryCount++;
                    await new Promise(r => setTimeout(r, Math.pow(2, retryCount) * 1000));
                    if (retryCount === maxRetries) throw e;
                }
            }
        }

        function renderMessages() {
            chatWindow.innerHTML = "";
            const history = allChats[currentChatId] || [];
            history.forEach(msg => {
                const container = document.createElement("div");
                container.className = `msg-container ${msg.role === 'user' ? 'user' : 'bot'}`;
                
                let innerHTML = "";
                if (msg.image) {
                    innerHTML += `<img src="${msg.image}" class="msg-image">`;
                }
                innerHTML += `<div class="bubble">${msg.role === 'assistant' ? marked.parse(msg.content) : msg.content}</div>`;
                
                container.innerHTML = innerHTML;
                chatWindow.appendChild(container);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addMessageToUI(role, text, id) {
            const container = document.createElement("div");
            container.className = `msg-container ${role}`;
            container.id = id;
            container.innerHTML = `<div class="bubble">${text}</div>`;
            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function updateBotMessage(id, text) {
            const bubble = document.getElementById(id).querySelector(".bubble");
            bubble.innerHTML = marked.parse(text);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function renderChatList() {
            chatList.innerHTML = "";
            const keys = Object.keys(allChats).sort((a,b) => b.split('_')[1] - a.split('_')[1]);
            keys.forEach(id => {
                const slot = document.createElement("div");
                slot.className = `chat-slot ${id === currentChatId ? 'active' : ''}`;
                const firstUserMsg = allChats[id].find(m => m.role === 'user');
                slot.innerText = firstUserMsg ? firstUserMsg.content.substring(0, 25) + "..." : "Leerer Chat";
                slot.onclick = () => {
                    currentChatId = id;
                    localStorage.setItem("glame_pro_active_id", id);
                    renderChatList();
                    renderMessages();
                };
                chatList.appendChild(slot);
            });
        }
    </script>
</body>
</html>
