<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glame AI Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #008C9C;
            --primary-hover: #00616E;
            --user-bg: #B00000;
            --bg: #f0f2f5;
            --text: #333;
            --panel: #ffffff;
            --danger: #d9534f;
        }

        /* DESIGN THEMES */
        body.dark-mode   { --bg: #121212; --text: #eee;    --panel: #222;    --primary: #333; }
        body.gold-mode   { --bg: #fdf5e6; --text: #5d4037; --panel: #fffaf0; --primary: #D4AF37; }
        body.cyber-mode  { --bg: #0d0221; --text: #00ff41; --panel: #1a1a2e; --primary: #e94560; }
        body.sakura-mode { --bg: #fff0f5; --text: #d02090; --panel: #fff;    --primary: #ffb7c5; }
        body.modern-mode { --bg: #288E99; --text: #FFFFFF; --panel: #95BFC7; --primary: #2B8C08; }
        body.nord-mode   { --bg: #2e3440; --text: #eceff4; --panel: #3b4252; --primary: #88c0d0; }
        body.synth-mode  { --bg: #2b213a; --text: #ff7edb; --panel: #241b2f; --primary: #36f9f6; }
        body.forest-mode { --bg: #1b2621; --text: #e8f3e8; --panel: #2a3b32; --primary: #8fb339; }
        body.coffee-mode { --bg: #231f20; --text: #d7ccc8; --panel: #3e2723; --primary: #bcaaa4; }
        body.slate-mode  { --bg: #f8fafc; --text: #1e293b; --panel: #ffffff; --primary: #3b82f6; }
        body.high-contrast { --bg: #000000; --text: #ffffff; --panel: #000000; --primary: #ffff00; }
        body.midnight-mode { --bg: #00040a; --text: #94a3b8; --panel: #0f172a; --primary: #38bdf8; }
        
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
            overflow: hidden;
            transition: background 0.5s ease;
        }

        #chat-wrapper {
            width: 95%;
            max-width: 1900px;
            height: 85vh;
            background: var(--panel);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            align-items: center;
        }

        #chat-header {
            background: #222;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 18px;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }
        #chat-window::-webkit-scrollbar { display: none; }

        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .bot-msg { align-self: flex-start; background: var(--primary); color: white; border-bottom-left-radius: 4px; }
        .user-msg { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }

        .code-container {
            background: #1a1a1a;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #333;
            overflow: hidden;
            width: 100%;
            display: block;
            color: #efefef;
        }

        .code-header {
            background: #2d2d2d;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        .code-header span {
            font-size: 11px;
            font-weight: bold;
            color: #9cdcfe;
            text-transform: uppercase;
        }

        .copy-btn {
            background: #444;
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            min-width: 80px;
        }

        .copy-btn:hover { background: #555; }

        pre {
            margin: 0;
            padding: 15px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            color: #d4d4d4;
            background: #1a1a1a;
            line-height: 1.4;
            text-align: left;
        }

        #chat-input-area {
            display: flex;
            padding: 15px 20px;
            background: rgba(0,0,0,0.03);
            border-top: 1px solid rgba(0,0,0,0.1);
            gap: 12px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            border: 1px solid #ccc;
            padding: 12px 18px;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }
        #user-input:focus {
            border: 3px solid var(--primary);
            box-shadow: 0 0 10px rgba(0, 140, 156, 0.2);
        }

        .btn-circle {
            width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: var(--primary); color: white; transition: all 0.3s ease;
            flex-shrink: 0; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #welcome-modal {
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 85%; 
            max-width: 350px; 
            background: var(--panel); 
            padding: 30px; 
            border-radius: 25px; 
            z-index: 1000; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        #welcome-modal h2 { margin-top: 0; color: var(--primary); font-size: 22px; }
        #welcome-modal input {
            width: 100%; padding: 12px; margin-top: 15px; border-radius: 20px; 
            border: 1px solid #ddd; outline: none; font-size: 14px; box-sizing: border-box; 
            transition: border 1s;
        }
        #welcome-modal input:focus { border: 3px solid var(--primary); }
        #welcome-modal .action-btn {
            width: 100%; padding: 14px; background: var(--primary); color: white; 
            border: none; border-radius: 20px; margin-top: 20px; font-weight: bold; 
            cursor: pointer; transition: transform 1s, background 1s;
        }

        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(8px); }
        
        #settings-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 400px; background: var(--panel); padding: 25px; border-radius: 20px; z-index: 100;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        #user-avatar {
            text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-shrink: 0;
        }
        .btn-circle:hover { transform: scale(1.1); }
        .icon-white { filter: brightness(0) invert(1); width: 24px; height: 24px; }

        .thinking-dots span { animation: blink 1.4s infinite both; font-size: 24px; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        #sidebar {
            width: 260px; background: #1a1a1a; color: white; padding: 20px;
            display: flex; flex-direction: column; border-right: 1px solid #333; flex-shrink: 0;
        }

        .chat-slot {
            padding: 12px; margin-bottom: 10px; background: #2d2d2d; border-radius: 10px;
            cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; border: 1px solid transparent;
        }
        .chat-slot:hover { background: #3d3d3d; }
        .chat-slot.active { border-color: var(--primary); background: #333; }

        @media (max-width: 768px) {
            #sidebar { width: 60px; padding: 10px; }
            #sidebar h2, #sidebar button { display: none; }
        }

        .bot-msg pre {
    background: #1a1a1a;
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
}

.bot-msg code {
    color: #00ffcc;
}
    </style>
</head>
<body>

    <div class="modal-overlay" id="overlay"></div>

    <div id="welcome-modal">
        <h2>Willkommen bei Glame AI! ✨</h2>
        <p style="font-size: 14px; opacity: 0.8;">Erstelle kurz ein Konto um loszulegen.</p>
        <input type="text" id="setup-username" placeholder="Dein Benutzername">
        <input type="email" id="setup-email" placeholder="Deine E-Mail Adresse">
        <button class="action-btn" id="start-btn">Jetzt starten 🚀</button>
    </div>

    <div id="settings-modal">
        <h3 style="margin:0 0 15px 0;">Einstellungen</h3>
        
        <label style="font-size:12px; font-weight:bold;">KI-MODELL</label>
        <select id="model-select">
            <optgroup label="Llama 3.3 & 3.1">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Standard)</option>
                <option value="llama-3.1-8b-instant" selected>Llama 3.1 8B (Gratis-Favorit)</option>
            </optgroup>
        </select>

        <label style="font-size: 12px; font-weight: bold; margin-top: 10px; display: block;">KI-STIL</label>
        <select id="soul-select">
            <option value="standard">Standard Glame (Empfohlen)</option>
            <option value="chatgpt_style">ChatGPT ✨</option>
            <option value="gemini_style">Google Gemini 🎓</option>
            <option value="claude_style">Claude 🌿</option>
            <option value="grok_style">Frechdachs 😜</option>
            <option value="hacker">Hacker 💻</option>
        </select>

        <label style="font-size:12px; font-weight:bold; display:block; margin-top:10px;">DESIGN</label>
        <select id="theme-select">
            <option value="default">Glaggle Blau</option>
            <option value="dark">Dark Mode</option>
            <option value="gold">Gold Edition</option>
            <option value="cyber">Cyberpunk</option>
            <option value="sakura">Sakura Pink</option>
            <option value="modern">Modern</option>
            <option value="nord">Nordic Ice</option>
            <option value="synth">Synthwave 84</option>
            <option value="forest">Evergreen</option>
            <option value="coffee">Espresso</option>
            <option value="slate">Slate</option>
            <option value="midnight">Midnight</option>
        </select>

        <button class="action-btn" id="save-settings">Speichern</button>
        <button class="action-btn reset-btn" id="reset-chat" style="background: #d9534f;">Chat zurücksetzen</button>
        <button class="action-btn reset-btn" id="reset-everything" style="background: #d9534f; margin-top: 5px;">Konto Löschen</button>
    </div>

    <div id="main-container" style="display: flex; width: 100vw; height: 100vh;">
        
        <div id="sidebar">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px;">Glame Chats</h2>
            <button class="action-btn" id="new-chat-btn" style="background: var(--primary); color:white; border:none; padding:10px; border-radius:10px; cursor:pointer;">+ Neuer Chat</button>
            <div id="chat-list" style="margin-top: 20px; flex: 1; overflow-y: auto;"></div>
        </div>

        <div id="chat-wrapper" style="flex: 1; display: flex; flex-direction: column; position: relative;">
            
            <div id="chat-header">
                <img src="glagglesonne.png" style="width: 32px; height: 32px; border-radius: 50%;" id="header-logo" onerror="this.src='https://via.placeholder.com/32'">
                <span style="margin-left: 10px;">Glame 3.0</span>
                <div id="user-avatar" style="margin-left: auto; width: 35px; height: 35px; background: var(--user-bg); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 2px solid rgba(255,255,255,0.2);"></div>
            </div> 
            
            <div id="chat-window">
                <div class="bot-msg">Hallo! Ich bin Glame. Wie kann ich dir heute helfen?</div>
            </div>

            <div id="chat-input-area">
                <button class="btn-circle" id="open-settings">
                    <svg class="icon-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="white" stroke-width="2"/>
                        <path d="M19.4 15L21.7 12.8C22.1 12.4 22.1 11.7 21.7 11.3L19.4 9.1C19.1 8.8 19 8.4 19.1 8L19.7 4.9C19.8 4.3 19.4 3.7 18.8 3.6L15.7 3C15.3 2.9 14.9 2.8 14.6 2.5L12.4 0.3C12 -0.1 11.3 -0.1 10.9 0.3L8.7 2.5C8.4 2.8 8 2.9 7.6 3L4.5 3.6C3.9 3.7 3.5 4.3 3.6 4.9L4.2 8C4.3 8.4 4.2 8.8 3.9 9.1L1.6 11.3C1.2 11.7 1.2 12.4 1.6 12.8L3.9 15C4.2 15.3 4.3 15.7 4.2 16.1L3.6 19.2C3.5 19.8 3.9 20.4 4.5 20.5L7.6 21.1C8 21.2 8.4 21.3 8.7 21.6L10.9 23.8C11.3 24.2 12 24.2 12.4 23.8L14.6 21.6C14.9 21.3 15.3 21.2 15.7 21.1L18.8 20.5C19.4 20.4 19.8 19.8 19.7 19.2L19.1 16.1C19 15.7 19.1 15.3 19.4 15Z" stroke="white" stroke-width="2"/>
                    </svg>
                </button>
                <input type="text" id="user-input" placeholder="Nachricht..." autocomplete="off">
                <button class="btn-circle" id="send-btn" style="font-size: 24px;">➤</button>
            </div>
        </div>

    </div>

<script>
const welcomeModal = document.getElementById("welcome-modal");
const settingsModal = document.getElementById("settings-modal"); 
const overlay = document.getElementById("overlay");
const setupBtn = document.getElementById("start-btn");
const chatWindow = document.getElementById("chat-window");
const userInput = document.getElementById("user-input");
const userAvatar = document.getElementById("user-avatar");

const seelen = {
    standard: "Du bist Glame, die ultimative KI-Mischung. Klare Struktur, Emojis ✨, menschliche Wärme. Du bist ein Er.",
    chatgpt_style: "Verhalte dich wie ChatGPT. Modern, klar, viele Emojis ✨.",
    gemini_style: "Verhalte dich wie Google Gemini. Höflicher Mentor, fette Überschriften.",
    claude_style: "Verhalte dich wie Claude. Fast keine Emojis, literarisch, klug.",
    grok_style: "Verhalte dich wie Grok. Frech, sarkastisch, direkt 😜.",
    hacker: "Du bist 'Neo', ein Elite-Hacker. Kühl und technisch. 💻"
};

let currentModel = "llama-3.1-8b-instant";
let chatVerlauf = [{ role: "system", content: seelen.standard }];
let allChats = JSON.parse(localStorage.getItem("glame_all_chats")) || {};
let currentChatId = localStorage.getItem("glame_active_id") || "chat_" + Date.now();

// Initialisierung
window.addEventListener('DOMContentLoaded', () => {
    const userStored = localStorage.getItem('glame_user');
    if (userStored) {
        const userData = JSON.parse(userStored);
        updateAvatar(userData.name);
    } else {
        welcomeModal.style.display = "block";
        overlay.style.display = "block";
    }
    if (!allChats[currentChatId]) {
        allChats[currentChatId] = [{ role: "system", content: seelen.standard }];
    }
    chatVerlauf = allChats[currentChatId];
    renderChatList();
    renderMessages();
});

setupBtn.onclick = () => {
    const name = document.getElementById("setup-username").value.trim();
    const email = document.getElementById("setup-email").value.trim();
    if (name && email) {
        localStorage.setItem('glame_user', JSON.stringify({ name, email }));
        updateAvatar(name);
        welcomeModal.style.display = "none";
        overlay.style.display = "none";
        location.reload();
    }
};

document.getElementById("open-settings").onclick = () => { 
    settingsModal.style.display = "block"; 
    overlay.style.display = "block"; 
};

document.getElementById("save-settings").onclick = () => {
    settingsModal.style.display = "none"; 
    overlay.style.display = "none";
    currentModel = document.getElementById("model-select").value;
    const theme = document.getElementById("theme-select").value;
    document.body.className = (theme === "default") ? "" : theme + "-mode";
    const selectedSoul = document.getElementById("soul-select").value;
    chatVerlauf[0].content = seelen[selectedSoul];
    allChats[currentChatId] = chatVerlauf;
    localStorage.setItem("glame_all_chats", JSON.stringify(allChats));
};

function updateAvatar(name) {
    if (name && userAvatar) {
        userAvatar.innerText = name.charAt(0).toUpperCase();
        userAvatar.style.display = "flex";
    }
}

async function antwortSenden() {
    const text = userInput.value.trim();
    if (!text) return;

    // USER MESSAGE
    chatVerlauf.push({ role: "user", content: text });
    renderMessages();
    userInput.value = "";

    // THINKING...
    const thinkingId = "think-" + Date.now();
    const thinkingDiv = document.createElement("div");
    thinkingDiv.className = "bot-msg";
    thinkingDiv.id = thinkingId;
    thinkingDiv.innerHTML = `<b>Glame:</b> <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>`;
    chatWindow.appendChild(thinkingDiv);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
        const p1 = "gsk_"; 
        const p2 = "ImbDfvvSXzXJfw80vZP5";
        const p3 = "WGdyb3FYknkYv77zRJZN3pfyA1PiRGWu";
        
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + p1 + p2 + p3,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: currentModel,
                messages: chatVerlauf
            })
        });

        const data = await res.json();
        const antwort = data.choices[0].message.content;

        // REMOVE THINKING
        document.getElementById(thinkingId).remove();

        // SAVE
        chatVerlauf.push({ role: "assistant", content: antwort });
        allChats[currentChatId] = chatVerlauf;
        localStorage.setItem("glame_all_chats", JSON.stringify(allChats));

        // CREATE MESSAGE
        const div = document.createElement("div");
        div.className = "bot-msg";
        chatWindow.appendChild(div);

        // TYPEWRITER
        typeWriter(div, antwort);

        chatWindow.scrollTop = chatWindow.scrollHeight;
        renderChatList();

    } catch (e) {
        document.getElementById(thinkingId).innerHTML = "Fehler!";
        console.error(e);
    }
}

function renderMessages() {
    chatWindow.innerHTML = "";
    chatVerlauf.forEach(msg => {
        if (msg.role === "system") return;
        const div = document.createElement("div");
        div.className = msg.role === "assistant" ? "bot-msg" : "user-msg";
        if (msg.role === "assistant") {
    div.innerHTML = `<b>Glame:</b> ` + marked.parse(msg.content);
} else {
    div.textContent = msg.content;
}
        chatWindow.appendChild(div);
    });
    chatWindow.scrollTop = chatWindow.scrollHeight;
}
addCopyButtons();
hljs.highlightAll();
    
function renderChatList() {
    const list = document.getElementById("chat-list");
    list.innerHTML = "";
    Object.keys(allChats).reverse().slice(0, 10).forEach(id => {
        const slot = document.createElement("div");
        slot.className = `chat-slot ${id === currentChatId ? 'active' : ''}`;
        const firstMsg = allChats[id].find(m => m.role === "user");
        slot.innerText = firstMsg ? firstMsg.content.substring(0, 20) + "..." : "Neuer Chat";
        slot.onclick = () => {
            currentChatId = id;
            localStorage.setItem("glame_active_id", id);
            chatVerlauf = allChats[id];
            renderMessages();
            renderChatList();
        };
        list.appendChild(slot);
    });
}

document.getElementById("new-chat-btn").onclick = () => {
    const newId = "chat_" + Date.now();
    allChats[newId] = [{ role: "system", content: seelen.standard }];
    currentChatId = newId;
    localStorage.setItem("glame_active_id", newId);
    chatVerlauf = allChats[newId];
    renderMessages();
    renderChatList();
};

document.getElementById("send-btn").onclick = antwortSenden;
userInput.onkeypress = (e) => { if(e.key === "Enter") antwortSenden(); };

overlay.onclick = () => {
    settingsModal.style.display = "none";
    overlay.style.display = "none";
};

document.getElementById("reset-everything").onclick = () => {
    if (confirm("Konto wirklich löschen?")) {
        localStorage.clear();
        location.reload();
    }
};

function typeWriter(element, text, speed = 15) {
    let i = 0;
    element.innerHTML = "<b>Glame:</b> ";
    
    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        } else {
            // Nach dem Tippen → Markdown rendern
            const raw = element.innerHTML.replace("<b>Glame:</b> ", "");
            element.innerHTML = "<b>Glame:</b> " + marked.parse(raw, {
    highlight: function(code, lang) {
        return hljs.highlightAuto(code).value;
    }
});

addCopyButtons();
hljs.highlightAll();
        }
    }

    typing();
}

function addCopyButtons() {
    document.querySelectorAll("pre").forEach((block) => {
        // verhindern doppelte Buttons
        if (block.parentElement.classList.contains("code-container")) return;

        const container = document.createElement("div");
        container.className = "code-container";

        const header = document.createElement("div");
        header.className = "code-header";

        const label = document.createElement("span");
        label.innerText = "CODE";

        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.innerText = "Copy";

        btn.onclick = () => {
            const code = block.innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy", 1500);
        };

        header.appendChild(label);
        header.appendChild(btn);

        block.parentNode.insertBefore(container, block);
        container.appendChild(header);
        container.appendChild(block);
    });
}
</script>
</body>
</html>
