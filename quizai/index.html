<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Quiz Studio Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff; --text-color: #333333;
            --card-bg: #fdfdfd; --card-border: #eeeeee;
            --accent: #70C4F7;
            --accent-gradient: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #202124; --text-color: #e8eaed; --card-bg: #303134; --card-border: #444444; }
        }

        body { background: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; }
        
        .glaggle-card {
            background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 20px;
            border: 1px solid var(--card-border); transition: 0.3s;
        }
        .special-card { border: 2px solid transparent; background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--accent-gradient) border-box; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); box-sizing: border-box; }
        
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (min-width: 600px) { .control-grid { grid-template-columns: 2fr 2fr 1fr 1fr; } }

        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        .option-label { display: block; padding: 12px; margin: 8px 0; background: rgba(112, 196, 247, 0.1); border-radius: 12px; cursor: pointer; }
        .slider-box { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 15px; margin-top: 10px; }
        .slider-input-sync { width: 80px; text-align: center; font-weight: bold; border-color: var(--accent); margin-left: 10px; display: inline-block; }

        .loader { display: none; width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* PDF / Druck-Optimierung */
        @media print {
            .btn-row, .loader, .special-card, #action-area { display: none !important; }
            body { background: white; color: black; }
            .glaggle-card { border: 1px solid #ccc; break-inside: avoid; }
            .option-label { border: 1px solid #eee; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">✨ Glaggle Quiz Studio Pro</h1>

    <div class="glaggle-card special-card">
        <h3>Steuerung</h3>
        <div class="control-grid">
            <input type="text" id="quiz-topic" placeholder="Thema...">
            <input type="text" id="quiz-filename" placeholder="Name">
            <select id="q-count">
                <option value="3">3 Fragen</option>
                <option value="5" selected>5 Fragen</option>
                <option value="10">10 Fragen</option>
            </select>
            <select id="difficulty">
                <option value="leicht">Leicht</option>
                <option value="mittel" selected>Mittel</option>
                <option value="extrem schwer">Extrem Schwer</option>
            </select>
        </div>
        <div class="btn-row">
            <button class="btn" onclick="generateQuestions(false)">Neues Quiz</button>
            <button class="btn" style="background:#FBBC05" onclick="generateQuestions(true)">Hinzufügen (+)</button>
            <button class="btn" style="background:#6c757d" onclick="document.getElementById('file-input').click()">📂 Öffnen</button>
            <button class="btn" style="background:#000" onclick="window.print()">🖨️ PDF / Drucken</button>
        </div>
        <input type="file" id="file-input" style="display:none" accept=".json" onchange="loadQuizFile(event)">
        <div id="loader" class="loader"></div>
    </div>

    <div id="quiz-display"></div>

    <div id="action-area" style="display:none; margin-bottom: 50px;">
        <div class="btn-row">
            <button class="btn" style="background:#34A853" onclick="evaluateQuiz()">Auswerten ✨</button>
            <button class="btn" style="background:#EA4335" onclick="saveQuiz()">💾 Speichern</button>
        </div>
        <div id="eval-markdown" class="glaggle-card" style="display:none"></div>
    </div>
</div>

<script>
    const s1 = "gsk_"; 
    const s2 = "GpVmwabGZMyCM3QbwLbJWGdyb3FYG"; 
    const s3 = "uvDgzX0ufZbPwvnqxDZ9JNI";
    const getK = () => s1 + s2 + s3;

    let currentQuiz = [];

    async function generateQuestions(append = false) {
        const topic = document.getElementById('quiz-topic').value || "Allgemeinwissen";
        const count = document.getElementById('q-count').value;
        const level = document.getElementById('difficulty').value;
        const loader = document.getElementById('loader');
        
        loader.style.display = "block";

        try {
            const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${getK()}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{
                        role: "system",
                        content: `Erstelle ${count} Fragen zu "${topic}" (${level}).
                        REGELN:
                        1. Bevorzuge Typ 'choice' (70% der Fragen).
                        2. 'slider' nur bei Zahlen. Gib immer ein "range": [min_korrekt, max_korrekt] an.
                        3. 'text' nur für kurze Begriffe. Gib bei 'correct' alternative Schreibweisen mit Komma getrennt an (z.B. "Eiffelturm, Eiffel Turm").
                        4. Jede Frage MUSS ein Feld "desc" haben mit einer 2-3 sätzigen Erklärung der Lösung.
                        FORMAT: {"qs": [{"type": "choice", "q": "..", "opts": ["A","B","C"], "correct": "A", "desc": ".."}, {"type": "slider", "q": "..", "min": 0, "max": 100, "range": [40, 50], "correct": 45, "desc": ".."}, {"type": "text", "q": "..", "correct": "Wort1, Wort2", "desc": ".."}]}`
                    }]
                })
            });

            const data = await resp.json();
            const cleanJson = data.choices[0].message.content.match(/\{[\s\S]*\}/)[0];
            const newQs = JSON.parse(cleanJson).qs;

            currentQuiz = append ? [...currentQuiz, ...newQs] : newQs;
            render();
        } catch (e) { alert("Fehler: " + e.message); }
        finally { loader.style.display = "none"; }
    }

    function render() {
        const display = document.getElementById('quiz-display');
        display.innerHTML = currentQuiz.map((q, i) => `
            <div class="glaggle-card">
                <h4>${i + 1}. ${q.q}</h4>
                <div>${renderInput(q, i)}</div>
                <div id="feedback-${i}" style="margin-top:10px; display:none; padding:15px; border-radius:12px;"></div>
            </div>
        `).join('');
        document.getElementById('action-area').style.display = "block";
    }

    function renderInput(q, i) {
        if (q.type === 'choice') return q.opts.map(o => `<label class="option-label"><input type="radio" name="r${i}" value="${o}"> ${o}</label>`).join('');
        if (q.type === 'slider') {
            return `<div class="slider-box">
                <input type="range" id="range${i}" min="${q.min}" max="${q.max}" value="${q.min}" oninput="document.getElementById('ans${i}').value = this.value">
                Wert: <input type="number" id="ans${i}" class="slider-input-sync" value="${q.min}" oninput="document.getElementById('range${i}').value = this.value">
                <div style="display:flex; justify-content:space-between; font-size:0.7rem;"><span>${q.min}</span><span>${q.max}</span></div>
            </div>`;
        }
        return `<input type="text" id="ans${i}" placeholder="Antwort eintippen...">`;
    }

    function evaluateQuiz() {
        let score = 0;
        currentQuiz.forEach((q, i) => {
            const feedback = document.getElementById(`feedback-${i}`);
            let userAns = "";
            if (q.type === 'choice') {
                const checked = document.querySelector(`input[name="r${i}"]:checked`);
                userAns = checked ? checked.value : "";
            } else {
                userAns = document.getElementById(`ans${i}`).value.trim();
            }

            let isCorrect = false;
            if (q.type === 'slider' && q.range) {
                const val = parseFloat(userAns);
                isCorrect = val >= q.range[0] && val <= q.range[1];
            } else {
                const acceptable = q.correct.split(',').map(v => v.trim().toLowerCase());
                isCorrect = acceptable.includes(userAns.toLowerCase());
            }

            feedback.style.display = "block";
            feedback.style.background = isCorrect ? "rgba(52, 168, 83, 0.1)" : "rgba(234, 67, 53, 0.1)";
            feedback.style.color = isCorrect ? "#34A853" : "#EA4335";
            feedback.innerHTML = `<strong>${isCorrect ? "✅ Korrekt!" : "❌ Falsch!"}</strong><br>
                                  <small>Lösung: ${q.correct}</small><br>
                                  <p style="color:var(--text-color); font-size:0.9rem; margin-top:5px;">${q.desc || ""}</p>`;
            if(isCorrect) score++;
        });
        document.getElementById('eval-markdown').style.display = "block";
        document.getElementById('eval-markdown').innerHTML = ` 🎉 Ergebnis: ${score} von ${currentQuiz.length} richtig!`;
    }

    function saveQuiz() {
        let fileName = (document.getElementById('quiz-filename').value || "quiz") + ".json";
        const blob = new Blob([JSON.stringify(currentQuiz, null, 2)], {type : 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
    }

    function loadQuizFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            currentQuiz = JSON.parse(e.target.result);
            render();
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
