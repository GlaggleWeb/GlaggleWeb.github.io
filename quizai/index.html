<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Quiz Studio Pro</title>
    <meta property="og:title" content="Glaggle Quiz Studio Pro" />
    <meta property="og:description" content="Erstelle in Glaggle Quiz Studio Pro dein eigenes Quiz mit KI." />
    <meta property="og:image" content="https://glaggle.ch/glagglelogo.png" />
    <meta property="og:url" content="https://glaggle.ch/quizai" />
    <meta property="og:type" content="website" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff; --text-color: #333333;
            --card-bg: #fdfdfd; --card-border: #eeeeee;
            --accent: #70C4F7;
            --accent-gradient: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #202124; --text-color: #e8eaed; --card-bg: #303134; --card-border: #444444; }
        }

        body { background: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; text-align: center; }
        
        .glaggle-card {
            background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 20px;
            border: 1px solid var(--card-border); text-align: left; transition: 0.3s;
        }
        .special-card { border: 2px solid transparent; background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--accent-gradient) border-box; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); box-sizing: border-box; }
        
        .control-grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; /* Zwei Spalten nebeneinander */
    gap: 10px; 
    margin-bottom: 15px; 
}

/* Auf größeren Bildschirmen alle 4 nebeneinander */
@media (min-width: 600px) {
    .control-grid { 
        grid-template-columns: 2fr 2fr 1fr 1fr; 
    }
}
        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        .option-label { display: block; padding: 12px; margin: 8px 0; background: rgba(112, 196, 247, 0.1); border-radius: 12px; cursor: pointer; }
        .slider-box { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 15px; margin-top: 10px; }

        .loader { display: none; width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Glaggle Quiz Studio Pro</h1>

   <div class="glaggle-card special-card">
    <h3>Steuerung</h3>
    <div class="control-grid">
        <input type="text" id="quiz-topic" placeholder="Thema für neue Fragen...">
        
        <input type="text" id="quiz-filename" placeholder="Quiz-Name (z.B. Mein_Super_Quiz)">
        
        <select id="q-count">
            <option value="1">1 Frage</option>
            <option value="3" selected>3 Fragen</option>
            <option value="5">5 Fragen</option>
            <option value="10">10 Fragen</option>
        </select>

        <select id="difficulty">
            <option value="leicht">Leicht</option>
            <option value="mittel" selected>Mittel</option>
            <option value="extrem schwer">Extrem Schwer</option>
        </select>
    </div>
    
    <div class="btn-row">
        <button class="btn" onclick="generateQuestions(false)">Neues Quiz</button>
        <button class="btn" style="background:#FBBC05" onclick="generateQuestions(true)">Fragen hinzufügen (+)</button>
        <button class="btn" style="background:#6c757d" onclick="document.getElementById('file-input').click()">📂 Öffnen</button>
    </div>
    <input type="file" id="file-input" style="display:none" accept=".json" onchange="loadQuizFile(event)">
    <div id="loader" class="loader"></div>
</div>

    <div id="quiz-display"></div>

    <div id="action-area" style="display:none; margin-bottom: 50px;">
        <div class="btn-row">
            <button class="btn" style="background:#34A853" onclick="evaluateQuiz()">Auswerten ✨</button>
            <button class="btn" style="background:#EA4335" onclick="saveQuiz()">💾 Speichern</button>
        </div>
        <div id="eval-markdown" class="glaggle-card" style="display:none"></div>
    </div>
</div>

<script>
    // --- API KEY ZERSTÜCKELUNG ---
    const s1 = "gsk_"; 
    const s2 = "GpVmwabGZMyCM3QbwLbJWGdyb3FYG"; 
    const s3 = "uvDgzX0ufZbPwvnqxDZ9JNI";
    const getK = () => s1 + s2 + s3;

    let currentQuiz = [];
    let userAnswersCache = {};

    async function generateQuestions(append = false) {
        const topic = document.getElementById('quiz-topic').value || "Allgemeinwissen";
        const count = document.getElementById('q-count').value;
        const level = document.getElementById('difficulty').value;
        const loader = document.getElementById('loader');
        
        // Antworten sichern
        if (append) {
            currentQuiz.forEach((_, i) => {
                const radio = document.querySelector(`input[name="r${i}"]:checked`);
                const other = document.getElementById(`ans${i}`);
                if (radio) userAnswersCache[i] = radio.value;
                else if (other) userAnswersCache[i] = other.value;
            });
        } else {
            userAnswersCache = {};
            currentQuiz = [];
        }

        loader.style.display = "block";

        try {
            const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${getK()}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{
                        role: "system",
                        content: `Erstelle ${count} Fragen zum Thema "${topic}". Schwierigkeit: ${level}. 
                        Format: JSON. Typen: 'choice' (3 Optionen), 'text', 'slider'. 
                        WICHTIG für Slider: min/max sinnvoll anpassen.
                        Antworte NUR mit JSON: {"qs": [{"type": "choice", "q": "..", "opts": ["A","B","C"], "correct": "A"}, {"type": "slider", "q": "..", "min": 0, "max": 500, "correct": 250}, {"type": "text", "q": "..", "correct": "Antwort"}]}`
                    }]
                })
            });

            const data = await resp.json();
            const rawText = data.choices[0].message.content;
            const cleanJson = rawText.match(/\{[\s\S]*\}/)[0];
            const newQs = JSON.parse(cleanJson).qs;

            currentQuiz = append ? [...currentQuiz, ...newQs] : newQs;
            render();
            restoreAnswers();

        } catch (e) { 
            alert("Fehler: " + e.message); 
        } finally {
            loader.style.display = "none";
        }
    }

    function render() {
        const display = document.getElementById('quiz-display');
        display.innerHTML = currentQuiz.map((q, i) => `
            <div class="glaggle-card">
                <h4>${i + 1}. ${q.q}</h4>
                <div id="input-container-${i}">${renderInput(q, i)}</div>
                <div id="feedback-${i}" style="margin-top:10px; font-weight:bold; display:none; padding:10px; border-radius:10px;"></div>
            </div>
        `).join('');
        document.getElementById('action-area').style.display = "block";
    }

    function renderInput(q, i) {
        if (q.type === 'choice') return q.opts.map(o => `<label class="option-label"><input type="radio" name="r${i}" value="${o}"> ${o}</label>`).join('');
        if (q.type === 'slider') {
            const min = q.min ?? 0; const max = q.max ?? 100;
            return `<div class="slider-box">
                        <input type="range" id="ans${i}" min="${min}" max="${max}" value="${min}" oninput="this.nextElementSibling.innerText = this.value"> 
                        <b style="color:var(--accent)">${min}</b>
                        <div style="display:flex; justify-content:space-between; font-size:0.7rem; margin-top:5px;"><span>${min}</span><span>${max}</span></div>
                    </div>`;
        }
        return `<input type="text" id="ans${i}" placeholder="Antwort...">`;
    }

    function restoreAnswers() {
        Object.keys(userAnswersCache).forEach(i => {
            const val = userAnswersCache[i];
            const radio = document.querySelector(`input[name="r${i}"][value="${val}"]`);
            if (radio) radio.checked = true;
            const other = document.getElementById(`ans${i}`);
            if (other) {
                other.value = val;
                if (other.type === "range") {
                    const display = other.nextElementSibling;
                    if (display) display.innerText = val;
                }
            }
        });
    }

    function evaluateQuiz() {
        let score = 0;
        currentQuiz.forEach((q, i) => {
            const feedback = document.getElementById(`feedback-${i}`);
            let userAns = "";
            if (q.type === 'choice') {
                const checked = document.querySelector(`input[name="r${i}"]:checked`);
                userAns = checked ? checked.value : "";
            } else {
                userAns = document.getElementById(`ans${i}`).value;
            }

            const isCorrect = String(userAns).toLowerCase().trim() === String(q.correct).toLowerCase().trim();
            feedback.style.display = "block";
            feedback.style.background = isCorrect ? "rgba(52, 168, 83, 0.1)" : "rgba(234, 67, 53, 0.1)";
            feedback.innerHTML = isCorrect ? "✅ Korrekt!" : `❌ Falsch! Lösung: ${q.correct}`;
            feedback.style.color = isCorrect ? "#34A853" : "#EA4335";
            if(isCorrect) score++;
        });
        const evalBox = document.getElementById('eval-markdown');
        evalBox.style.display = "block";
        evalBox.innerHTML = marked.parse(`### 🎉 Dein Score: ${score} / ${currentQuiz.length}`);
    }

    function saveQuiz() {
        const blob = new Blob([JSON.stringify(currentQuiz, null, 2)], {type : 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "glaggle_quiz.json";
        a.click();
    }

    function loadQuizFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    // Setzt den Namen der geladenen Datei direkt ins Namens-Feld
    document.getElementById('quiz-filename').value = file.name;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            currentQuiz = JSON.parse(e.target.result);
            render();
        } catch(err) { alert("Fehler beim Laden!"); }
    };
    reader.readAsText(file);
}
</script>
</body>
</html>
