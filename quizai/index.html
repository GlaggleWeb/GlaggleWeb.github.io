<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle AI Quiz Maker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #fdfdfd;
            --card-border: #eeeeee;
            --link-color: #2E94D1;
            --input-bg: #ffffff;
            --accent-gradient: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --card-bg: #303134;
                --card-border: #444444;
                --link-color: #8cc9f5;
                --input-bg: #3c4043;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { margin-bottom: 40px; opacity: 0.8; }

        /* Generator Box */
        .quiz-config-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid transparent;
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, 
                        var(--accent-gradient) border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        input {
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #70C4F7; box-shadow: 0 0 10px rgba(112, 196, 247, 0.3); }

        .generate-btn {
            background: #70C4F7;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.4s;
        }

        .generate-btn:hover { background: #2E94D1; transform: scale(1.02); }

        /* Quiz Results */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            transition: 0.3s ease-in-out;
        }

        .quiz-card:hover { transform: translateY(-5px); border-color: #70C4F7; }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover { background: rgba(112, 196, 247, 0.1); }

        /* Loader */
        .loader {
            display: none;
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #70C4F7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .action-bar {
            display: none;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            padding-bottom: 50px;
        }

        .save-btn {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            background: #34A853;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Glaggle Quiz AI</h1>
    <p class="subtitle">Erstelle intelligente Quizze in Sekunden via Groq</p>

    <div class="quiz-config-card">
        <div class="input-group">
            <input type="password" id="groqKey" placeholder="Groq API Key hier einfügen...">
            <input type="text" id="quizTopic" placeholder="Worüber soll das Quiz sein? (z.B. Weltraum, Fußball...)">
            <button class="generate-btn" onclick="generateQuiz()">Quiz generieren</button>
        </div>
    </div>

    <div id="loader" class="loader"></div>
    <div id="quizContainer"></div>

    <div class="action-bar" id="actionBar">
        <button class="save-btn" onclick="saveQuizToFile()">💾 Quiz auf Computer speichern</button>
        <button class="save-btn" style="background:#4285F4" onclick="window.print()">🖨️ Als PDF drucken</button>
    </div>
</div>

<script>
    let currentQuizData = null;

    async function generateQuiz() {
        const key = document.getElementById('groqKey').value;
        const topic = document.getElementById('quizTopic').value;
        const loader = document.getElementById('loader');
        const container = document.getElementById('quizContainer');
        const actionBar = document.getElementById('actionBar');

        if(!key || !topic) {
            alert("Bitte Key und Thema ausfüllen!");
            return;
        }

        loader.style.display = "block";
        container.innerHTML = "";
        actionBar.style.display = "none";

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "Du bist ein Quiz-Master. Antworte NUR mit validem JSON. Struktur: { 'title': 'Thema', 'questions': [ { 'question': 'Text', 'options': ['A', 'B', 'C'], 'answerIndex': 0 } ] }" },
                        { role: "user", content: `Erstelle ein Quiz mit 5 Fragen zum Thema: ${topic}. Sprache: Deutsch.` }
                    ]
                })
            });

            const data = await response.json();
            const rawContent = data.choices[0].message.content;
            
            // JSON sauber extrahieren
            const jsonStr = rawContent.substring(rawContent.indexOf('{'), rawContent.lastIndexOf('}') + 1);
            currentQuizData = JSON.parse(jsonStr);

            displayQuiz(currentQuizData);
            actionBar.style.display = "flex";

        } catch (e) {
            alert("Fehler: " + e.message);
        } finally {
            loader.style.display = "none";
        }
    }

    function displayQuiz(data) {
        const container = document.getElementById('quizContainer');
        let html = `<h2 style="margin-bottom:30px;">${data.title}</h2>`;

        data.questions.forEach((q, i) => {
            html += `
                <div class="quiz-card">
                    <strong> Frage ${i+1}: ${q.question}</strong>
                    <div style="margin-top:10px;">
                        ${q.options.map(opt => `<button class="option-btn">${opt}</button>`).join('')}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function saveQuizToFile() {
        if(!currentQuizData) return;
        
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentQuizData, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "glaggle_quiz_" + currentQuizData.title.replace(/\s+/g, '_') + ".json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }
</script>

</body>
</html>
