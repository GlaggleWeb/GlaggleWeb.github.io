<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Fly Catch</title>
    <style>
        :root {
            --bg-color: #0b2e1a;
            --text-color: #ffffff;
            --nav-bg: #123a24;
            --card-bg: #123a24;
            --card-border: #4edd9d;
            --accent: #4edd9d;
            --danger: #FF6B6B;
            --coin-gold: #FFD700;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; height: 65px; background-color: var(--nav-bg);
            padding: 0 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; top: 0; z-index: 1000;
        }
        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; width: 100%; height: 500px;
            background: linear-gradient(to top, #123a24, #0b2e1a);
            border: 4px solid var(--card-border); border-radius: 20px;
            overflow: hidden; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }
        .fly {
            position: absolute; left: 0; top: 0;
            width: 40px; height: 40px; font-size: 30px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2; pointer-events: none;
            will-change: transform;
        }
        #tongue {
            position: absolute; left: 50%; bottom: 40px;
            width: 10px; height: 0;
            transform: translateX(-50%);
            background: #ff7aa8;
            border-radius: 5px 5px 0 0;
            z-index: 3; pointer-events: none;
        }
        #tongue::after {
            content: ''; position: absolute; top: -7px; left: 50%;
            width: 18px; height: 18px; margin-left: -9px;
            background: #ff7aa8; border-radius: 50%;
        }
        #frog {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            font-size: 50px; line-height: 1; z-index: 4;
            pointer-events: none;
        }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }
        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px); padding: 20px;
        }
        .btn {
            background: var(--accent); color: #0b2e1a; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #2a9c68; margin-bottom: 10px; width: 200px;
            text-decoration: none; display: inline-block; font-size: 16px;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #2a9c68; }
        .btn-secondary {
            background: transparent !important; border: 2px solid var(--accent) !important;
            box-shadow: none !important; margin-top: 5px; color: var(--accent) !important;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .btn-secondary:active { background: rgba(78, 221, 157, 0.1) !important; transform: scale(0.98); }

        #timer-bar-wrap {
            width: 100%; height: 10px; background: var(--nav-bg); border-radius: 10px;
            margin-bottom: 12px; overflow: hidden; border: 1px solid var(--card-border);
        }
        #timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width 0.2s linear; }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000;
        }
        .coin-img { width: 24px; height: 24px; object-fit: contain; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); border-color: #FFD700; }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="color: var(--accent); font-weight: bold;">Fly Catch</div>
        <div style="font-size: 24px;">🪰</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Fliegen <b id="score">0</b></div>
            <div class="score-val">Rekord <b id="highscore">0</b></div>
        </div>

        <div id="timer-bar-wrap"><div id="timer-bar"></div></div>

        <div id="game-container">
            <div id="tongue"></div>
            <div id="frog">🐸</div>

            <div id="menu-overlay" class="overlay">
                <h1 id="msg">🪰 Fly Catch</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.9; text-align: center;">
                    Tippe aufs Spielfeld, um die Zunge auszufahren!<br>
                    Fange die Fliegen, wenn sie durch die Mitte fliegen.<br>
                    60 Sekunden Zeit.<br><br>
                    <span style="color: var(--accent);">Alle 10 Fliegen = 1 Glaggle Coin!</span>
                </p>
                <button class="btn" onclick="startGame(event)">Starten</button>
                <a href="https://glaggle.ch/gamecenter" class="btn btn-secondary">Game Center 🏠</a>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="/gamecenter/coin.png" class="coin-img" alt="Coin" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <button id="music-toggle" onclick="toggleMusic(event)" style="position: fixed; bottom: 20px; left: 20px; background: var(--nav-bg); border: 2px solid var(--accent); color: white; padding: 10px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; font-size: 20px;">
    🔊
    </button>

    <script>
        const container = document.getElementById('game-container');
        const tongueEl = document.getElementById('tongue');
        const menu = document.getElementById('menu-overlay');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const timerBar = document.getElementById('timer-bar');

        let gameRunning = false;
        let score = 0;

        const HS_KEY = 'flycatch_highscore';
        let highscore = parseInt(localStorage.getItem(HS_KEY)) || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;
        highscoreEl.innerText = highscore;
        coinEl.innerText = coins;

        // Musik Setup
        const bgMusic = new Audio('https://res.cloudinary.com/pyxlc0q4/video/upload/tropical-summer-christmas-182482_w6t3c8.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        let musicActive = true;

        function toggleMusic(e) {
            if (e) e.stopPropagation();
            const btn = document.getElementById('music-toggle');
            if (!bgMusic.paused) {
                bgMusic.pause();
                btn.innerText = "🔈";
                musicActive = false;
            } else {
                bgMusic.play().catch(err => console.log("Audio blockiert"));
                btn.innerText = "🔊";
                musicActive = true;
            }
        }

        // Spiel-Konstanten
        const ROUND_TIME = 60;
        const TONGUE_BASE = 40;      // Abstand der Zunge vom unteren Rand (px)
        const TONGUE_MAX = 400;      // maximale Länge
        const TONGUE_OUT_SPEED = 1800;
        const TONGUE_BACK_SPEED = 1400;
        const CATCH_WIDTH = 30;      // Fangbereich links/rechts der Mitte
        const FLY_MIN_Y = 80, FLY_MAX_Y = 330;
        const MAX_FLIES = 5;
        const COIN_EVERY = 10;

        let timeLeft = ROUND_TIME;
        let timerInterval = null;
        let rafId = null;
        let lastTime = 0;
        let spawnTimer = 0;
        let lastCoinThreshold = 0;
        let flies = [];
        const tongue = { phase: 'idle', len: 0, caught: null };

        function spawnFly() {
            const w = container.clientWidth;
            const progress = 1 - timeLeft / ROUND_TIME;
            const dir = Math.random() < 0.5 ? 1 : -1;      // 1 = links→rechts
            const el = document.createElement('div');
            el.className = 'fly';
            el.innerText = '🪰';
            container.appendChild(el);
            flies.push({
                el,
                dir,
                x: dir === 1 ? -40 : w + 40,
                baseY: FLY_MIN_Y + Math.random() * (FLY_MAX_Y - FLY_MIN_Y),
                y: 0,
                speed: 110 + 150 * progress + Math.random() * 70,
                wobbleAmp: 8 + Math.random() * 18,
                wobbleFreq: 3 + Math.random() * 3,
                phase: Math.random() * 6.28,
                age: 0,
                caught: false
            });
        }

        function removeFly(f) {
            f.el.remove();
            flies = flies.filter(x => x !== f);
        }

        function shootTongue(e) {
            if (!gameRunning || tongue.phase !== 'idle') return;
            tongue.phase = 'out';
            tongue.len = 0;
            tongue.caught = null;
        }

        container.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            shootTongue();
        });

        function updateTongue(dt) {
            if (tongue.phase === 'idle') return;
            const cx = container.clientWidth / 2;
            const h = container.clientHeight;

            if (tongue.phase === 'out') {
                tongue.len = Math.min(TONGUE_MAX, tongue.len + TONGUE_OUT_SPEED * dt);
                const tipY = h - TONGUE_BASE - tongue.len;
                // Fliege in der Mitte getroffen?
                for (const f of flies) {
                    if (f.caught) continue;
                    if (Math.abs(f.x - cx) < CATCH_WIDTH && tipY <= f.y + 14) {
                        f.caught = true;
                        tongue.caught = f;
                        break;
                    }
                }
                if (tongue.caught || tongue.len >= TONGUE_MAX) tongue.phase = 'back';
            } else if (tongue.phase === 'back') {
                tongue.len = Math.max(0, tongue.len - TONGUE_BACK_SPEED * dt);
                if (tongue.caught) {
                    tongue.caught.x = cx;
                    tongue.caught.y = h - TONGUE_BASE - tongue.len;
                }
                if (tongue.len <= 0) {
                    if (tongue.caught) {
                        removeFly(tongue.caught);
                        eatFly();
                    }
                    tongue.caught = null;
                    tongue.phase = 'idle';
                }
            }
            tongueEl.style.height = tongue.len + 'px';
        }

        function eatFly() {
            score++;
            scoreEl.innerText = score;
            const threshold = Math.floor(score / COIN_EVERY);
            if (threshold > lastCoinThreshold) {
                lastCoinThreshold = threshold;
                addCoin();
            }
        }

        function loop(ts) {
            if (!gameRunning) return;
            const dt = Math.min(0.05, (ts - lastTime) / 1000);
            lastTime = ts;
            const w = container.clientWidth;

            // Spawnen (wird mit der Zeit schneller)
            const progress = 1 - timeLeft / ROUND_TIME;
            spawnTimer -= dt;
            if (spawnTimer <= 0 && flies.length < MAX_FLIES) {
                spawnFly();
                const gap = 1.1 - 0.5 * progress;
                spawnTimer = gap + Math.random() * 0.5;
            }

            // Fliegen bewegen
            for (const f of flies.slice()) {
                if (!f.caught) {
                    f.age += dt;
                    f.x += f.dir * f.speed * dt;
                    f.y = f.baseY + Math.sin(f.age * f.wobbleFreq + f.phase) * f.wobbleAmp;
                    if ((f.dir === 1 && f.x > w + 50) || (f.dir === -1 && f.x < -50)) {
                        removeFly(f);
                        continue;
                    }
                }
                const flip = f.dir === 1 ? -1 : 1;
                f.el.style.transform = `translate(${f.x - 20}px, ${f.y - 20}px) scaleX(${flip})`;
            }

            updateTongue(dt);
            rafId = requestAnimationFrame(loop);
        }

        function addCoin() {
            coins++;
            localStorage.setItem('glaggleCoins', coins);
            coinEl.innerText = coins;
            document.getElementById('coin-display').classList.add('pulse');
            setTimeout(() => document.getElementById('coin-display').classList.remove('pulse'), 500);
        }

        function startGame(e) {
            if (e) e.stopPropagation();

            if (musicActive) {
                bgMusic.currentTime = 0;
                bgMusic.play().catch(() => console.log("Audio braucht Nutzerinteraktion..."));
            }

            flies.forEach(f => f.el.remove());
            flies = [];
            score = 0;
            lastCoinThreshold = 0;
            scoreEl.innerText = score;
            timeLeft = ROUND_TIME;
            timerBar.style.width = '100%';
            tongue.phase = 'idle'; tongue.len = 0; tongue.caught = null;
            tongueEl.style.height = '0px';
            spawnTimer = 0.4;

            gameRunning = true;
            menu.style.display = "none";

            lastTime = performance.now();
            rafId = requestAnimationFrame(loop);

            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                timerBar.style.width = Math.max(0, (timeLeft / ROUND_TIME) * 100) + '%';
                if (timeLeft <= 0) endGame();
            }, 100);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            cancelAnimationFrame(rafId);
            flies.forEach(f => f.el.remove());
            flies = [];
            tongue.phase = 'idle'; tongue.len = 0; tongue.caught = null;
            tongueEl.style.height = '0px';

            if (score > highscore) {
                highscore = score;
                localStorage.setItem(HS_KEY, highscore);
                highscoreEl.innerText = highscore;
                document.getElementById('msg').innerHTML = "🏆 NEUER REKORD!<br><span style='color:var(--accent)'>" + score + " Fliegen</span>";
            } else {
                document.getElementById('msg').innerHTML = "⏱️ ZEIT UM!<br>Fliegen: " + score;
            }
            menu.style.display = "flex";
        }
    </script>
</body>
</html>
