<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Orbit</title>
    <style>
        :root {
            --bg-color: #1a0b2e;
            --text-color: #ffffff;
            --nav-bg: #2a1b41;
            --card-border: #9d4edd;
            --accent: #ff9e00;
            --danger: #FF6B6B;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 500px; 
            background: linear-gradient(to bottom, #1a0b2e, #2a1b41);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px);
            padding: 20px;
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #cc7a00; margin-bottom: 10px;
            width: 220px; font-size: 16px;
            text-align: center;
            text-decoration: none;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #cc7a00; }
        
        .btn-secondary {
            background: #5a189a;
            box-shadow: 0 4px 0px #3c096c;
        }
        .btn-secondary:active { box-shadow: 0 2px 0px #3c096c; }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .coin-img { width: 24px; height: 24px; object-fit: contain; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); border-color: #FFD700; }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>

    <div class="navbar">
        <div style="color: var(--accent); font-weight: bold;">Glaggle Orbit</div>
        <div style="font-size: 20px;">🌌</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Orbits <b id="score">0</b></div>
            <div class="score-val">Rekord <b id="highscore">0</b></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">✨ Glaggle Orbit</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.9; text-align: center;">
                    Klicke zum Springen!<br>
                    Lande auf dem nächsten Planeten.
                </p>
                <button class="btn" onclick="startGame(event)">Starten</button>
                <button class="btn btn-secondary" onclick="openGameCenter(event)">Gamecenter</button>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="coin.png" class="coin-img" alt="Coin" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <button id="music-toggle" onclick="toggleMusic(event)" style="position: fixed; bottom: 20px; left: 20px; background: var(--nav-bg); border: 2px solid var(--accent); color: white; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; font-size: 20px;">
    🔊
    </button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const menu = document.getElementById('menu-overlay');

        let gameRunning = false;
        let score = 0;
        const HS_KEY = 'glaggleorbit_highscore';
        let highscore = localStorage.getItem(HS_KEY) || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;

        highscoreEl.innerText = highscore;
        coinEl.innerText = coins;

        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        let musicActive = true;

        function toggleMusic(e) {
            if(e) e.stopPropagation();
            const btn = document.getElementById('music-toggle');
            if (!bgMusic.paused) {
                bgMusic.pause();
                btn.innerText = "🔈";
                musicActive = false;
            } else {
                bgMusic.play().catch(() => {});
                btn.innerText = "🔊";
                musicActive = true;
            }
        }

        function openGameCenter(e) {
            if(e) e.stopPropagation();
            try {
                // Direkte Weiterleitung zum Gamecenter
                window.top.location.href = "https://glaggle.ch/gamecenter";
            } catch(err) {
                // Fallback falls Top-Level Navigation blockiert wird
                window.location.href = "https://glaggle.ch/gamecenter";
            }
        }

        let planets = [];
        let player = {
            orbiting: null,
            angle: 0,
            distance: 60,
            x: 0, y: 0,
            isJumping: false,
            vx: 0, vy: 0,
            radius: 12
        };

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function createPlanet(x, y, radius, color) {
            return { 
                x, y, radius, color, 
                rotationSpeed: (Math.random() * 0.03 + 0.02) * (Math.random() > 0.5 ? 1 : -1) 
            };
        }

        function initGame() {
            planets = [];
            planets.push(createPlanet(canvas.width / 2, canvas.height / 2 + 100, 35, '#9d4edd'));
            planets.push(createPlanet(canvas.width / 2, canvas.height / 2 - 100, 30, '#ff9e00'));
            
            player.orbiting = planets[0];
            player.angle = 0;
            player.isJumping = false;
            player.distance = player.orbiting.radius + 25;
            score = 0;
            scoreEl.innerText = score;
            localStorage.setItem('last_orbit_coin_score', 0);
        }

        function jump() {
            if (!gameRunning || player.isJumping) return;
            player.isJumping = true;
            const speed = 7.5;
            player.vx = Math.cos(player.angle) * speed;
            player.vy = Math.sin(player.angle) * speed;
            player.orbiting = null;
        }

        container.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') jump();
        });
        container.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON') { e.preventDefault(); jump(); }
        }, {passive: false});

        function startGame(e) {
            if(e) e.stopPropagation();
            if (musicActive) bgMusic.play().catch(()=>{});
            initGame();
            gameRunning = true;
            menu.style.display = "none";
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (!player.isJumping) {
                player.angle += player.orbiting.rotationSpeed;
                player.x = player.orbiting.x + Math.cos(player.angle) * player.distance;
                player.y = player.orbiting.y + Math.sin(player.angle) * player.distance;
            } else {
                player.x += player.vx;
                player.y += player.vy;

                for (let i = 0; i < planets.length; i++) {
                    let p = planets[i];
                    if (p === player.orbiting) continue;
                    
                    let dx = player.x - p.x;
                    let dy = player.y - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < p.radius + 28) {
                        player.isJumping = false;
                        player.orbiting = p;
                        player.angle = Math.atan2(dy, dx);
                        player.distance = dist;
                        score++;
                        scoreEl.innerText = score;
                        
                        generateNextPlanet();
                        
                        let lastCoinScore = parseInt(localStorage.getItem('last_orbit_coin_score')) || 0;
                        if (score >= lastCoinScore + 10) {
                            coins++;
                            localStorage.setItem('glaggleCoins', coins);
                            localStorage.setItem('last_orbit_coin_score', score);
                            coinEl.innerText = coins;
                            document.getElementById('coin-display').classList.add('pulse');
                            setTimeout(() => document.getElementById('coin-display').classList.remove('pulse'), 500);
                        }
                        break;
                    }
                }
            }

            let targetY = canvas.height / 2 + 80;
            let moveY = (targetY - player.y) * 0.1;
            planets.forEach(p => p.y += moveY);
            if (player.isJumping) player.y += moveY;

            if (player.x < -100 || player.x > canvas.width + 100 || player.y < -100 || player.y > canvas.height + 100) {
                gameOver();
                return;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function generateNextPlanet() {
            if (planets.length > 6) planets.shift();
            let last = planets[planets.length - 1];
            
            let angle = (Math.random() * 0.8 - 0.4) - Math.PI/2;
            let dist = 180 + Math.random() * 60;
            
            planets.push(createPlanet(
                last.x + Math.cos(angle) * dist,
                last.y + Math.sin(angle) * dist,
                20 + Math.random() * 20,
                score % 2 === 0 ? '#ff9e00' : '#9d4edd'
            ));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255,255,255,0.2)";
            for(let i=0; i<15; i++) {
                ctx.beginPath();
                ctx.arc((i*160)%canvas.width, (i*240 + score*5)%canvas.height, 1, 0, Math.PI*2);
                ctx.fill();
            }

            planets.forEach(p => {
                ctx.fillStyle = p.color + "22";
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 15, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.fillStyle = "#FFD700";
            ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(-4, -3, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -3, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, 3, 5, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            localStorage.setItem('last_orbit_coin_score', 0);
            let currentHigh = parseInt(localStorage.getItem(HS_KEY)) || 0;
            if (score > currentHigh) {
                localStorage.setItem(HS_KEY, score);
                highscoreEl.innerText = score;
                document.getElementById('msg').innerHTML = "🏆 NEUER REKORD!<br>" + score;
            } else {
                document.getElementById('msg').innerHTML = "💀 ABGESTÜRZT!<br>Orbits: " + score;
            }
            menu.style.display = "flex";
        }
    </script>
</body>
</html>
