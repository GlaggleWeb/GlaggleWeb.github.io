<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage - Glaggle Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --nav-bg: #ffffff;
            --card-bg: #fdfdfd;
            --card-border: #eeeeee;
            --glaggle-blue: #4285F4;
            --glaggle-red: #EA4335;
            --glaggle-yellow: #FBBC05;
            --glaggle-green: #34A853;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --nav-bg: #303134;
                --card-bg: #303134;
                --card-border: #444444;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            transition: background-color 0.3s;
        }

        /* Glaggle Preloader */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader-ball {
            width: 80px; height: 80px; border-radius: 50%;
            background: conic-gradient(var(--glaggle-blue), var(--glaggle-red), var(--glaggle-yellow), var(--glaggle-green), var(--glaggle-blue));
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .preloader-hidden { opacity: 0; pointer-events: none; }

        .logo-text span:nth-child(1) { color: var(--glaggle-blue); }
        .logo-text span:nth-child(2) { color: var(--glaggle-red); }
        .logo-text span:nth-child(3) { color: var(--glaggle-yellow); }
        .logo-text span:nth-child(4) { color: var(--glaggle-blue); }
        .logo-text span:nth-child(5) { color: var(--glaggle-green); }
        .logo-text span:nth-child(6) { color: var(--glaggle-red); }

        .search-bar-wrapper {
            display: flex; align-items: center; background: var(--bg-color);
            border: 1px solid var(--card-border); border-radius: 40px; padding: 5px 10px 5px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); transition: 0.4s;
        }
        .search-bar-wrapper:focus-within { 
            border-color: var(--glaggle-blue); 
            box-shadow: 0 8px 25px rgba(66, 133, 244, 0.15); 
        }

        .glaggle-card {
            background: var(--card-bg); border-radius: 24px; overflow: hidden;
            border: 1px solid var(--card-border); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.04);
        }
        .glaggle-card:hover {
            transform: translateY(-5px);
            border-color: var(--glaggle-blue);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #f3f3f3;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--glaggle-blue), var(--glaggle-red), var(--glaggle-yellow), var(--glaggle-green));
            background-size: 300% 100%;
            animation: gradientMove 2s linear infinite;
            transition: width 0.3s ease;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Preloader -->
    <div id="preloader">
        <div class="flex flex-col items-center">
            <div class="loader-ball mb-6"></div>
            <h2 class="text-2xl font-bold text-slate-700">AImage lädt...</h2>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full h-20 bg-white dark:bg-zinc-900 shadow-md flex items-center justify-between px-8 z-50">
        <div class="logo-text text-2xl font-bold cursor-pointer" onclick="showView('search')">
            <span>A</span><span>I</span><span>m</span><span>a</span><span>g</span><span>e</span>
        </div>
        <div class="flex gap-3">
            <button onclick="showView('search')" class="px-6 py-2 rounded-full bg-blue-500 text-white font-bold hover:bg-blue-600 transition">Erstellen</button>
            <button onclick="showView('gallery')" class="px-6 py-2 rounded-full bg-green-500 text-white font-bold hover:bg-green-600 transition">Galerie</button>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-4 flex flex-col items-center">
        
        <!-- Generator View -->
        <section id="search-view" class="view-section active w-full max-w-2xl text-center">
            <h1 class="text-5xl font-extrabold mb-4">Glaggle-Magie</h1>
            <p class="text-slate-500 text-lg mb-10">Lass deine kühnsten Träume von der KI zeichnen.</p>

            <div class="search-bar-wrapper mb-8">
                <input type="text" id="imagePrompt" class="flex-1 bg-transparent border-none outline-none py-4 text-lg" placeholder="Ein bunter Glaggle-Vogel im Weltraum..." onkeypress="if(event.key==='Enter') generateImage()">
                <button id="genBtn" onclick="generateImage()" class="bg-blue-500 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-600 transition disabled:opacity-50">
                    Erstellen
                </button>
            </div>

            <div id="status-container" class="hidden">
                <p id="status-text" class="font-bold text-blue-500 mb-2 italic text-sm">Initialisiere...</p>
                <div class="progress-container" id="prog-cont" style="display: block;">
                    <div class="progress-bar" id="prog-bar"></div>
                </div>
            </div>

            <div id="preview-area" class="mt-10 flex justify-center w-full"></div>
        </section>

        <!-- Gallery View -->
        <section id="gallery-view" class="view-section w-full max-w-5xl">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-bold">Deine Sammlung</h2>
                <span id="gallery-count" class="bg-blue-500 text-white px-4 py-1 rounded-full text-sm">0 Bilder</span>
            </div>
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            <div id="empty-hint" class="py-20 text-center border-2 border-dashed border-slate-200 rounded-3xl text-slate-400">
                Du hast noch keine Bilder erstellt.
            </div>
        </section>

    </main>

    <script type="module">
        // WICHTIG: Die Variable apiKey muss genau so deklariert sein. 
        // Der Wert wird zur Laufzeit von der Umgebung injiziert.
        const apiKey = "AIzaSyBMZ2P32O2MYBdSSk-uqTRc2D_HO2mqHk4"; 

        let myGallery = [];

        // Preloader entfernen
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('preloader')?.classList.add('preloader-hidden');
            }, 1000);
            loadLocalGallery();
        };

        window.showView = (id) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id + '-view');
            if (target) target.classList.add('active');
            if(id === 'gallery') renderGallery();
        };

        // Hilfsfunktion für Exponential Backoff (Retry-Logik)
        async function fetchWithRetry(url, options, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    
                    // Bei Rate-Limit oder Server-Fehlern warten
                    if (response.status === 429 || (response.status >= 500 && response.status <= 599)) {
                        await new Promise(res => setTimeout(res, delays[i]));
                        continue;
                    }
                    return response;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function generateImage() {
            const prompt = document.getElementById('imagePrompt').value.trim();
            const btn = document.getElementById('genBtn');
            const statusCont = document.getElementById('status-container');
            const statusText = document.getElementById('status-text');
            const progressBar = document.getElementById('prog-bar');
            const preview = document.getElementById('preview-area');

            if (!prompt) return;

            // UI Sperren & Reset
            btn.disabled = true;
            statusCont.classList.remove('hidden');
            preview.innerHTML = '';
            progressBar.style.width = "0%";
            statusText.classList.remove('text-red-500');
            
            // Simulierter Ladebalken
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 8;
                    if (progress > 90) progress = 90;
                    progressBar.style.width = progress + "%";
                    
                    if (progress < 30) statusText.innerText = "Glaggle denkt nach...";
                    else if (progress < 60) statusText.innerText = "Farben werden gemischt...";
                    else statusText.innerText = "Fast fertig...";
                }
            }, 400);

            try {
                // Endpunkt für die Bildgenerierung
                const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-2.0-generate-001:predict?key=${apiKey}`;
                
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                if (!response.ok) {
                    const errorJson = await response.json().catch(() => ({}));
                    throw new Error(errorJson.error?.message || `Fehler ${response.status}`);
                }

                const result = await response.json();
                
                clearInterval(interval);
                progressBar.style.width = "100%";
                statusText.innerText = "Erfolg!";

                if (result.predictions && result.predictions[0]) {
                    const imgData = `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
                    const item = {
                        id: Date.now(),
                        url: imgData,
                        prompt: prompt
                    };

                    myGallery.unshift(item);
                    saveLocalGallery();
                    
                    setTimeout(() => {
                        showPreview(item);
                        statusCont.classList.add('hidden');
                    }, 500);
                } else {
                    throw new Error("Kein Bild generiert.");
                }
            } catch (err) {
                clearInterval(interval);
                statusText.innerText = "Fehler: " + err.message;
                statusText.classList.add('text-red-500');
                progressBar.style.width = "0%";
            } finally {
                btn.disabled = false;
            }
        }

        function showPreview(item) {
            const preview = document.getElementById('preview-area');
            preview.innerHTML = `
                <div class="glaggle-card max-w-sm w-full">
                    <img src="${item.url}" class="w-full aspect-square object-cover" alt="KI Ergebnis">
                    <div class="p-6 text-left">
                        <p class="font-bold text-slate-700 mb-4">${item.prompt}</p>
                        <button onclick="downloadImg('${item.url}')" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition shadow-lg">
                            Bild Speichern
                        </button>
                    </div>
                </div>
            `;
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const hint = document.getElementById('empty-hint');
            const count = document.getElementById('gallery-count');
            if(!grid) return;

            grid.innerHTML = '';
            count.innerText = `${myGallery.length} Bilder`;

            if (myGallery.length === 0) {
                hint?.classList.remove('hidden');
                return;
            }
            hint?.classList.add('hidden');

            myGallery.forEach(item => {
                const div = document.createElement('div');
                div.className = "glaggle-card";
                div.innerHTML = `
                    <img src="${item.url}" class="w-full aspect-square object-cover" loading="lazy">
                    <div class="p-5">
                        <p class="text-sm font-medium text-slate-600 line-clamp-2 mb-4">${item.prompt}</p>
                        <button onclick="downloadImg('${item.url}')" class="text-blue-500 font-bold hover:underline">Download</button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        window.downloadImg = (url) => {
            const a = document.createElement('a');
            a.href = url;
            a.download = `AImage-${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function saveLocalGallery() {
            try {
                sessionStorage.setItem('glaggle_gallery_v2', JSON.stringify(myGallery.slice(0, 30)));
            } catch(e) {}
        }

        function loadLocalGallery() {
            const data = sessionStorage.getItem('glaggle_gallery_v2');
            if (data) {
                try {
                    myGallery = JSON.parse(data);
                } catch(e) { myGallery = []; }
            }
        }

        // Export für den globalen Zugriff
        window.generateImage = generateImage;
        window.showView = showView;
    </script>
</body>
</html>
