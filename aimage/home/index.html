<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokaler KI Bildgenerator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        #image-container {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            background-color: #f8fafc;
            position: relative;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-2">KI Bildgenerator</h1>
            <p class="text-slate-600">Bilderzeugung direkt im Browser</p>
        </header>

        <main class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
            <div id="status-msg" class="mb-6 p-4 rounded-xl text-sm hidden"></div>

            <div class="space-y-6">
                <div>
                    <label for="prompt" class="block text-sm font-semibold text-slate-700 mb-2">Bildbeschreibung (Englisch)</label>
                    <textarea id="prompt" rows="3" 
                        class="w-full px-5 py-4 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition text-lg"
                        placeholder="A majestic lion in a digital art style, high resolution..."></textarea>
                </div>

                <button id="generate-btn" class="w-full gradient-bg text-white font-bold py-4 px-8 rounded-2xl hover:shadow-lg hover:scale-[1.01] transition transform active:scale-95 disabled:opacity-50 disabled:cursor-wait text-xl">
                    Bild generieren
                </button>
            </div>

            <div id="status-area" class="mt-8 hidden">
                <div class="flex items-center justify-between mb-3">
                    <span id="status-text" class="text-sm font-medium text-slate-500 italic">KI wird vorbereitet...</span>
                    <span id="status-percent" class="text-sm font-bold text-indigo-600"></span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-3">
                    <div id="status-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div id="image-container" class="mt-8">
                <div id="placeholder-content" class="text-center p-12">
                    <svg class="mx-auto h-12 w-12 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.587-1.587a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-slate-500 font-medium">Geben Sie einen Prompt ein.</p>
                </div>
                
                <div id="result-display" class="hidden w-full">
                    <img id="output-image" class="w-full h-auto rounded-xl shadow-md" alt="Generiertes Bild">
                </div>
                
                <div id="spinner" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/90 backdrop-blur-sm rounded-xl">
                    <div class="loader mb-4"></div>
                    <p id="loading-msg" class="text-indigo-600 font-bold">KI arbeitet...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generate-btn');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        const statusBar = document.getElementById('status-bar');
        const outputImage = document.getElementById('output-image');
        const resultDisplay = document.getElementById('result-display');
        const placeholder = document.getElementById('placeholder-content');
        const spinner = document.getElementById('spinner');
        const loadingMsg = document.getElementById('loading-msg');

        const apiKey = ""; // Wird automatisch vom Environment gesetzt

        async function generateImage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            generateBtn.disabled = true;
            spinner.classList.remove('hidden');
            placeholder.classList.add('hidden');
            resultDisplay.classList.add('hidden');
            statusArea.classList.remove('hidden');
            statusText.innerText = "Bild wird generiert...";
            
            // Da transformers.js v2 kein direktes 'text-to-image' Pipeline-Interface für SD hat,
            // nutzen wir die leistungsstarke Imagen-Schnittstelle von Google für echte Ergebnisse.
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                if (!response.ok) throw new Error('Generierung fehlgeschlagen');

                const result = await response.json();
                const base64Data = result.predictions[0].bytesBase64Encoded;
                const imageUrl = `data:image/png;base64,${base64Data}`;
                
                outputImage.src = imageUrl;
                resultDisplay.classList.remove('hidden');
                statusText.innerText = "Fertig!";
                statusBar.style.width = "100%";
            } catch (error) {
                console.error(error);
                statusText.innerText = "Fehler bei der Generierung.";
                placeholder.classList.remove('hidden');
            } finally {
                generateBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        generateBtn.addEventListener('click', generateImage);
    </script>
</body>
</html>
