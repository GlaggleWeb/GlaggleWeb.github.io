<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage</title>
    <style>
        :root {
            --primary: #6200ea;
            --bg: #f8f9fa;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #image-container {
            margin-top: 20px;
            background: #f0f0f0;
            border-radius: 12px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        img {
            max-width: 100%;
            border-radius: 12px;
            display: none;
        }
        /* Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>AImage</h2>
    <input type="text" id="promptInput" placeholder="Was soll ich generieren?">
    <button onclick="generate()">Bild erstellen</button>

    <div id="image-container">
        <div class="loader" id="loader"></div>
        <img id="resultImg" crossorigin="anonymous">
    </div>

    <button id="saveBtn" class="hidden" style="background: #27ae60; margin-top: 10px;">Bild speichern</button>
</div>

<div id="saveModal" class="modal-overlay hidden">
    <div class="modal">
        <h3>Speichern unter...</h3>
        <input type="text" id="fileName" placeholder="Dateiname">
        <button onclick="confirmDownload()">Download</button>
        <button onclick="toggleModal()" style="background:none; color: #666;">Abbrechen</button>
    </div>
</div>

<script>
    const img = document.getElementById('resultImg');
    const loader = document.getElementById('loader');
    const saveBtn = document.getElementById('saveBtn');
    const modal = document.getElementById('saveModal');
    const fileNameInput = document.getElementById('fileName');

    function generate() {
        const prompt = document.getElementById('promptInput').value;
        if(!prompt) return alert("Prompt fehlt!");

        img.style.display = 'none';
        saveBtn.classList.add('hidden');
        loader.style.display = 'block';

        const seed = Math.floor(Math.random() * 999999);
        img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;
    }

    img.onload = () => {
        loader.style.display = 'none';
        img.style.display = 'block';
        saveBtn.classList.remove('hidden');
    };

    img.onerror = () => {
        loader.style.display = 'none';
        alert("Fehler beim Laden.");
    };

    // Öffnet das Fenster und erstellt NUR DANN einen neuen Namen
    saveBtn.onclick = () => {
        fileNameInput.value = "KI-Bild-" + Math.floor(Date.now() / 1000);
        modal.classList.remove('hidden');
    };

    // Schließt das Fenster einfach nur
    function closeSaveModal() {
        modal.classList.add('hidden');
    }

    async function confirmDownload() {
        const name = fileNameInput.value || 'bild';
        try {
            const response = await fetch(img.src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        } catch (e) {
            window.open(img.src, '_blank');
        }
        closeSaveModal();
    }
</script>
</body>
</html>
