<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - NextGen Generation</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #0a0a0c;
            --card: #16161a;
            --text: #e2e8f0;
            --accent-glow: rgba(0, 242, 255, 0.3);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00f2ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 2rem;
            border: 1px solid rgba(0, 242, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .canvas-area {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--card);
            border-radius: 28px;
            margin: 20px auto;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #result-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder {
            color: #4b5563;
            font-style: italic;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .controls {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: #1f1f23;
            border: 1px solid #3f3f46;
            color: white;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 16px 32px;
            border-radius: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        button:disabled {
            background: #3f3f46;
            color: #71717a;
            cursor: not-allowed;
            transform: none;
        }

        .progress-box {
            font-size: 0.85rem;
            color: #94a3b8;
            min-height: 20px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(0, 242, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Animation für das Erscheinen des Bildes */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Studio</h1>
        <div class="status-badge" id="engine-tag">Engine: Imagen 4 Pro</div>

        <div class="canvas-area">
            <img id="result-image" class="fade-in">
            <div class="loader" id="spinner"></div>
            <div class="placeholder" id="placeholder-box">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.2">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                <span>Bereit für dein Prompt</span>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="prompt-input" placeholder="Beschreibe deine Vision..." value="A majestic cinematic landscape of a floating neon city in the clouds, cyberpunk style, high detail, 8k">
                <button id="gen-btn">Generieren</button>
            </div>
            <div class="progress-box" id="status-msg">
                Cloud-beschleunigte KI Inferenz
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // Wird automatisch von der Umgebung gesetzt
        const btn = document.getElementById('gen-btn');
        const statusMsg = document.getElementById('status-msg');
        const spinner = document.getElementById('spinner');
        const placeholder = document.getElementById('placeholder-box');
        const resultImage = document.getElementById('result-image');
        const promptInput = document.getElementById('prompt-input');

        async function generateImage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // UI Zustand setzen
            btn.disabled = true;
            spinner.style.display = 'block';
            placeholder.style.display = 'none';
            resultImage.style.display = 'none';
            statusMsg.innerText = "Verbindung zum KI-Kern wird aufgebaut...";

            let retries = 0;
            const maxRetries = 5;

            async function attemptRequest() {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: [{ prompt: prompt }],
                            parameters: { sampleCount: 1 }
                        })
                    });

                    if (!response.ok) throw new Error(`Server-Fehler: ${response.status}`);

                    const data = await response.json();
                    if (data.predictions && data.predictions[0]) {
                        const base64 = data.predictions[0].bytesBase64Encoded;
                        resultImage.src = `data:image/png;base64,${base64}`;
                        
                        resultImage.onload = () => {
                            spinner.style.display = 'none';
                            resultImage.style.display = 'block';
                            statusMsg.innerText = "Bild erfolgreich generiert.";
                            btn.disabled = false;
                        };
                    } else {
                        throw new Error("Ungültige Antwort von der KI-Engine.");
                    }
                } catch (err) {
                    if (retries < maxRetries) {
                        retries++;
                        const delay = Math.pow(2, retries) * 1000;
                        statusMsg.innerText = `Verbindungsfehler. Erneuter Versuch (${retries}/${maxRetries})...`;
                        setTimeout(attemptRequest, delay);
                    } else {
                        console.error(err);
                        statusMsg.innerHTML = `<span style="color: #ff4b4b">Fehler: ${err.message}</span>`;
                        spinner.style.display = 'none';
                        placeholder.style.display = 'flex';
                        btn.disabled = false;
                    }
                }
            }

            attemptRequest();
        }

        btn.onclick = generateImage;
        promptInput.onkeypress = (e) => { if(e.key === 'Enter') generateImage(); };
    </script>
</body>
</html>
