<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 20px; width: 350px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { background: #310085; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #box { margin: 20px 0; background: #2a2a2a; height: 300px; border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #333; }
        img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .loader { border: 3px solid #444; border-top: 3px solid #310085; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>AImage Generator</h2>
    <input type="text" id="p" placeholder="Was soll ich zeichnen?">
    <button onclick="gen()">Bild generieren</button>
    <div id="box">
        <div class="loader" id="l"></div>
        <img id="i">
    </div>
    <p id="error" style="color: #ff4444; font-size: 12px; display: none;">Verbindung blockiert. Teste mobile Daten.</p>
</div>

<script>
    function gen() {
        const p = document.getElementById('p').value;
        const i = document.getElementById('i');
        const l = document.getElementById('l');
        const err = document.getElementById('error');

        if(!p) return;

        i.style.display = "none";
        err.style.display = "none";
        l.style.display = "block";

        const s = Math.floor(Math.random() * 9999);
        
        // ALTERNATIVER ANBIETER (VIA DUCKDUCKGO/PIXSY PROXY)
        // Wir nutzen hier eine URL, die oft durch Filter schlüpft
        const url = `https://external-content.duckduckgo.com/iu/?u=https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?seed=${s}`;

        i.src = url;

        i.onload = () => {
            l.style.display = "none";
            i.style.display = "block";
        };

        i.onerror = () => {
            l.style.display = "none";
            err.style.display = "block";
        };
    }
</script>
</body>
</html>
