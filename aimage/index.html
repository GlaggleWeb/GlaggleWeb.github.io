<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Bildgenerator | Cloudflare AI</title>
    <style>
        :root { --primary: #f6821f; --bg: #1a1a1a; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; text-align: center; background: #2a2a2a; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--primary); margin-bottom: 20px; }
        input { width: 80%; padding: 12px; border: none; border-radius: 5px; margin-bottom: 10px; font-size: 16px; }
        button { padding: 12px 25px; background: var(--primary); border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
        button:disabled { background: #555; cursor: not-allowed; }
        #resultContainer { margin-top: 30px; min-height: 300px; display: flex; align-items: center; justify-content: center; border: 2px dashed #444; border-radius: 10px; overflow: hidden; }
        img { max-width: 100%; height: auto; display: block; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Image Generator</h1>
    <p>Powered by Cloudflare Workers AI</p>
    
    <input type="text" id="promptInput" placeholder="Ein Astronaut auf einem Pferd im Weltraum...">
    <br>
    <button id="genBtn" onclick="generateImage()">Bild generieren</button>

    <div id="resultContainer">
        <div id="statusText">Dein Bild erscheint hier</div>
    </div>
</div>

<script>
    // --- KONFIGURATION ---
    const accountId = "DEINE_ACCOUNT_ID"; // <--- Hier deine Account ID einsetzen
    
    // Dein API Key in zwei Teile zerlegt
    const keyPart1 = "-5ztOKXXjLgXt_"; // <--- Erste Hälfte hier rein
    const keyPart2 = "hx8sUXxNk-wEbUiC-UnhjKrunO";   // <--- Zweite Hälfte hier rein
    // ---------------------

    async function generateImage() {
        const prompt = document.getElementById('promptInput').value;
        const btn = document.getElementById('genBtn');
        const container = document.getElementById('resultContainer');

        if (!prompt) {
            alert("Bitte gib einen Prompt ein!");
            return;
        }

        // UI vorbereiten
        btn.disabled = true;
        container.innerHTML = '<div class="loader"></div>';

        // Key wieder zusammensetzen
        const fullToken = keyPart1 + keyPart2;

        try {
            const response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${accountId}/ai/run/@cf/bytedance/stable-diffusion-xl-lightning`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${fullToken}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ prompt: prompt }),
                }
            );

            if (!response.ok) {
                throw new Error('Fehler bei der Generierung. Code: ' + response.status);
            }

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            
            container.innerHTML = `<img src="${imageUrl}" alt="${prompt}">`;

        } catch (error) {
            console.error(error);
            container.innerHTML = `<p style="color: #ff4d4d;">Fehler: ${error.message}</p>`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
