<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage - Official API</title>
    <style>
        :root { --primary: #310085; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px; box-sizing: border-box; }
        .btn-gen { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #output-container { margin: 20px 0; background: #2a2a2a; min-height: 300px; border-radius: 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #333; }
        img { width: 100%; height: auto; display: none; }
        .loader { border: 4px solid #333; border-top: 4px solid #6200ea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: white; padding: 25px; border-radius: 20px; width: 280px; color: black; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0">AImage AI</h2>
    <input type="text" id="promptInput" placeholder="Was soll ich erstellen?">
    <button class="btn-gen" onclick="generateImage()">Bild generieren</button>
    
    <div id="output-container">
        <div class="loader" id="loader"></div>
        <img id="resultImg" alt="KI Bild">
    </div>
    
    <button id="saveBtn" style="display:none; background:#27ae60; margin-top:10px;" class="btn-gen" onclick="showModal()">Speichern</button>
</div>

<div id="modal" class="modal-overlay">
    <div class="modal">
        <h3 style="margin-top:0">Speichern</h3>
        <input type="text" id="fileName" style="background:white; color:black; border:1px solid #ccc;">
        <button class="btn-gen" style="background:#6200ea" onclick="startDownload()">Download</button>
        <p onclick="closeModal()" style="color:gray; margin-top:15px; cursor:pointer; font-size: 14px;">Abbrechen</p>
    </div>
</div>

<script>
    async function generateImage() {
        const prompt = document.getElementById('promptInput').value;
        const img = document.getElementById('resultImg');
        const loader = document.getElementById('loader');
        const saveBtn = document.getElementById('saveBtn');

        if(!prompt) return alert("Bitte gib einen Text ein!");

        // Reset
        img.style.display = "none";
        saveBtn.style.display = "none";
        loader.style.display = "block";

        const seed = Math.floor(Math.random() * 1000000);
        // Wir nutzen die strukturierte URL, die auch die Pollinations-Apps nutzen
        const url = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;

        // Wir erzwingen das Laden über einen Cache-Buster
        const timestamp = new Date().getTime();
        img.src = `${url}&t=${timestamp}`;

        img.onload = () => {
            loader.style.display = "none";
            img.style.display = "block";
            saveBtn.style.display = "block";
        };

        img.onerror = () => {
            loader.style.display = "none";
            alert("Verbindung fehlgeschlagen. Tipp: Versuche es mal ohne WLAN (mobile Daten).");
        };
    }

    function showModal() {
        document.getElementById('fileName').value = "AImage-" + Date.now();
        document.getElementById('modal').style.display = "flex";
    }

    function closeModal() { document.getElementById('modal').style.display = "none"; }

    function startDownload() {
        const img = document.getElementById('resultImg');
        // In Safari funktioniert das Öffnen im neuen Tab am besten zum Speichern
        window.open(img.src, '_blank');
        closeModal();
    }
</script>

</body>
</html>
