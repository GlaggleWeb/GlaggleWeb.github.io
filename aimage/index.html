<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AImage App</title>
    <style>
        :root { --primary: #310085; --accent: #6200ea; --bg: #0f0f0f; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            background: #1a1a1a;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #fff; }
        
        .input-group { margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.98); }

        #display-area {
            flex-grow: 1;
            margin: 20px 0;
            background: #252525;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid #333;
            overflow: hidden;
        }

        img { width: 100%; height: 100%; object-fit: contain; display: none; }

        /* Modern Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .save-bar { display: none; margin-top: auto; padding-bottom: 10px; }
        .btn-save { background: #28a745; }

        /* Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 300px; color: black; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>AImage App</h1>
    
    <div class="input-group">
        <input type="text" id="prompt" placeholder="Beschreibe dein Bild...">
    </div>

    <button class="btn-main" onclick="runAppGen()">Bild erstellen</button>

    <div id="display-area">
        <div class="spinner" id="loader"></div>
        <p id="msg" style="color: #666;">Warte auf Eingabe...</p>
        <img id="mainImg">
    </div>

    <div class="save-bar" id="saveBar">
        <button class="btn-main btn-save" onclick="openSaveModal()">Bild speichern</button>
    </div>
</div>

<div class="modal" id="saveModal">
    <div class="modal-content">
        <h3 style="margin-top:0">Speichern unter</h3>
        <input type="text" id="fname" style="background:#f0f0f0; color:black; border:1px solid #ccc; margin-bottom:10px;">
        <button class="btn-main" onclick="doDownload()">Download</button>
        <button onclick="closeModal()" style="background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Abbrechen</button>
    </div>
</div>

<script>
    const img = document.getElementById('mainImg');
    const loader = document.getElementById('loader');
    const msg = document.getElementById('msg');
    const saveBar = document.getElementById('saveBar');

    function runAppGen() {
        const p = document.getElementById('prompt').value;
        if(!p) return alert("Bitte gib etwas ein!");

        // App-State: Loading
        msg.style.display = "none";
        img.style.display = "none";
        saveBar.style.display = "none";
        loader.style.display = "block";

        const seed = Math.floor(Math.random() * 999999);
        // Wir nutzen die offizielle Pollinations-Struktur für Apps
        const url = `https://pollinations.ai/p/${encodeURIComponent(p)}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true`;

        // Safari-Safe Loading
        const requestImg = new Image();
        requestImg.src = url;

        requestImg.onload = function() {
            img.src = url;
            img.style.display = "block";
            loader.style.display = "none";
            saveBar.style.display = "block";
        };

        requestImg.onerror = function() {
            loader.style.display = "none";
            msg.style.display = "block";
            msg.innerText = "Verbindung zu glaggle.ch gestört. Bitte prüfe dein Internet.";
            msg.style.color = "red";
        };
    }

    function openSaveModal() {
        document.getElementById('fname').value = "AImage-" + Date.now();
        document.getElementById('saveModal').style.display = "flex";
    }

    function closeModal() { document.getElementById('saveModal').style.display = "none"; }

    function doDownload() {
        // Da glaggle.ch eine eigene Domain ist, ist window.open der sicherste Weg für Safari
        window.open(img.src, '_blank');
        closeModal();
    }
</script>

</body>
</html>
