<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage</title>
    <style>
        :root {
            --primary: #6200ea;
            --bg: #1a1a1a; /* Dunklerer Hintergrund für modernen Look */
            --card: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.98); }

        #image-container {
            margin: 20px 0;
            background: #f0f0f0;
            border-radius: 15px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        img { width: 100%; display: none; }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* WICHTIG: Das Modal ist standardmäßig versteckt */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none; /* Versteckt das Modal beim Start */
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        /* Wenn diese Klasse aktiv ist, wird das Modal gezeigt */
        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 300px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .secondary-btn {
            background: none;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0">AImage</h2>
    <input type="text" id="promptInput" placeholder="Was soll ich zeichnen?">
    <button onclick="generate()">Bild erstellen</button>

    <div id="image-container">
        <div class="loader" id="loader"></div>
        <img id="resultImg" crossorigin="anonymous">
    </div>

    <button id="saveBtn" style="background: #27ae60; display: none;">Bild speichern</button>
</div>

<div id="saveModal" class="modal-overlay">
    <div class="modal">
        <h3>Speichern unter...</h3>
        <input type="text" id="fileName" placeholder="Dateiname">
        <button onclick="confirmDownload()">Download starten</button>
        <button class="secondary-btn" onclick="closeModal()">Abbrechen</button>
    </div>
</div>

<script>
    const img = document.getElementById('resultImg');
    const loader = document.getElementById('loader');
    const saveBtn = document.getElementById('saveBtn');
    const modal = document.getElementById('saveModal');
    const fileNameInput = document.getElementById('fileName');

    function generate() {
        const prompt = document.getElementById('promptInput').value;
        if(!prompt) return alert("Bitte Text eingeben!");

        // Reset UI
        img.style.display = 'none';
        saveBtn.style.display = 'none';
        loader.style.display = 'block';

        const seed = Math.floor(Math.random() * 999999);
        img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;
    }

    img.onload = () => {
        loader.style.display = 'none';
        img.style.display = 'block';
        saveBtn.style.display = 'block'; // Zeige Save-Button erst wenn Bild da ist
    };

    img.onerror = () => {
        loader.style.display = 'none';
        alert("Fehler beim Laden.");
    };

    // Modal öffnen
    saveBtn.onclick = () => {
        fileNameInput.value = "AImage-" + Math.floor(Date.now() / 1000);
        modal.classList.add('active'); // Zeigt das Modal
    };

    // Modal schließen
    function closeModal() {
        modal.classList.remove('active'); // Versteckt das Modal
    }

    async function confirmDownload() {
        const name = fileNameInput.value || 'bild';
        try {
            const response = await fetch(img.src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        } catch (e) {
            // Safari Fallback
            window.open(img.src, '_blank');
        }
        closeModal();
    }
</script>
</body>
</html>
