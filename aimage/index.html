<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Safari Safe KI Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 40px;
}

input {
    width: 60%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #00c3ff;
    font-weight: bold;
}

iframe {
    margin-top: 30px;
    width: 1024px;
    height: 1024px;
    border: none;
    border-radius: 15px;
    background: black;
}
</style>
</head>

<body>

<h1>🎨 KI Bildgenerator (Safari Safe)</h1>

<input type="text" id="prompt" placeholder="Beschreibe dein Bild...">
<button onclick="generate()">Generieren</button>

<br><br>

<iframe id="frame" style="display:none;"></iframe>

<script>
function generate() {
    const prompt = document.getElementById("prompt").value;
    const frame = document.getElementById("frame");

    if (!prompt) {
        alert("Bitte Prompt eingeben!");
        return;
    }

    const encoded = encodeURIComponent(prompt);

    frame.src = "https://image.pollinations.ai/prompt/" 
                + encoded 
                + "?width=1024&height=1024&nocache=" 
                + Date.now();

    frame.style.display = "block";
}
</script>

</body>
</html>
