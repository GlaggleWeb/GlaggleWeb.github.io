<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Safari Final KI Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 40px;
}

input {
    width: 60%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #00c3ff;
    font-weight: bold;
}

#imageContainer {
    margin-top: 30px;
}

img {
    max-width: 80%;
    border-radius: 15px;
}
</style>
</head>

<body>

<h1>🎨 KI Bildgenerator</h1>

<input type="text" id="prompt" placeholder="Beschreibe dein Bild...">
<button onclick="generate()">Generieren</button>

<div id="imageContainer"></div>

<script>
function generate() {
    const prompt = document.getElementById("prompt").value;
    const container = document.getElementById("imageContainer");

    if (!prompt) {
        alert("Bitte Prompt eingeben!");
        return;
    }

    const encoded = encodeURIComponent(prompt);
    const seed = Math.floor(Math.random() * 1000000);

    const url = "https://image.pollinations.ai/prompt/" 
                + encoded 
                + "?width=1024&height=1024&seed=" 
                + seed;

    container.innerHTML = "";

    const img = document.createElement("img");
    img.src = url;

    img.onerror = function() {
        container.innerHTML = "❌ Bild konnte nicht geladen werden.";
    };

    container.appendChild(img);
}
</script>

</body>
</html>
