<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage - Generator</title>
    <style>
        :root {
            --primary: #6200ea;
            --success: #2ecc71;
            --bg: #f4f4f9;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        #image-container {
            margin: 20px 0;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
        }

        img { max-width: 100%; display: none; border-radius: 8px; }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            width: 85%;
            max-width: 320px;
        }

        .save-btn-active { background-color: var(--success); margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>AImage</h1>
    <input type="text" id="promptInput" placeholder="Was soll ich zeichnen?">
    <button id="genBtn">Bild generieren</button>

    <div id="image-container">
        <div class="loader" id="loader"></div>
        <img id="resultImage" crossorigin="anonymous">
    </div>

    <button id="saveBtn" class="hidden save-btn-active">Bild speichern</button>
</div>

<div id="saveModal" class="modal-overlay hidden">
    <div class="modal">
        <h3>Speichern</h3>
        <p>Dateiname wählen:</p>
        <input type="text" id="filenameInput">
        <button id="confirmDownload">Download starten</button>
        <button id="closeModal" style="background:none; color:#999; margin-top:10px;">Abbrechen</button>
    </div>
</div>

<script>
    const genBtn = document.getElementById('genBtn');
    const promptInput = document.getElementById('promptInput');
    const resultImage = document.getElementById('resultImage');
    const loader = document.getElementById('loader');
    const saveBtn = document.getElementById('saveBtn');
    const saveModal = document.getElementById('saveModal');
    const filenameInput = document.getElementById('filenameInput');
    const confirmDownload = document.getElementById('confirmDownload');
    const closeModal = document.getElementById('closeModal');

    // 1. GENERIEREN
    genBtn.onclick = function() {
        const text = promptInput.value;
        if (!text) return alert("Bitte beschreibe ein Bild!");

        saveBtn.classList.add('hidden');
        resultImage.style.display = 'none';
        loader.style.display = 'block';

        const seed = Math.floor(Math.random() * 999999);
        // Wir setzen CrossOrigin VOR dem Laden der Source
        resultImage.crossOrigin = "anonymous";
        resultImage.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?seed=${seed}&width=1024&height=1024&nologo=true`;
    };

    resultImage.onload = function() {
        loader.style.display = 'none';
        resultImage.style.display = 'block';
        saveBtn.classList.remove('hidden');
    };

    resultImage.onerror = function() {
        loader.style.display = 'none';
        alert("Fehler beim Laden. Versuche es bitte nochmal.");
    };

    // 2. MODAL ÖFFNEN
    saveBtn.onclick = function() {
        filenameInput.value = "KI-Bild-" + Math.floor(Date.now() / 1000);
        saveModal.classList.remove('hidden');
    };

    closeModal.onclick = function() {
        saveModal.classList.add('hidden');
    };

    // 3. ECHTER DOWNLOAD (Canvas Methode für Safari)
    confirmDownload.onclick = function() {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = resultImage.naturalWidth;
            canvas.height = resultImage.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(resultImage, 0, 0);

            let name = filenameInput.value || "image";
            if(!name.endsWith(".jpg")) name += ".jpg";

            const dataUrl = canvas.toDataURL("image/jpeg");
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            saveModal.classList.add('hidden');
        } catch (e) {
            console.error(e);
            alert("Safari blockiert den direkten Download. Halte das Bild gedrückt zum Speichern.");
        }
    };
</script>

</body>
</html>
