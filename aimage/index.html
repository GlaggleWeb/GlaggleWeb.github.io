<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Aimage</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 40px;
}

input {
    width: 60%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #00c3ff;
    font-weight: bold;
}

img {
    margin-top: 30px;
    max-width: 80%;
    border-radius: 15px;
}
</style>
</head>

<body>

<h1>🎨 KI Bildgenerator</h1>

<input type="text" id="prompt" placeholder="Beschreibe dein Bild...">
<button onclick="generate()">Generieren</button>

<br><br>

<img id="result" style="display:none;">

<script>
function generate() {
    const prompt = document.getElementById("prompt").value;
    const img = document.getElementById("result");

    if (!prompt) {
        alert("Bitte Prompt eingeben!");
        return;
    }

    const encoded = encodeURIComponent(prompt);
    
    // Safari mag kein fetch bei file://
    // Direktes Setzen der Bildquelle funktioniert aber
    img.src = "https://image.pollinations.ai/prompt/" 
              + encoded 
              + "?width=1024&height=1024&nocache=" 
              + Date.now();

    img.style.display = "block";
}
</script>

</body>
</html>
