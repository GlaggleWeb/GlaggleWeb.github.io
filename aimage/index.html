<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        h2 { color: white; margin-bottom: 20px; font-weight: 600; }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-gen {
            background: #310085; /* Das dunkle Lila aus deinem Screenshot */
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn-gen:hover { background: #4b00c7; }

        #result-box {
            margin-top: 20px;
            background: #2a2a2a;
            height: 300px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        img { width: 100%; height: 100%; object-fit: cover; display: none; }

        /* Spinner Animation */
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #6200ea;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 24px;
            width: 300px;
            text-align: center;
        }
        .btn-download {
            background: #6200ea;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AImage Generator</h2>
    <input type="text" id="promptInput" placeholder="Was soll ich generieren?">
    <button class="btn-gen" id="genBtn" onclick="generate()">Bild generieren</button>
    
    <div id="result-box">
        <div id="loader-container" style="display: none; color: #888;">
            <div class="loader" style="margin: 0 auto 10px;"></div>
            <p id="timerText">Starte...</p>
        </div>
        <p id="placeholderText" style="color: #666;">Bereit für deine Idee</p>
        <img id="outputImg">
    </div>

    <button id="saveBtn" style="display:none; background:#27ae60; margin-top:10px;" class="btn-gen" onclick="openModal()">Speichern unter...</button>
</div>

<div id="modal" class="modal-overlay">
    <div class="modal">
        <h3 style="margin-top:0; color: black;">Speichern unter...</h3>
        <input type="text" id="fileNameInput" style="background:white; color:black; border: 1px solid #ddd;">
        <button class="btn-download" onclick="downloadImage()">Download</button>
        <p onclick="closeModal()" style="color:gray; margin-top:15px; cursor:pointer; font-size: 14px;">Abbrechen</p>
    </div>
</div>

<script>
    const outputImg = document.getElementById('outputImg');
    const loaderContainer = document.getElementById('loader-container');
    const placeholderText = document.getElementById('placeholderText');
    const timerText = document.getElementById('timerText');
    const saveBtn = document.getElementById('saveBtn');
    const genBtn = document.getElementById('genBtn');

    let seconds = 0;
    let timerInterval;

    function generate() {
        const prompt = document.getElementById('promptInput').value;
        if(!prompt) return alert("Gib erst einen Text ein!");

        // UI Reset
        outputImg.style.display = "none";
        saveBtn.style.display = "none";
        placeholderText.style.display = "none";
        loaderContainer.style.display = "block";
        genBtn.disabled = true;
        genBtn.style.opacity = "0.5";

        // Timer starten
        seconds = 0;
        timerText.innerText = "Sekunden: 0";
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            timerText.innerText = "Sekunden: " + seconds;
            if(seconds > 30) { // Timeout nach 30 Sek
                clearInterval(timerInterval);
                alert("Dauert zu lange. Bitte Seite neu laden oder anderen Prompt versuchen.");
                location.reload();
            }
        }, 1000);

        const seed = Math.floor(Math.random() * 999999);
        // Wir nutzen die stabilste URL-Form
        const finalUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=800&height=800&nologo=true`;
        
        outputImg.src = finalUrl;
        
        outputImg.onload = () => {
            clearInterval(timerInterval);
            loaderContainer.style.display = "none";
            outputImg.style.display = "block";
            saveBtn.style.display = "block";
            genBtn.disabled = false;
            genBtn.style.opacity = "1";
        };

        outputImg.onerror = () => {
            clearInterval(timerInterval);
            alert("Fehler beim Laden. Versuche es nochmal!");
            location.reload();
        };
    }

    function openModal() {
        document.getElementById('fileNameInput').value = "AImage-" + Math.floor(Date.now()/1000);
        document.getElementById('modal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('modal').style.display = "none";
    }

    function downloadImage() {
        const name = document.getElementById('fileNameInput').value || 'bild';
        // Sicherster Download für Safari & Chrome auf GitHub
        window.open(outputImg.src, '_blank');
        closeModal();
    }
</script>

</body>
</html>
