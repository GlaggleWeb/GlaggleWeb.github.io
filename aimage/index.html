<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage Generator</title>
    <style>
        :root {
            --primary: #6200ea;
            --bg: #121212;
            --card: #ffffff;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
        }
        #image-container {
            margin: 20px 0;
            background: #222;
            border-radius: 15px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        img { width: 100%; height: auto; display: none; border-radius: 10px; }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
        }
        .secondary-btn { background: #eee; color: #333; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0; color:#333;">AImage</h2>
    <input type="text" id="promptInput" placeholder="Was soll ich generieren?">
    <button onclick="generate()">Bild generieren</button>

    <div id="image-container">
        <div class="loader" id="loader"></div>
        <img id="resultImg">
    </div>

    <button id="saveBtn" style="background: #27ae60; display: none;">Bild speichern</button>
</div>

<div id="saveModal" class="modal-overlay">
    <div class="modal">
        <h3 style="margin-top:0">Speichern</h3>
        <p style="font-size: 14px; color: #666;">Wähle einen Namen:</p>
        <input type="text" id="fileName">
        <button onclick="confirmDownload()">Download</button>
        <button class="secondary-btn" onclick="closeModal()">Abbrechen</button>
    </div>
</div>

<script>
    const img = document.getElementById('resultImg');
    const loader = document.getElementById('loader');
    const saveBtn = document.getElementById('saveBtn');
    const modal = document.getElementById('saveModal');
    const fileNameInput = document.getElementById('fileName');

    function generate() {
        const prompt = document.getElementById('promptInput').value;
        if(!prompt) return alert("Bitte Text eingeben!");

        img.style.display = 'none';
        saveBtn.style.display = 'none';
        loader.style.display = 'block';

        const seed = Math.floor(Math.random() * 999999);
        // Wir nutzen die direkte URL ohne Proxy
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;
        
        img.src = imageUrl;
    }

    img.onload = () => {
        loader.style.display = 'none';
        img.style.display = 'block';
        saveBtn.style.display = 'block';
    };

    img.onerror = () => {
        loader.style.display = 'none';
        alert("Fehler beim Laden des Bildes. Probiere es kurz noch einmal.");
    };

    saveBtn.onclick = () => {
        fileNameInput.value = "AImage-" + Math.floor(Date.now() / 1000);
        modal.classList.add('active');
    };

    function closeModal() {
        modal.classList.remove('active');
    }

    async function confirmDownload() {
        const name = fileNameInput.value || 'bild';
        const imageUrl = img.src;

        try {
            // Wir versuchen das Bild zu laden
            const response = await fetch(imageUrl);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        } catch (e) {
            // FALLBACK FÜR SAFARI:
            // Falls CORS (fetch) fehlschlägt, öffnen wir das Bild in einem neuen Tab
            // Dort kann der User es per Rechtsklick/Lange drücken speichern
            window.open(imageUrl, '_blank');
        }
        closeModal();
    }
</script>
</body>
</html>
