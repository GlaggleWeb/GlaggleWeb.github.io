<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage Pro</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #121212;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        h2 { color: white; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        .btn-gen {
            background: #310085; /* Dein Lila */
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        #result-box {
            margin-top: 20px;
            background: #2a2a2a;
            height: 300px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #333;
        }
        img { width: 100%; display: none; }
        .loader {
            border: 3px solid #444;
            border-top: 3px solid #310085;
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modal Style wie im Screenshot */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 280px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AImage Generator</h2>
    <input type="text" id="prompt" placeholder="Was soll ich generieren?">
    <button class="btn-gen" onclick="generate()">Bild generieren</button>
    <div id="result-box">
        <div id="loader" style="display:none"><div class="loader"></div></div>
        <img id="output">
    </div>
    <button id="saveBtn" style="display:none; background:#27ae60; margin-top:10px;" class="btn-gen" onclick="openModal()">Speichern unter...</button>
</div>

<div id="modal" class="modal-overlay">
    <div class="modal">
        <h3 style="margin-top:0; color:black">Speichern unter...</h3>
        <input type="text" id="filename" style="background:white; color:black; border: 1px solid #ddd;">
        <button class="btn-gen" style="background:#6200ea" onclick="download()">Download</button>
        <p onclick="closeModal()" style="color:gray; margin-top:10px; cursor:pointer;">Abbrechen</p>
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const loader = document.getElementById('loader');
    const saveBtn = document.getElementById('saveBtn');

    function generate() {
        const text = document.getElementById('prompt').value;
        if(!text) return;

        loader.style.display = "block";
        output.style.display = "none";
        saveBtn.style.display = "none";

        const seed = Math.floor(Math.random() * 10000);
        
        // DER PROXY-TRICK:
        // Wir nutzen den "wsrv.nl" Proxy. Dieser lädt das Bild für uns 
        // und liefert es an Safari aus. Das umgeht fast alle Sperren.
        const rawUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?seed=${seed}&width=800&height=800&nologo=true`;
        const proxiedUrl = `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&default=error`;

        output.src = proxiedUrl;

        output.onload = () => {
            loader.style.display = "none";
            output.style.display = "block";
            saveBtn.style.display = "block";
        };

        output.onerror = () => {
            // Falls der Proxy hakt, versuchen wir es ein letztes Mal direkt
            if(output.src !== rawUrl) {
                output.src = rawUrl;
            } else {
                loader.style.display = "none";
                alert("Fehler beim Laden. Bitte probiere einen anderen Begriff.");
            }
        };
    }

    function openModal() {
        document.getElementById('filename').value = "KI-Bild-" + Date.now();
        document.getElementById('modal').style.display = "flex";
    }

    function closeModal() { document.getElementById('modal').style.display = "none"; }

    function download() {
        window.open(output.src, '_blank');
        closeModal();
    }
</script>
</body>
</html>
