<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glaggle Code Maker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0d0f14;
  --s1:       #13151c;
  --s2:       #181b24;
  --s3:       #1e2230;
  --border:   #252a3a;
  --border2:  #364060;
  --text:     #dce3f5;
  --muted:    #5a6485;
  --bright:   #ffffff;

  --blue:     #5b9bff;
  --green:    #3de89a;
  --orange:   #ff9144;
  --yellow:   #f9d45a;
  --red:      #ff4f72;
  --purple:   #a47dff;
  --cyan:     #2ed4f0;
  --pink:     #ff6bb5;

  --c-io:       #0fa89e;
  --c-var:      #d4751c;
  --c-math:     #2e8fd4;
  --c-logik:    #2ea34f;
  --c-schleife: #bb7a08;
  --c-funk:     #c03a5c;
  --c-liste:    #c85318;
  --c-text:     #8e38c0;
  --c-fehler:   #b82e4e;
  --c-sonstige: #3d506e;

  --radius: 10px;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'Syne', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 13px;
}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ══ HEADER ══ */
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  height: 50px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.5px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo-icon { font-size: 1.3rem; }
.logo .g1 { color: var(--blue); }
.logo .g2 { color: var(--green); }

.hspace { flex: 1; }

.lang-toggle {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 3px;
  gap: 2px;
}
.lang-btn {
  padding: 4px 14px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 0.75rem;
  border-radius: 20px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.lang-btn.active { background: var(--blue); color: #fff; }
.lang-btn:not(.active):hover { color: var(--text); }

.hbtn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--s2);
  color: var(--text);
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.hbtn:hover { border-color: var(--border2); background: var(--s3); }
.hbtn:disabled { opacity: .35; cursor: not-allowed; }
.hbtn.run { background: linear-gradient(135deg, #2bc87a, #1aad65); border-color: transparent; color: #fff; font-weight: 700; }
.hbtn.run:hover { background: linear-gradient(135deg, #3de89a, #2bc87a); }
.hbtn.danger { color: var(--red); }
.hbtn.danger:hover { border-color: var(--red); background: rgba(255,79,114,.08); }
.hbtn.ai-btn { background: linear-gradient(135deg, #6e4fff, #a54fff); border-color: transparent; color: #fff; font-weight: 700; }
.hbtn.ai-btn:hover { background: linear-gradient(135deg, #8060ff, #bf60ff); }

.counter {
  font-size: .72rem;
  color: var(--muted);
  font-weight: 700;
  padding: 4px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-family: var(--font-mono);
}

/* ══ MAIN LAYOUT ══ */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ══ PALETTE ══ */
.palette {
  width: 255px;
  flex-shrink: 0;
  background: var(--s1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pal-header {
  padding: 10px 10px 6px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pal-search-wrap {
  position: relative;
}
.pal-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: .85rem;
  pointer-events: none;
}
.pal-search {
  width: 100%;
  padding: 7px 10px 7px 30px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: .8rem;
  outline: none;
  transition: border-color .15s;
}
.pal-search:focus { border-color: var(--blue); }
.pal-search::placeholder { color: var(--muted); }

.pal-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.cat-pill {
  padding: 3px 9px;
  border: none;
  border-radius: 20px;
  font-size: .67rem;
  font-weight: 700;
  font-family: var(--font-ui);
  cursor: pointer;
  opacity: .5;
  transition: opacity .15s, transform .1s;
  color: #fff;
}
.cat-pill:hover, .cat-pill.active { opacity: 1; transform: scale(1.05); }

.pal-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.pal-group-label {
  font-size: .62rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--muted);
  padding: 9px 4px 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pal-group-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* ══ PALETTE BLOCK ══ */
.block {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: .75rem;
  font-weight: 600;
  cursor: grab;
  user-select: none;
  transition: transform .1s, filter .15s, box-shadow .15s;
  min-height: 30px;
  border-bottom: 2px solid rgba(0,0,0,.35);
  position: relative;
}
.block:hover { transform: translateX(4px); filter: brightness(1.15); box-shadow: -3px 0 0 rgba(255,255,255,.15); }
.block:active { cursor: grabbing; transform: scale(.97); }
.block .bname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ══ CANVAS ══ */
.canvas-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--s2);
  overflow: hidden;
}

.canvas-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--s1);
  flex-shrink: 0;
}
.canvas-hint {
  font-size: .74rem;
  color: var(--muted);
  flex: 1;
  font-weight: 500;
}
.cb-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  font-size: .7rem;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.cb-btn:hover { color: var(--text); border-color: var(--border2); }

.canvas-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 18px;
  background-image: radial-gradient(circle, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 22px 22px;
  position: relative;
}

.empty-state {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  color: var(--muted);
}
.empty-state .em { font-size: 3.5rem; margin-bottom: 12px; opacity: .6; }
.empty-state p { font-size: .88rem; font-weight: 700; margin-bottom: 4px; }
.empty-state small { font-size: .72rem; opacity: .6; }

#block-stack {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-height: 50vh;
}

/* ══ STACK BLOCKS ══ */
.sb {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: .78rem;
  font-weight: 600;
  cursor: grab;
  min-height: 36px;
  border-bottom: 3px solid rgba(0,0,0,.3);
  border-left: 3px solid rgba(255,255,255,.12);
  position: relative;
  transition: box-shadow .12s;
  user-select: none;
}
.sb:hover { box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.sb:active { cursor: grabbing; }
.sb.dragging { opacity: .25; }

.ind1 { margin-left: 20px; }
.ind2 { margin-left: 40px; }
.ind3 { margin-left: 60px; }

.sb-icon { font-size: .9rem; flex-shrink: 0; }
.sb-label { white-space: nowrap; font-size: .74rem; flex-shrink: 0; }

.sb input[type="text"], .sb input[type="number"] {
  background: rgba(0,0,0,.3);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 5px;
  color: #fff;
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: .7rem;
  padding: 2px 7px;
  outline: none;
  min-width: 40px;
  transition: background .12s, border-color .15s;
}
.sb input[type="text"] { width: 88px; }
.sb input[type="number"] { width: 58px; }
.sb input:focus { background: rgba(0,0,0,.5); border-color: rgba(255,255,255,.5); }

.sb-actions {
  display: none;
  align-items: center;
  gap: 2px;
  margin-left: auto;
  flex-shrink: 0;
}
.sb:hover .sb-actions { display: flex; }
.sba {
  width: 22px; height: 22px;
  border: none;
  border-radius: 5px;
  background: rgba(0,0,0,.35);
  color: rgba(255,255,255,.5);
  font-size: .68rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}
.sba:hover { background: rgba(0,0,0,.6); color: #fff; }
.sba.del:hover { background: rgba(220,40,60,.65); color:#fff; }
.sba.dup:hover { background: rgba(91,155,255,.4); color:#fff; }

/* Drop zone */
.dz {
  height: 3px;
  border-radius: 2px;
  background: transparent;
  transition: height .12s, background .12s;
  margin: 1px 0;
  flex-shrink: 0;
}
.dz.over { height: 16px; background: var(--green); opacity: .45; border-radius: 4px; }

/* ══ RIGHT PANEL ══ */
.right-panel {
  width: 340px;
  flex-shrink: 0;
  background: var(--bg);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

/* Code header */
.code-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--s1);
  flex-shrink: 0;
}
.code-title { font-size: .78rem; font-weight: 800; color: var(--text); flex: 1; }
.lang-dot { width:8px; height:8px; border-radius:50%; background: var(--blue); flex-shrink:0; }
.cb2 {
  padding: 4px 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  font-size: .7rem;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.cb2:hover { border-color: var(--border2); color: var(--text); }

#code-out {
  flex: 1;
  padding: 14px;
  font-family: var(--font-mono);
  font-size: .72rem;
  line-height: 1.9;
  overflow-y: auto;
  white-space: pre;
  color: var(--text);
  min-height: 0;
}

/* ── Syntax Highlighting (simpel, kein HTML-Müll in Code) ── */
.hl-kw  { color: #c084fc; font-weight: 600; }
.hl-str { color: #86efac; }
.hl-num { color: #fbbf24; }
.hl-cmt { color: #3f4d6e; font-style: italic; }
.hl-fn  { color: #7dd3fc; }
.hl-op  { color: #67e8f9; }

/* ── Ausgabe ── */
.out-panel {
  border-top: 1px solid var(--border);
  background: #080a0f;
  flex-shrink: 0;
  max-height: 130px;
  display: flex;
  flex-direction: column;
}
.out-bar {
  display: flex;
  align-items: center;
  padding: 5px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.out-label { font-size: .63rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); flex:1; }
.out-clear { background:none; border:none; color: var(--muted); font-size:.7rem; cursor:pointer; font-family: var(--font-ui); padding: 2px 6px; border-radius:4px; }
.out-clear:hover { color: var(--text); }
#out-text {
  flex:1;
  padding: 7px 12px;
  font-family: var(--font-mono);
  font-size: .71rem;
  color: var(--green);
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ══ KI PANEL ══ */
.ai-panel {
  border-top: 1px solid var(--border);
  background: var(--s1);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  max-height: 220px;
}
.ai-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}
.ai-header:hover { background: var(--s2); }
.ai-title { font-size: .75rem; font-weight: 800; flex:1; }
.ai-badge {
  font-size: .6rem;
  font-weight: 800;
  padding: 2px 7px;
  background: linear-gradient(135deg, #6e4fff, #a54fff);
  border-radius: 20px;
  color:#fff;
  letter-spacing:.5px;
}
.ai-toggle-icon { color: var(--muted); font-size: .8rem; transition: transform .2s; }
.ai-toggle-icon.open { transform: rotate(180deg); }

.ai-body {
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;
  transition: max-height .25s ease;
  max-height: 0;
}
.ai-body.open { max-height: 180px; }

.ai-key-row {
  display: flex;
  gap: 6px;
  padding: 8px 10px 4px;
  flex-shrink: 0;
}
.ai-key-row input {
  flex: 1;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: .7rem;
  outline: none;
  transition: border-color .15s;
}
.ai-key-row input:focus { border-color: var(--purple); }
.ai-key-row input::placeholder { color: var(--muted); font-family: var(--font-ui); }

.ai-actions {
  display: flex;
  gap: 6px;
  padding: 4px 10px 6px;
  flex-shrink: 0;
}
.ai-action-btn {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--s3);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: .7rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
}
.ai-action-btn:hover { border-color: var(--purple); background: rgba(164,127,255,.12); color: var(--purple); }
.ai-action-btn.primary { background: linear-gradient(135deg, #6e4fff, #a54fff); border-color: transparent; color:#fff; }
.ai-action-btn.primary:hover { filter: brightness(1.15); }

.ai-output {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px 8px;
  font-size: .71rem;
  line-height: 1.55;
  color: var(--text);
  min-height: 40px;
}
.ai-output .ai-msg-ai {
  background: rgba(110,79,255,.12);
  border: 1px solid rgba(110,79,255,.25);
  border-radius: 7px;
  padding: 6px 10px;
  color: #c4b5fd;
  font-size: .7rem;
  font-family: var(--font-mono);
  white-space: pre-wrap;
  word-break: break-word;
}
.ai-output .ai-msg-sys {
  color: var(--muted);
  font-style: italic;
  font-size: .68rem;
  text-align: center;
  padding: 4px;
}
.ai-output .ai-msg-err {
  color: var(--red);
  font-size: .7rem;
  font-family: var(--font-mono);
  white-space: pre-wrap;
}
.ai-spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ DRAG GHOST ══ */
#ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  border-radius: 8px;
  padding: 7px 14px;
  font-family: var(--font-ui);
  font-size: .8rem;
  font-weight: 700;
  box-shadow: 0 12px 40px rgba(0,0,0,.75);
  opacity: .88;
  display: none;
  align-items: center;
  gap: 6px;
  border-bottom: 3px solid rgba(0,0,0,.35);
  transform: rotate(-2deg) scale(1.05);
}

/* ══ TOOLTIP ══ */
#tip {
  position: fixed;
  background: var(--s3);
  border: 1px solid var(--border2);
  border-radius: 9px;
  padding: 7px 12px;
  font-size: .72rem;
  pointer-events: none;
  z-index: 10000;
  max-width: 220px;
  display: none;
  box-shadow: 0 8px 28px rgba(0,0,0,.6);
  line-height: 1.5;
  color: var(--text);
}
#tip b { color: var(--green); display: block; margin-bottom: 3px; font-size: .75rem; }

/* ══ TOAST ══ */
#toast {
  position: fixed;
  bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--s3);
  border: 1px solid var(--border2);
  border-radius: 22px;
  padding: 8px 20px;
  font-size: .78rem;
  font-weight: 700;
  box-shadow: 0 8px 28px rgba(0,0,0,.6);
  z-index: 20000;
  transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* Kategorie-Farben */
.b-io       { background: var(--c-io); }
.b-var      { background: var(--c-var); }
.b-math     { background: var(--c-math); }
.b-logik    { background: var(--c-logik); }
.b-schleife { background: var(--c-schleife); }
.b-funk     { background: var(--c-funk); }
.b-liste    { background: var(--c-liste); }
.b-text     { background: var(--c-text); }
.b-fehler   { background: var(--c-fehler); }
.b-sonstige { background: var(--c-sonstige); }
</style>
</head>
<body>

<div id="ghost"></div>
<div id="tip"></div>
<div id="toast"></div>

<!-- ══ HEADER ══ -->
<header>
  <div class="logo">
    <span class="logo-icon">🧩</span>
    <span><span class="g1">Glaggle</span> <span class="g2">Code</span> Maker</span>
  </div>

  <div class="lang-toggle" id="lang-wrap">
    <button class="lang-btn active" id="btn-py" onclick="setLang('py')">🐍 Python</button>
    <button class="lang-btn"        id="btn-js" onclick="setLang('js')">🟡 JavaScript</button>
  </div>

  <div class="hspace"></div>

  <button class="hbtn" onclick="undo()" id="btn-undo" disabled title="Strg+Z">↩ Rückgängig</button>
  <button class="hbtn" onclick="redo()" id="btn-redo" disabled title="Strg+Y">↪ Wiederholen</button>
  <button class="hbtn" onclick="speichern()" title="Strg+S">💾 Speichern</button>
  <button class="hbtn" onclick="laden()">📂 Laden</button>
  <button class="hbtn run" onclick="ausfuehren()">▶ Ausführen</button>
  <button class="hbtn danger" onclick="allesLoeschen()">🗑 Löschen</button>
  <span class="counter" id="zaehler">0 Blöcke</span>
</header>

<!-- ══ MAIN ══ -->
<div class="main">

  <!-- PALETTE -->
  <div class="palette">
    <div class="pal-header">
      <div class="pal-search-wrap">
        <span class="pal-search-icon">🔍</span>
        <input class="pal-search" type="text" id="suchfeld" placeholder="Blöcke suchen …" oninput="sucheBloecke(this.value)">
      </div>
      <div class="pal-cats" id="kat-buttons"></div>
    </div>
    <div class="pal-list" id="pal-liste"></div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap">

function pq(v) {
  if (v === undefined || v === null) return '""';
  const s = String(v);
  if (/^[a-zA-Z_$][a-zA-Z0-9_$.[\]"'`]*$/.test(s)) return s;
  if (/^-?\d+(\.\d+)?$/.test(s)) return s;
  return `"${s}"`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function init() {
  initKategorien();
  renderPalette('alle', '');
  renderStapel();
  kodeAktualisieren();
}

// ══════════════════════════════════════════════════════════════════
//  KATEGORIEN
// ══════════════════════════════════════════════════════════════════
function initKategorien() {
  const wrap = document.getElementById('kat-buttons');
  Object.entries(KATEGORIEN).forEach(([k, m]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (k === 'alle' ? ' active' : '');
    btn.textContent = m.label;
    btn.style.background = m.farbe;
    btn.onclick = () => {
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      aktivKat = k;
      renderPalette(k, document.getElementById('suchfeld').value);
    };
    wrap.appendChild(btn);
  });
}

// ══════════════════════════════════════════════════════════════════
//  PALETTE
// ══════════════════════════════════════════════════════════════════
function renderPalette(kat, suche) {
  const liste = document.getElementById('pal-liste');
  liste.innerHTML = '';
  const q = (suche || '').toLowerCase().trim();
  const gefiltert = BLOECKE.filter(b =>
    (kat === 'alle' || b.kat === kat) &&
    (!q || b.de.toLowerCase().includes(q) || b.kat.includes(q) || b.hilfe.toLowerCase().includes(q))
  );

  if (gefiltert.length === 0) {
    liste.innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 8px;font-size:.78rem;">Keine Blöcke gefunden</div>';
    return;
  }

  const gruppen = {};
  gefiltert.forEach(b => { (gruppen[b.kat] = gruppen[b.kat] || []).push(b); });

  Object.entries(gruppen).forEach(([k, blist]) => {
    if (kat === 'alle') {
      const lbl = document.createElement('div');
      lbl.className = 'pal-group-label';
      lbl.textContent = (KATEGORIEN[k] || {label:k}).label;
      liste.appendChild(lbl);
    }
    blist.forEach(b => liste.appendChild(palBlock(b)));
  });
}

function palBlock(def) {
  const el = document.createElement('div');
  el.className = `block b-${def.kat}`;
  el.draggable = true;
  el.dataset.id = def.id;
  el.innerHTML = `<span style="flex-shrink:0;font-size:.9rem">${def.icon}</span><span class="bname">${def.de}</span>`;

  el.addEventListener('mouseenter', e => showTip(def.de, def.hilfe, e));
  el.addEventListener('mousemove',  e => moveTip(e));
  el.addEventListener('mouseleave', hideTip);

  el.addEventListener('dragstart', e => {
    ziehen = { typ:'palette', id:def.id };
    ghostShow(def);
    e.dataTransfer.effectAllowed = 'copy';
  });
  el.addEventListener('dragend', ghostHide);

  el.addEventListener('dblclick', () => {
    undoSpeichern();
    const p = {}; def.params.forEach(pr => p[pr.n] = pr.v);
    stapel.push({ id:def.id, p });
    renderStapel(); kodeAktualisieren();
    toast(`${def.icon} ${def.de} hinzugefügt`);
  });

  return el;
}

// ══════════════════════════════════════════════════════════════════
//  DRAG GHOST
// ══════════════════════════════════════════════════════════════════
document.addEventListener('dragover', e => {
  const g = document.getElementById('ghost');
  if (g.style.display !== 'none') {
    g.style.left = (e.clientX + 14) + 'px';
    g.style.top  = (e.clientY + 8)  + 'px';
  }
});
function ghostShow(def) {
  const g = document.getElementById('ghost');
  g.className = `block b-${def.kat}`;
  g.style.display = 'flex';
  g.innerHTML = `<span>${def.icon}</span>${def.de}`;
}
function ghostHide() {
  const g = document.getElementById('ghost');
  g.style.display = 'none';
  hideTip();
}

// ══════════════════════════════════════════════════════════════════
//  CANVAS DROP
// ══════════════════════════════════════════════════════════════════
const canvasBody = document.getElementById('canvas-body');
canvasBody.addEventListener('dragover', e => e.preventDefault());
canvasBody.addEventListener('drop', e => {
  e.preventDefault();
  if (!ziehen || ziehen.typ !== 'palette') return;
  const def = BLOECKE.find(b => b.id === ziehen.id);
  if (!def) return;
  undoSpeichern();
  const p = {}; def.params.forEach(pr => p[pr.n] = pr.v);
  stapel.push({ id:def.id, p });
  renderStapel(); kodeAktualisieren();
  ziehen = null; ghostHide();
});

// ══════════════════════════════════════════════════════════════════
//  STAPEL RENDERN
// ══════════════════════════════════════════════════════════════════
function renderStapel() {
  const stack = document.getElementById('block-stack');
  const hint  = document.getElementById('leer-hinweis');
  stack.innerHTML = '';
  hint.style.display = stapel.length === 0 ? '' : 'none';

  const n = stapel.length;
  document.getElementById('zaehler').textContent = `${n} Block${n === 1 ? '' : 'e'}`;
  document.getElementById('canvas-info').textContent =
    n === 0
      ? 'Blöcke doppelklicken oder hierher ziehen →'
      : `${n} Block${n === 1 ? '' : 'e'} — Drag zum Sortieren`;

  undoRedoBtnStatus();

  stack.appendChild(dropzone(0));
  stapel.forEach((item, idx) => {
    const def = BLOECKE.find(b => b.id === item.id);
    if (!def) return;
    stack.appendChild(stapelBlock(def, item, idx));
    stack.appendChild(dropzone(idx + 1));
  });
}

function stapelBlock(def, item, idx) {
  const el = document.createElement('div');
  el.className = `sb b-${def.kat}`;
  el.draggable = true;
  el.dataset.idx = idx;

  const lvl = Math.min(einrueckung(idx), 3);
  if (lvl > 0) el.classList.add(`ind${lvl}`);

  let html = `<span class="sb-icon">${def.icon}</span><span class="sb-label">${def.de}</span>`;
  def.params.forEach(pr => {
    const val = item.p[pr.n] !== undefined ? item.p[pr.n] : pr.v;
    html += `<input type="${pr.t === 'num' ? 'number' : 'text'}" data-key="${esc(pr.n)}" value="${esc(String(val))}" style="width:${pr.w || 70}px">`;
  });
  html += `<span class="sb-actions">
    <button class="sba" data-mv="-1" title="Nach oben">↑</button>
    <button class="sba" data-mv="1"  title="Nach unten">↓</button>
    <button class="sba dup" title="Duplizieren">⧉</button>
    <button class="sba del" title="Löschen">✕</button>
  </span>`;
  el.innerHTML = html;

  // Inputs
  el.querySelectorAll('input[data-key]').forEach(inp => {
    inp.addEventListener('input',     () => { item.p[inp.dataset.key] = inp.value; kodeAktualisieren(); });
    inp.addEventListener('mousedown', e  => e.stopPropagation());
    inp.addEventListener('keydown',   e  => e.stopPropagation());
  });

  // Buttons
  el.querySelector('[data-mv="-1"]').addEventListener('click', e => { e.stopPropagation(); blockBewegen(idx, -1); });
  el.querySelector('[data-mv="1"]').addEventListener('click',  e => { e.stopPropagation(); blockBewegen(idx, +1); });
  el.querySelector('.dup').addEventListener('click', e => { e.stopPropagation(); blockDuplik(idx); });
  el.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); blockLoeschen(idx); });

  // Drag (sort)
  el.addEventListener('dragstart', e => {
    ziehen = { typ:'stapel', idx };
    el.classList.add('dragging');
    ghostShow(def);
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  });
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); ghostHide(); ziehen = null; });

  return el;
}

function dropzone(insertAt) {
  const dz = document.createElement('div');
  dz.className = 'dz';
  dz.dataset.at = insertAt;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    dz.classList.remove('over');
    const at = parseInt(dz.dataset.at);
    if (!ziehen) return;
    undoSpeichern();
    if (ziehen.typ === 'palette') {
      const def = BLOECKE.find(b => b.id === ziehen.id);
      if (!def) return;
      const p = {}; def.params.forEach(pr => p[pr.n] = pr.v);
      stapel.splice(at, 0, { id:def.id, p });
    } else if (ziehen.typ === 'stapel') {
      const src = ziehen.idx;
      const [moved] = stapel.splice(src, 1);
      const realAt = src < at ? at - 1 : at;
      stapel.splice(realAt, 0, moved);
    }
    ziehen = null; ghostHide();
    renderStapel(); kodeAktualisieren();
  });
  return dz;
}

// ══════════════════════════════════════════════════════════════════
//  EINRÜCKUNG
// ══════════════════════════════════════════════════════════════════
function blockCode(item) {
  const def = BLOECKE.find(b => b.id === item.id);
  if (!def) return '';
  try { return lang === 'py' ? def.py(item.p) : def.js(item.p); }
  catch(e) { return ''; }
}

function istOeffner(code) {
  const t = code.trimEnd();
  if (lang === 'py') return t.endsWith(':');
  // In JS: endet mit '{' aber nicht mit '{}' (leeres Objekt)
  return t.endsWith('{') && !/(=\s*\{|:\s*\{|\(\s*\{)$/.test(t.trimEnd());
}

function istSchliesser(code) {
  const t = code.trimStart();
  if (lang === 'py') {
    return t.startsWith('elif ') || t.startsWith('else:') ||
           t.startsWith('except') || t.startsWith('finally') ||
           t.startsWith('# Ende');
  }
  // JS: reine schließende Klammer (auch "} else {" etc.)
  return t.startsWith('}');
}

function einrueckung(idx) {
  let level = 0;
  for (let i = 0; i < idx; i++) {
    const c = blockCode(stapel[i]);
    if (istSchliesser(c)) level = Math.max(0, level - 1);
    if (istOeffner(c))    level++;
  }
  if (idx < stapel.length) {
    const c = blockCode(stapel[idx]);
    if (istSchliesser(c)) level = Math.max(0, level - 1);
  }
  return Math.max(0, level);
}

// ══════════════════════════════════════════════════════════════════
//  CODE GENERIEREN (plain text, kein HTML in Code-Ausgabe)
// ══════════════════════════════════════════════════════════════════
function getRoherCode() {
  if (stapel.length === 0) return '';
  const IND = '    ';
  let indent = 0;
  const zeilen = [];

  stapel.forEach(item => {
    const def = BLOECKE.find(b => b.id === item.id);
    if (!def) return;
    let roh;
    try { roh = lang === 'py' ? def.py(item.p) : def.js(item.p); }
    catch(e) { roh = lang === 'py' ? '# Fehler im Block' : '// Fehler im Block'; }

    if (istSchliesser(roh)) indent = Math.max(0, indent - 1);
    roh.split('\n').forEach(zeile => zeilen.push(IND.repeat(indent) + zeile));
    if (istOeffner(roh)) indent++;
  });

  return zeilen.join('\n');
}

function kodeAktualisieren() {
  const out = document.getElementById('code-out');
  if (stapel.length === 0) {
    const cmt = lang === 'py' ? '# Füge Blöcke hinzu …' : '// Füge Blöcke hinzu …';
    out.innerHTML = `<span class="hl-cmt">${esc(cmt)}</span>`;
    return;
  }

  const roher = getRoherCode();
  out.innerHTML = roher.split('\n').map(zeile => hlZeile(zeile)).join('\n');
}

// ── Syntax Highlighting (sauber, kein Inline-HTML in Bezeichnern) ──
function hlZeile(zeile) {
  const t = zeile.trim();
  if (t.startsWith('#') || t.startsWith('//')) {
    return `<span class="hl-cmt">${esc(zeile)}</span>`;
  }

  // HTML-escape first, dann token-basiertes Highlighting
  let s = esc(zeile);

  if (lang === 'py') {
    // Strings zuerst (Priorität)
    s = s.replace(/(f?&quot;[^&]*&quot;|f?&#39;[^&]*&#39;)/g, '<span class="hl-str">$1</span>');
    // Keywords
    s = s.replace(/\b(def|class|if|elif|else|for|while|in|return|import|from|as|try|except|finally|raise|pass|break|continue|lambda|global|with|assert|del|not|and|or|True|False|None|async|await)\b/g,
      '<span class="hl-kw">$1</span>');
    // Zahlen (nur außerhalb von Tags)
    s = s.replace(/(?<![a-zA-Z_])\b(\d+\.?\d*)\b/g, '<span class="hl-num">$1</span>');
  } else {
    // JS Strings
    s = s.replace(/(&quot;[^&]*&quot;|&#39;[^&]*&#39;|`[^`]*`)/g, '<span class="hl-str">$1</span>');
    // Keywords
    s = s.replace(/\b(const|let|var|function|class|if|else|for|while|do|return|import|export|from|try|catch|finally|throw|break|continue|async|await|new|delete|typeof|instanceof|of|true|false|null|undefined)\b/g,
      '<span class="hl-kw">$1</span>');
    // Zahlen
    s = s.replace(/(?<![a-zA-Z_])\b(\d+\.?\d*)\b/g, '<span class="hl-num">$1</span>');
  }

  return s;
}

// ══════════════════════════════════════════════════════════════════
//  BLOCK-AKTIONEN
// ══════════════════════════════════════════════════════════════════
function blockLoeschen(idx) { undoSpeichern(); stapel.splice(idx, 1); renderStapel(); kodeAktualisieren(); }
function blockDuplik(idx) { undoSpeichern(); stapel.splice(idx+1, 0, JSON.parse(JSON.stringify(stapel[idx]))); renderStapel(); kodeAktualisieren(); toast('Block dupliziert'); }
function blockBewegen(idx, dir) {
  const z = idx + dir;
  if (z < 0 || z >= stapel.length) return;
  undoSpeichern();
  [stapel[idx], stapel[z]] = [stapel[z], stapel[idx]];
  renderStapel(); kodeAktualisieren();
}

// ══════════════════════════════════════════════════════════════════
//  UNDO / REDO
// ══════════════════════════════════════════════════════════════════
function undoSpeichern() {
  undoStapel.push(JSON.stringify(stapel));
  if (undoStapel.length > 80) undoStapel.shift();
  redoStapel = [];
  undoRedoBtnStatus();
}
function undo() {
  if (!undoStapel.length) return;
  redoStapel.push(JSON.stringify(stapel));
  stapel = JSON.parse(undoStapel.pop());
  renderStapel(); kodeAktualisieren();
}
function redo() {
  if (!redoStapel.length) return;
  undoStapel.push(JSON.stringify(stapel));
  stapel = JSON.parse(redoStapel.pop());
  renderStapel(); kodeAktualisieren();
}
function undoRedoBtnStatus() {
  document.getElementById('btn-undo').disabled = undoStapel.length === 0;
  document.getElementById('btn-redo').disabled = redoStapel.length === 0;
}

// ══════════════════════════════════════════════════════════════════
//  SPRACHE
// ══════════════════════════════════════════════════════════════════
function setLang(l) {
  lang = l;
  document.getElementById('btn-py').classList.toggle('active', l === 'py');
  document.getElementById('btn-js').classList.toggle('active', l === 'js');
  document.getElementById('code-titel').textContent = l === 'py' ? 'Python Code' : 'JavaScript Code';
  document.getElementById('lang-dot').style.background = l === 'py' ? 'var(--blue)' : 'var(--yellow)';
  kodeAktualisieren();
}
function sucheBloecke(v) { renderPalette(aktivKat, v); }

// ══════════════════════════════════════════════════════════════════
//  AUSFÜHREN
// ══════════════════════════════════════════════════════════════════
function ausfuehren() {
  const outEl = document.getElementById('out-text');

  if (lang === 'py') {
    outEl.style.color = 'var(--muted)';
    outEl.style.fontStyle = 'italic';
    outEl.textContent = '🐍 Python läuft nicht direkt im Browser.\nKopiere den Code und führe ihn in Python aus!';
    return;
  }

  const code = getRoherCode();
  if (!code.trim()) {
    outEl.style.color = 'var(--muted)';
    outEl.textContent = 'Kein Code vorhanden.';
    return;
  }

  const logs = [];
  const _log = console.log, _warn = console.warn, _err = console.error, _al = window.alert;
  const fmt = (...a) => a.map(x => { try { return typeof x === 'object' ? JSON.stringify(x) : String(x); } catch { return String(x); } }).join(' ');
  console.log   = (...a) => logs.push(fmt(...a));
  console.warn  = (...a) => logs.push('⚠ ' + fmt(...a));
  console.error = (...a) => logs.push('❌ ' + fmt(...a));
  window.alert  = m  => logs.push('💬 ' + m);

  outEl.style.color = 'var(--green)';
  outEl.style.fontStyle = 'normal';

  try {
    const wrapped = `(async () => {\n${code}\n})().catch(e => console.error(e.message));`;
    eval(wrapped);
    setTimeout(() => {
      outEl.textContent = logs.length > 0 ? logs.join('\n') : '✓ Ausgeführt — keine Ausgabe';
      console.log = _log; console.warn = _warn; console.error = _err; window.alert = _al;
    }, 150);
  } catch (e) {
    console.log = _log; console.warn = _warn; console.error = _err; window.alert = _al;
    outEl.style.color = 'var(--red)';
    outEl.textContent = '❌ Fehler: ' + e.message;
  }
}

function ausgabeLeeren() {
  const o = document.getElementById('out-text');
  o.style.color = 'var(--muted)'; o.style.fontStyle = 'italic';
  o.textContent = 'Bereit.';
}

// ══════════════════════════════════════════════════════════════════
//  KI ASSISTENT (Groq)
// ══════════════════════════════════════════════════════════════════
function toggleAI() {
  aiOffen = !aiOffen;
  const body = document.getElementById('ai-body');
  const icon = document.getElementById('ai-toggle-icon');
  body.classList.toggle('open', aiOffen);
  icon.classList.toggle('open', aiOffen);
}

async function aiAktion(modus) {
  const outEl  = document.getElementById('ai-output');
  
  // Den Key in zwei Teile splitten
  const p1 = 'gsk_U0iRQDNnhohke2QBK16UWGdyb3FY';
  const p2 = '3DkUXv5ACFUGB0C6s1Hcv7zC';

  const code = getRoherCode();
  if (!code.trim() && modus !== 'erklaeren') {
    outEl.innerHTML = '<div class="ai-msg-err">⚠ Kein Code vorhanden. Füge erst Blöcke hinzu.</div>';
    return;
  }

  const prompts = {
    erklaeren: `Du bist ein freundlicher Programmierlehrer auf Deutsch. Erkläre den folgenden ${lang === 'py' ? 'Python' : 'JavaScript'}-Code in 3-5 einfachen Sätzen, was er macht. Sei präzise und anfängerfreundlich.\n\nCode:\n\`\`\`\n${code || '(leer)'}\n\`\`\``,
    fehler:    `Du bist ein Code-Reviewer. Analysiere den folgenden ${lang === 'py' ? 'Python' : 'JavaScript'}-Code auf:\n- Logische Fehler\n- Syntaxfehler\n- Häufige Anfängerfehler\n- Verbesserungsvorschläge\n\nAntworte auf Deutsch. Wenn kein Fehler, sag das kurz.\n\nCode:\n\`\`\`\n${code}\n\`\`\``,
    verbessern:`Du bist ein erfahrener Entwickler. Verbessere den folgenden ${lang === 'py' ? 'Python' : 'JavaScript'}-Code:\n- Behebe alle Fehler\n- Mache ihn klarer und effizienter\n- Erkläre kurz was du geändert hast\n\nAntworte auf Deutsch. Zeige den verbesserten Code in einem Codeblock.\n\nCode:\n\`\`\`\n${code}\n\`\`\``
  };

  const labels = { erklaeren:'Erkläre Code…', fehler:'Prüfe auf Fehler…', verbessern:'Verbessere Code…' };
  outEl.innerHTML = `<div class="ai-msg-sys"><span class="ai-spinner"></span>${labels[modus]}</div>`;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        // Hier werden p1 und p2 wieder kombiniert
        'Authorization': `Bearer ${p1}${p2}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{ role:'user', content: prompts[modus] }],
        max_tokens: 800,
        temperature: 0.5
      })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.error?.message || `HTTP ${res.status}`;
      outEl.innerHTML = `<div class="ai-msg-err">❌ Groq Fehler: ${esc(msg)}</div>`;
      return;
    }

    const data = await res.json();
    const antwort = data.choices?.[0]?.message?.content || '(Keine Antwort)';
    outEl.innerHTML = `<div class="ai-msg-ai">${esc(antwort)}</div>`;

  } catch (e) {
    outEl.innerHTML = `<div class="ai-msg-err">❌ Netzwerkfehler: ${esc(e.message)}\n\nTipp: Stelle sicher dass du einen gültigen Groq API-Key hast (kostenlos auf console.groq.com)</div>`;
  }
}

// ══════════════════════════════════════════════════════════════════
//  KOPIEREN / DOWNLOAD
// ══════════════════════════════════════════════════════════════════
function kopieren() {
  const text = getRoherCode() || (lang === 'py' ? '# Kein Code' : '// Kein Code');
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('kop-btn');
    b.textContent = '✓ Kopiert!';
    setTimeout(() => b.textContent = '📋 Kopieren', 2000);
  }).catch(() => { toast('❌ Kopieren fehlgeschlagen'); });
}

function herunterladen() {
  const text = getRoherCode();
  const ext  = lang === 'py' ? 'py' : 'js';
  const a    = document.createElement('a');
  a.href     = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = 'mein_code.' + ext;
  a.click();
  toast('💾 Code als .' + ext + ' gespeichert');
}

// ══════════════════════════════════════════════════════════════════
//  SPEICHERN / LADEN
// ══════════════════════════════════════════════════════════════════
function speichern() {
  const data = JSON.stringify({ lang, stapel, v:2 }, null, 2);
  navigator.clipboard.writeText(data).then(() => {
    toast('✅ In Zwischenablage gespeichert — mit Laden einfügen');
  }).catch(() => { prompt('Kopiere diesen Text:', data); });
}

function laden() {
  const eingabe = prompt('Füge hier deinen gespeicherten Projekttext ein:');
  if (!eingabe) return;
  try {
    const data = JSON.parse(eingabe);
    if (data.stapel && data.lang) {
      undoSpeichern();
      stapel = data.stapel;
      setLang(data.lang);
      renderStapel(); kodeAktualisieren();
      toast('✅ Projekt geladen!');
    } else { toast('❌ Ungültiges Format'); }
  } catch (e) { toast('❌ Fehler beim Laden'); }
}

// ══════════════════════════════════════════════════════════════════
//  SONSTIGES
// ══════════════════════════════════════════════════════════════════
function allesLoeschen() {
  if (!stapel.length) return;
  if (confirm('Alle Blöcke wirklich löschen?')) {
    undoSpeichern(); stapel = [];
    renderStapel(); kodeAktualisieren();
  }
}
function alleNachOben() {
  document.getElementById('canvas-body').scrollTo({ top:0, behavior:'smooth' });
}

// Tooltip
function showTip(titel, text, e) {
  const t = document.getElementById('tip');
  t.innerHTML = `<b>${esc(titel)}</b>${esc(text)}`;
  t.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  const t = document.getElementById('tip');
  t.style.left = Math.min(e.clientX + 14, window.innerWidth - 230) + 'px';
  t.style.top  = Math.min(e.clientY + 12, window.innerHeight - 80) + 'px';
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

// Toast
let _tt;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 2800);
}

// Tastenkürzel
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    if (e.key === 's') { e.preventDefault(); speichern(); }
    if (e.key === 'Enter') { e.preventDefault(); ausfuehren(); }
  }
});

// ══════════════════════════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════════════════════════
init();
</script>
