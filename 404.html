<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Glaggle</title>
    <style>
        :root {
            /* Apple Tahoe Palette */
            --bg-gradient: radial-gradient(circle at 50% 50%, #fbfbfd 0%, #f5f5f7 100%);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0071e3;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: radial-gradient(circle at 50% 50%, #161617 0%, #000000 100%);
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --accent-blue: #2997ff;
                --glass-bg: rgba(28, 28, 30, 0.7);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        body {
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary); overflow: hidden;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 50px 30px;
            text-align: center;
            max-width: 450px; width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Glaggle Logo Original-Farben */
        .glaggle-logo { font-size: 3.5rem; font-weight: bold; margin-bottom: 5px; }
        .g1 { color: #4285F4; } .l { color: #EA4335; } .a { color: #FBBC05; } 
        .g2 { color: #34A853; } .e { color: #EA4335; }

        .slogan { font-weight: bold; font-size: 1.1rem; margin-bottom: 30px; }

        /* Die dynamische Suchleiste */
        .search-field {
            background: rgba(0,0,0,0.04);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 25px;
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.5s ease;
            white-space: nowrap;
            overflow: hidden;
        }

        .description {
            font-size: 1rem; line-height: 1.5;
            color: var(--text-secondary); margin-bottom: 35px;
        }

        .apple-btn {
            display: inline-block;
            background-color: var(--accent-blue);
            color: white; padding: 12px 28px;
            border-radius: 980px;
            text-decoration: none; font-weight: 500;
            transition: transform 0.2s;
        }
        .apple-btn:hover { transform: scale(1.03); opacity: 0.9; }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="glaggle-logo">
            <span class="g1">G</span><span class="l">l</span><span class="a">a</span><span class="g2">g</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>
        <div class="slogan">your life!</div>
        
        <div class="search-field" id="dynamicPath">
            glaggle://page-not-found
        </div>

        <p class="description">
            Hoppla! Die Seite scheint im digitalen Nirgendwo verschwunden zu sein.
        </p>

        <a href="/" class="apple-btn">Zur Glaggle Suche</a>
    </div>

    <script>
        // Kleines Skript für den Text-Wechsel
        setTimeout(() => {
            const pathElement = document.getElementById('dynamicPath');
            pathElement.style.opacity = '0';
            
            setTimeout(() => {
                // Hier kannst du deinen Website-Namen eintragen
                pathElement.textContent = 'glaggle://deine-website.de';
                pathElement.style.opacity = '1';
                pathElement.style.background = 'rgba(66, 133, 244, 0.1)'; // Sanfter Blau-Ton beim Wechsel
                pathElement.style.color = '#4285F4';
            }, 500);
        }, 2500); // Wechselt nach 2,5 Sekunden
    </script>

</body>
</html>
