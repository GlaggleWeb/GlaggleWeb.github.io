<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden | Glaggle</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #fdfdfd;
            --card-border: #eeeeee;
            --link-color: #2E94D1;
            --desc-color: #555555;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --card-bg: #303134;
                --card-border: #444444;
                --link-color: #8cc9f5;
                --desc-color: #bdc1c6;
                --input-bg: #3c4043;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
        }

        /* Glaggle Logo */
        .glaggle-logo { font-size: 4rem; font-weight: bold; margin-bottom: 5px; }
        .g1 { color: #4285F4; } .l { color: #EA4335; } .a { color: #FBBC05; } 
        .g2 { color: #34A853; } .e { color: #EA4335; }
        .slogan { font-size: 1.2rem; font-weight: bold; margin-bottom: 40px; }

        /* Suchleiste im Original-Stil */
        .search-container {
            width: 90%; max-width: 600px;
            background: var(--input-bg);
            border: 1px solid #dfe1e5;
            border-radius: 30px;
            padding: 12px 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; align-items: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-text {
            font-size: 18px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: sans-serif;
        }

        .error-msg {
            max-width: 500px;
            color: var(--desc-color);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .web-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #70C4F7;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
        }

        .web-button:hover {
            background-color: #2E94D1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="glaggle-logo">
        <span class="g1">G</span><span class="l">l</span><span class="a">a</span><span class="g2">g</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
    </div>
    <div class="slogan">your life!</div>

    <div class="search-container" id="searchBox">
        <span class="search-text">glaggle.ch<span id="wrongPath"></span></span>
    </div>

    <p class="error-msg">
        <strong>404.</strong> Das ist ein Fehler. <br>
        Die angeforderte URL wurde auf diesem Server nicht gefunden. Das ist alles, was wir wissen.
    </p>

    <a href="/" class="web-button">Zurück zur Glaggle-Suche</a>

    <script>
        // Pfad aus der URL auslesen
        const path = window.location.pathname;
        const pathDisplay = document.getElementById('wrongPath');
        const searchBox = document.getElementById('searchBox');

        // Den Pfad anzeigen
        pathDisplay.textContent = path;

        // Nach 2 Sekunden den Fehler-Pfad entfernen und die Box blau leuchten lassen
        setTimeout(() => {
            searchBox.style.borderColor = '#70C4F7';
            searchBox.style.boxShadow = '0 4px 15px rgba(112, 196, 247, 0.4)';
            
            pathDisplay.style.transition = 'opacity 0.5s';
            pathDisplay.style.opacity = '0';
            
            setTimeout(() => {
                pathDisplay.textContent = '';
                pathDisplay.style.opacity = '1';
            }, 500);
        }, 2000);
    </script>

</body>
</html>
