<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Glaggle</title>
    <style>
        :root {
            /* Apple Tahoe Palette */
            --bg-gradient: radial-gradient(circle at 50% 50%, #fbfbfd 0%, #f5f5f7 100%);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0071e3;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: radial-gradient(circle at 50% 50%, #161617 0%, #000000 100%);
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --accent-blue: #2997ff;
                --glass-bg: rgba(28, 28, 30, 0.7);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* Das "Glass" Panel */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow);
            animation: fadeIn 0.8s ease-out;
        }

        /* Glaggle Logo im Apple Stil (dezent bunt) */
        .glaggle-logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        .g1 { color: #4285F4; } .l { color: #EA4335; } .a { color: #FBBC05; } 
        .g2 { color: #34A853; }

        .error-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 20px 0 40px;
        }

        /* Apple-Style Button */
        .apple-btn {
            display: inline-block;
            background-color: var(--accent-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 980px; /* Typisch Apple */
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .apple-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Der bunte Glaggle-Cursor als dezentes Detail */
        .search-field-mockup {
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .caret {
            width: 2px;
            height: 18px;
            margin-left: 4px;
            background: linear-gradient(180deg, #4285F4, #EA4335, #FBBC05, #34A853);
            animation: blink 1s infinite step-end;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="glaggle-logo">
            <span class="g1">G</span>laggle
        </div>
        
        <h1 class="error-title">404.</h1>
        
        <div class="search-field-mockup">
            glaggle://page-not-found
            <div class="caret"></div>
        </div>

        <p class="description">
            Diese Seite wurde nicht gefunden.<br>
            Eventuell wurde sie verschoben oder gelöscht.
        </p>

        <a href="/" class="apple-btn">Zur Startseite</a>
    </div>

</body>
</html>
