<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden | Glaggle</title>
    <style>
        :root {
            --glaggle-blue: #70C4F7;
            --glaggle-dark-blue: #2E94D1;
            --bg-color: #ffffff;
            --text-color: #333333;
            --desc-color: #555555;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --desc-color: #bdc1c6;
                --input-bg: #3c4043;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
        }

        /* Glaggle Logo in Original Blau */
        .glaggle-logo { 
            font-size: 4.5rem; 
            font-weight: bold; 
            margin-bottom: 0; 
            color: var(--glaggle-blue);
            letter-spacing: -2px;
        }
        
        .slogan { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-bottom: 40px; 
            color: var(--text-color);
        }

        /* Suchleiste im Glaggle-Stil */
        .search-container {
            width: 90%; max-width: 600px;
            background: var(--input-bg);
            border: 1px solid #dfe1e5;
            border-radius: 30px;
            padding: 14px 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; align-items: center;
            margin-bottom: 30px;
            transition: all 0.4s ease-in-out;
        }

        .search-text {
            font-size: 18px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Segoe UI', sans-serif;
        }

        .error-msg {
            max-width: 500px;
            color: var(--desc-color);
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        .web-button {
            display: inline-block;
            padding: 15px 35px;
            background-color: var(--glaggle-blue);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s ease;
        }

        .web-button:hover {
            background-color: var(--glaggle-dark-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(112, 196, 247, 0.3);
        }

        #wrongPath {
            color: var(--glaggle-blue);
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="glaggle-logo">Glaggle</div>
    <div class="slogan">your life!</div>

    <div class="search-container" id="searchBox">
        <span class="search-text">glaggle.ch<span id="wrongPath"></span></span>
    </div>

    <p class="error-msg">
        <strong>404.</strong> Das ist ein Fehler. <br>
        Die angeforderte Seite konnte unter <strong>glaggle.ch</strong> nicht gefunden werden.
    </p>

    <a href="/" class="web-button">Zurück zur Suche</a>

    <script>
        // Pfad aus der URL auslesen (z.B. /mein-fehler)
        const path = window.location.pathname;
        const pathDisplay = document.getElementById('wrongPath');
        const searchBox = document.getElementById('searchBox');

        // Den eingegebenen Pfad anzeigen
        pathDisplay.textContent = path;

        // Animation: Nach 2 Sekunden wird die Suche "korrigiert"
        setTimeout(() => {
            // Suchleiste bekommt den blauen Fokus-Ring
            searchBox.style.borderColor = 'var(--glaggle-blue)';
            searchBox.style.boxShadow = '0 4px 20px rgba(112, 196, 247, 0.25)';
            
            // Der falsche Pfad wird sanft ausgeblendet
            pathDisplay.style.transition = 'opacity 0.6s ease';
            pathDisplay.style.opacity = '0';
            
            setTimeout(() => {
                pathDisplay.textContent = '';
                pathDisplay.style.opacity = '1';
            }, 600);
        }, 2200);
    </script>

</body>
</html>
