<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Grand Casino - Daily Limit</title>
    <style>
        :root {
            --bg: #020617;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --text: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            padding: 15px 30px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .limit-info {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .balance-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            width: 95%;
            padding: 40px 0;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .visual-box {
            height: 150px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-size: 2.5rem;
        }

        .roulette-wheel {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #334155;
            transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1);
            background: conic-gradient(#ef4444 0deg 45deg, #1e293b 45deg 90deg, #ef4444 90deg 135deg, #1e293b 135deg 180deg, #ef4444 180deg 225deg, #1e293b 225deg 270deg, #ef4444 270deg 315deg, #1e293b 315deg 360deg);
        }

        .slot-reels { display: flex; gap: 8px; }
        .reel { width: 60px; height: 80px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); }
        .spinning { animation: spin 0.1s infinite; }
        @keyframes spin { 0% { transform: translateY(-5px); } 50% { transform: translateY(5px); } 100% { transform: translateY(-5px); } }

        .coin-flip { transition: transform 0.6s; transform-style: preserve-3d; }
        .flipping { animation: coin-spin 0.6s infinite; }
        @keyframes coin-spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }

        .bet-row {
            display: flex;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .bet-row input {
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.02); }
        .btn:disabled { 
            background: #475569; 
            color: #94a3b8; 
            cursor: not-allowed; 
            opacity: 0.6;
        }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.2rem;
            font-weight: 600;
        }

        .win-text { color: var(--success); }
        .lose-text { color: var(--danger); }

        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: var(--accent);
            color: #000;
            border-radius: 12px;
            font-weight: bold;
            transform: translateY(100px);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .plinko-ball { width: 12px; height: 12px; background: var(--accent); border-radius: 50%; position: absolute; top: 10px; left: 50%; display: none; }
        
        .overlay-limit {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">👑 GLAGGLE GRAND</div>
        <div id="daily-counter" class="limit-info">Heute: 0 / 5 Spiele</div>
        <div class="balance-pill">
            <span style="margin-right: 8px;">🪙</span>
            <span id="balance-val">0</span>
        </div>
    </div>

    <div class="container">
        <div class="games-grid">
            
            <!-- ROULETTE -->
            <div class="game-card">
                <h3>🔴 Roulette</h3>
                <div class="visual-box">
                    <div id="r-wheel" class="roulette-wheel"></div>
                </div>
                <div class="bet-row"><input type="number" id="bet-roulette" value="2" min="1"></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn game-btn" style="background:#ef4444; color:white;" onclick="playRoulette('red')">Rot</button>
                    <button class="btn game-btn" style="background:#1e293b; color:white;" onclick="playRoulette('black')">Schwarz</button>
                </div>
                <div id="msg-roulette" class="msg"></div>
            </div>

            <!-- SLOTS -->
            <div class="game-card">
                <h3>🎰 Glaggle Slots</h3>
                <div class="visual-box">
                    <div class="slot-reels">
                        <div id="s1" class="reel">🍒</div>
                        <div id="s2" class="reel">🍋</div>
                        <div id="s3" class="reel">💎</div>
                    </div>
                </div>
                <div class="bet-row"><input type="number" id="bet-slots" value="1" min="1"></div>
                <button class="btn game-btn" id="btn-slots" onclick="playSlots()">Hebel ziehen</button>
                <div id="msg-slots" class="msg"></div>
            </div>

            <!-- COIN FLIP -->
            <div class="game-card">
                <h3>🪙 Münzwurf</h3>
                <div class="visual-box">
                    <div id="c-visual" class="coin-flip">🪙</div>
                </div>
                <div class="bet-row"><input type="number" id="bet-coin" value="5" min="1"></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn game-btn" onclick="playCoin('heads')">Kopf</button>
                    <button class="btn game-btn" style="background:#475569; color:white;" onclick="playCoin('tails')">Zahl</button>
                </div>
                <div id="msg-coin" class="msg"></div>
            </div>


            <!-- DICE ROLL -->
            <div class="game-card">
                <h3>🎲 Würfel</h3>
                <div class="visual-box" id="d-visual">⚀</div>
                <div class="bet-row"><input type="number" id="bet-dice" value="2" min="1"></div>
                <button class="btn game-btn" onclick="playDice()">Würfeln</button>
                <div id="msg-dice" class="msg"></div>
            </div>

             <!-- MINES -->
             <div class="game-card">
                <h3>💣 Mines</h3>
                <div class="visual-box" style="font-size:1.5rem; display:grid; grid-template-columns: repeat(2, 1fr); gap:5px; padding:10px;">
                    <button class="btn game-btn" style="padding:5px;" onclick="playMines(0)">?</button>
                    <button class="btn game-btn" style="padding:5px;" onclick="playMines(1)">?</button>
                </div>
                <div class="bet-row"><input type="number" id="bet-mines" value="5" min="1"></div>
                <div id="msg-mines" class="msg">Wähle eine Seite!</div>
            </div>

        </div>
    </div>

    <div id="toast"></div>

    <script>
        // --- CONFIG & CONSTANTS ---
        const DAILY_LIMIT = 5;
        let coins = 0;
        let gamesPlayedToday = 0;

        // --- CORE SYSTEM ---
        window.onload = function() {
            initData();
            checkDailyReset();
            updateUI();
        };

        function initData() {
            // Load Coins
            let storedCoins = localStorage.getItem('glaggleCoins');
            if (storedCoins === null) {
                coins = 50; // Etwas mehr Startguthaben wegen des Limits
                localStorage.setItem('glaggleCoins', coins);
                showToast("WILLKOMMEN! +50 COINS STARTGUTHABEN 🎁");
            } else {
                coins = parseInt(storedCoins);
            }

            // Load Daily Count
            gamesPlayedToday = parseInt(localStorage.getItem('glaggleDailyCount') || "0");
        }

        function checkDailyReset() {
            const today = new Date().toLocaleDateString();
            const lastDate = localStorage.getItem('glaggleLastDate');

            if (lastDate !== today) {
                // Neuer Tag!
                gamesPlayedToday = 0;
                localStorage.setItem('glaggleDailyCount', 0);
                localStorage.setItem('glaggleLastDate', today);
                showToast("Neuer Tag! Dein Spiellimit wurde zurückgesetzt. 🕒");
            }
            
            updateButtonsState();
        }

        function updateUI() {
            document.getElementById('balance-val').innerText = coins.toLocaleString();
            document.getElementById('daily-counter').innerText = `Heute: ${gamesPlayedToday} / ${DAILY_LIMIT} Spiele`;
            localStorage.setItem('glaggleCoins', coins);
            localStorage.setItem('glaggleDailyCount', gamesPlayedToday);
            updateButtonsState();
        }

        function updateButtonsState() {
            const btns = document.querySelectorAll('.game-btn');
            const isLimitReached = gamesPlayedToday >= DAILY_LIMIT;
            
            btns.forEach(btn => {
                if (isLimitReached) {
                    btn.disabled = true;
                    btn.title = "Tageslimit erreicht!";
                } else {
                    // Falls der Button nicht gerade durch eine Spiel-Animation gesperrt ist
                    if (!btn.classList.contains('animating')) {
                        btn.disabled = false;
                    }
                }
            });

            if (isLimitReached) {
                const msgs = document.querySelectorAll('.msg');
                msgs.forEach(m => {
                    if (m.innerHTML === "" || m.innerText === "Einsatz platziert...") {
                        m.innerHTML = `<span style="color: #94a3b8">Limit erreicht. Morgen wieder!</span>`;
                    }
                });
            }
        }

        function trackGamePlayed() {
            gamesPlayedToday++;
            updateUI();
            if (gamesPlayedToday >= DAILY_LIMIT) {
                showToast("LIMIT ERREICHT! Komm morgen wieder. 🛑");
            }
        }

        function validate(betId, msgId) {
            if (gamesPlayedToday >= DAILY_LIMIT) {
                showToast("Limit erreicht! 🛑");
                return false;
            }

            const input = document.getElementById(betId);
            let amount = parseInt(input.value);
            const msg = document.getElementById(msgId);
            
            if (isNaN(amount) || amount <= 0) {
                msg.innerHTML = `<span class="lose-text">Mindestens 1 setzen!</span>`;
                return false;
            }
            if (amount > coins) {
                msg.innerHTML = `<span class="lose-text">Zu wenig Coins!</span>`;
                return false;
            }
            
            coins -= amount;
            // Wir zählen das Spiel erst als "gespielt", wenn der Einsatz erfolgreich abgezogen wurde
            trackGamePlayed(); 
            msg.innerHTML = "Einsatz platziert...";
            return amount;
        }

        function showToast(txt) {
            const toastEl = document.getElementById('toast');
            toastEl.innerText = txt;
            toastEl.style.transform = "translateY(0)";
            setTimeout(() => {
                toastEl.style.transform = "translateY(100px)";
            }, 4000);
        }

        // --- GAMES LOGIC ---

        function playRoulette(choice) {
            const bet = validate('bet-roulette', 'msg-roulette');
            if (!bet) return;
            
            const wheel = document.getElementById('r-wheel');
            const btns = document.querySelectorAll('.game-btn');
            btns.forEach(b => b.disabled = true);

            let deg = 1800 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${deg}deg)`;
            
            setTimeout(() => {
                const win = Math.random() < 0.48; 
                if (win) {
                    const gain = bet * 2;
                    coins += gain;
                    document.getElementById('msg-roulette').innerHTML = `<span class="win-text">Gewonnen! +${gain}</span>`;
                } else {
                    document.getElementById('msg-roulette').innerHTML = `<span class="lose-text">Verloren.</span>`;
                }
                updateUI();
            }, 4000);
        }

        function playSlots() {
            const bet = validate('bet-slots', 'msg-slots');
            if (!bet) return;

            const syms = ['🍒', '🍋', '🍇', '💎', '7️⃣'];
            const btn = document.getElementById('btn-slots');
            btn.classList.add('animating');
            btn.disabled = true;
            
            const reels = ['s1', 's2', 's3'];
            reels.forEach(id => document.getElementById(id).classList.add('spinning'));

            setTimeout(() => {
                const results = [
                    syms[Math.floor(Math.random()*5)],
                    syms[Math.floor(Math.random()*5)],
                    syms[Math.floor(Math.random()*5)]
                ];
                
                reels.forEach((id, i) => {
                    setTimeout(() => {
                        const el = document.getElementById(id);
                        el.classList.remove('spinning');
                        el.innerText = results[i];
                        
                        if (i === 2) { // Letzte Rolle fertig
                            if (results[0] === results[1] && results[1] === results[2]) {
                                const payout = results[0] === '7️⃣' ? 20 : 10;
                                coins += bet * payout;
                                document.getElementById('msg-slots').innerHTML = `<span class="win-text">JACKPOT! +${bet*payout}</span>`;
                            } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
                                coins += bet * 2;
                                document.getElementById('msg-slots').innerHTML = `<span class="win-text">Duo! +${bet*2}</span>`;
                            } else {
                                document.getElementById('msg-slots').innerHTML = `<span class="lose-text">Leider nichts.</span>`;
                            }
                            btn.classList.remove('animating');
                            updateUI();
                        }
                    }, i * 400);
                });
            }, 1000);
        }

        function playCoin(choice) {
            const bet = validate('bet-coin', 'msg-coin');
            if (!bet) return;

            const visual = document.getElementById('c-visual');
            visual.classList.add('flipping');
            
            setTimeout(() => {
                visual.classList.remove('flipping');
                const isHeads = Math.random() < 0.5;
                const result = isHeads ? 'heads' : 'tails';
                visual.innerText = isHeads ? '🪙' : '⚖️';
                
                if (choice === result) {
                    coins += bet * 2;
                    document.getElementById('msg-coin').innerHTML = `<span class="win-text">Korrekt! +${bet*2}</span>`;
                } else {
                    document.getElementById('msg-coin').innerHTML = `<span class="lose-text">Falsche Seite!</span>`;
                }
                updateUI();
            }, 1200);
        }

        function playPlinko() {
            const bet = validate('bet-plinko', 'msg-plinko');
            if (!bet) return;

            const ball = document.getElementById('p-ball');
            ball.style.display = "block";
            ball.style.top = "10px";
            ball.style.left = "50%";
            
            let pos = 50;
            let step = 0;
            let anim = setInterval(() => {
                step++;
                pos += (Math.random() - 0.5) * 20;
                ball.style.left = Math.max(10, Math.min(90, pos)) + "%";
                ball.style.top = (10 + step * 12) + "px";

                if (step >= 10) {
                    clearInterval(anim);
                    ball.style.display = "none";
                    let mult = 0.5;
                    if (pos < 25 || pos > 75) mult = 3;
                    else if (pos > 40 && pos < 60) mult = 2;
                    
                    const win = Math.floor(bet * mult);
                    coins += win;
                    document.getElementById('msg-plinko').innerHTML = mult >= 1 ? `<span class="win-text">Gewinn: ${win}</span>` : `<span class="lose-text">Trostpreis: ${win}</span>`;
                    updateUI();
                }
            }, 100);
        }

        function playDice() {
            const bet = validate('bet-dice', 'msg-dice');
            if (!bet) return;

            const v = document.getElementById('d-visual');
            const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            let count = 0;
            let roll = setInterval(() => {
                v.innerText = faces[Math.floor(Math.random()*6)];
                count++;
                if (count > 10) {
                    clearInterval(roll);
                    const res = Math.floor(Math.random()*6) + 1;
                    v.innerText = faces[res-1];
                    if (res >= 4) {
                        coins += bet * 2;
                        document.getElementById('msg-dice').innerHTML = `<span class="win-text">Sieg! +${bet*2}</span>`;
                    } else {
                        document.getElementById('msg-dice').innerHTML = `<span class="lose-text">Niederlage.</span>`;
                    }
                    updateUI();
                }
            }, 100);
        }

        function playMines(idx) {
            const bet = validate('bet-mines', 'msg-mines');
            if (!bet) return;

            const bomb = Math.floor(Math.random()*2);
            if (idx === bomb) {
                document.getElementById('msg-mines').innerHTML = `<span class="lose-text">BOOM! Mine getroffen.</span>`;
            } else {
                coins += bet * 2;
                document.getElementById('msg-mines').innerHTML = `<span class="win-text">Sicher! +${bet*2}</span>`;
            }
            updateUI();
        }
    </script>
</body>
</html>
