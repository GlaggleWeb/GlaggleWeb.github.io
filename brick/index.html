<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Brick Breaker</title>
    <style>
        :root {
            --bg-color: #0b2d41;
            --text-color: #ffffff;
            --nav-bg: #1a4b66;
            --card-bg: #1a4b66;
            --card-border: #2E94D1;
            --accent: #70C4F7;
            --danger: #FF6B6B;
            --coin-gold: #FFD700;
            --paddle-color: #70C4F7;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .nav-logo { height: 35px; }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 450px; 
            background: linear-gradient(to bottom, #1a4b66, #0b2d41);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px);
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #2E94D1; margin-bottom: 10px;
            width: 220px;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #2E94D1; }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent);
            box-shadow: none;
        }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .coin-img { width: 24px; height: 24px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.3s ease-in-out; }

        @media (max-width: 600px) {
            #game-container { cursor: default; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/" style="text-decoration: none;"><img src="glagglelogo.png" class="nav-logo" alt="Logo" onerror="this.style.display='none'"></a>
        <div style="color: var(--accent); font-weight: bold;">Glaggle Brick EXTREME</div>
        <div style="font-size: 24px;">💀</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Punkte <b id="score">0</b></div>
            <div class="score-val">Rekord <b id="highscore">0</b></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">🧱 Glaggle Brick</h1>
                <p id="sub-msg" style="margin-bottom: 20px; font-size: 14px; opacity: 0.8;">EXTREME MODUS: Kleineres Paddle,<br>mehr Speed, keine Gnade!</p>
                
                <button class="btn" onclick="startGame()">Starten</button>
                
                <a href="https://glaggle.ch/gamecenter" class="btn btn-secondary">
                    Mehr Spiele 🏠
                </a>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="coin.png" class="coin-img" alt="C" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu-overlay');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const container = document.getElementById('game-container');

        // Game Constants (Schwierigkeit massiv erhöht)
        const PADDLE_HEIGHT = 10;
        const PADDLE_WIDTH = 60; // Deutlich schmaler (vorher 75)
        const BALL_RADIUS = 6.5;
        const BRICK_ROWS = 7; // Mehr Reihen
        const BRICK_COLS = 9; // Mehr Spalten
        const BRICK_PADDING = 5;
        const BRICK_OFFSET_TOP = 45;
        const BRICK_OFFSET_LEFT = 10;

        // Game State
        let gameRunning = false;
        let score = 0;
        let storageKey = 'glagglebrick_highscore';
        let highscore = localStorage.getItem(storageKey) || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;

        let paddleX = (canvas.width - PADDLE_WIDTH) / 2;
        let ballX, ballY, ballDX, ballDY;
        let bricks = [];

        highscoreEl.innerText = highscore;
        coinEl.innerText = coins;

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            paddleX = (canvas.width - PADDLE_WIDTH) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Controls
        const updatePaddle = (clientX) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            paddleX = mouseX - PADDLE_WIDTH / 2;
            
            if(paddleX < 0) paddleX = 0;
            if(paddleX + PADDLE_WIDTH > canvas.width) paddleX = canvas.width - PADDLE_WIDTH;
        };

        container.addEventListener('mousemove', (e) => {
            if(gameRunning) updatePaddle(e.clientX);
        });

        container.addEventListener('touchmove', (e) => {
            if(gameRunning) {
                e.preventDefault();
                updatePaddle(e.touches[0].clientX);
            }
        }, {passive: false});

        function initBricks() {
            const brickWidth = (canvas.width - (BRICK_OFFSET_LEFT * 2) - (BRICK_COLS - 1) * BRICK_PADDING) / BRICK_COLS;
            bricks = [];
            for(let c = 0; c < BRICK_COLS; c++) {
                bricks[c] = [];
                for(let r = 0; r < BRICK_ROWS; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, 
                        color: `hsl(${190 + r * 15}, 80%, ${45 + r * 5}%)` 
                    };
                }
            }
        }

        function startGame() {
            score = 0;
            scoreEl.innerText = "0";
            ballX = canvas.width / 2;
            ballY = canvas.height - 70;
            // Aggressiver Startspeed (vorher 4)
            ballDX = 5 * (Math.random() > 0.5 ? 1 : -1);
            ballDY = -5;
            initBricks();
            gameRunning = true;
            menu.style.display = "none";
            requestAnimationFrame(draw);
        }

        function collisionDetection() {
            const brickWidth = (canvas.width - (BRICK_OFFSET_LEFT * 2) - (BRICK_COLS - 1) * BRICK_PADDING) / BRICK_COLS;
            const brickHeight = 16;
            for(let c = 0; c < BRICK_COLS; c++) {
                for(let r = 0; r < BRICK_ROWS; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1) {
                        if(ballX > b.x && ballX < b.x + brickWidth && ballY > b.y && ballY < b.y + brickHeight) {
                            ballDY = -ballDY;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = score;
                            
                            // Aggressivere Beschleunigung (1.01 statt 1.005)
                            ballDX *= 1.01;
                            ballDY *= 1.01;

                            if(score === BRICK_ROWS * BRICK_COLS * 10) {
                                victory();
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.closePath();
            
            // Kleiner Glanzeffekt
            ctx.beginPath();
            ctx.arc(ballX - 2, ballY - 2, 2, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            const py = canvas.height - PADDLE_HEIGHT - 15;
            if(ctx.roundRect) {
                ctx.roundRect(paddleX, py, PADDLE_WIDTH, PADDLE_HEIGHT, 5);
            } else {
                ctx.rect(paddleX, py, PADDLE_WIDTH, PADDLE_HEIGHT);
            }
            ctx.fillStyle = "#70C4F7";
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();
        }

        function drawBricks() {
            const brickWidth = (canvas.width - (BRICK_OFFSET_LEFT * 2) - (BRICK_COLS - 1) * BRICK_PADDING) / BRICK_COLS;
            const brickHeight = 16;
            for(let c = 0; c < BRICK_COLS; c++) {
                for(let r = 0; r < BRICK_ROWS; r++) {
                    if(bricks[c][r].status === 1) {
                        let brickX = (c * (brickWidth + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                        let brickY = (r * (brickHeight + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        if(ctx.roundRect) {
                            ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 3);
                        } else {
                            ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        }
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            if(!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Wall collision
            if(ballX + ballDX > canvas.width - BALL_RADIUS || ballX + ballDX < BALL_RADIUS) {
                ballDX = -ballDX;
            }
            if(ballY + ballDY < BALL_RADIUS) {
                ballDY = -ballDY;
            } else if(ballY + ballDY > canvas.height - BALL_RADIUS - 15) {
                if(ballX > paddleX && ballX < paddleX + PADDLE_WIDTH) {
                    // Extreme Bounce: Je weiter außen getroffen, desto steiler der Winkel
                    let hitPos = (ballX - (paddleX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
                    ballDX = hitPos * 7; 
                    ballDY = -Math.abs(ballDY);
                } else if(ballY + ballDY > canvas.height) {
                    gameOver();
                    return;
                }
            }

            ballX += ballDX;
            ballY += ballDY;
            requestAnimationFrame(draw);
        }

        function victory() {
            gameRunning = false;
            saveStats();
            document.getElementById('msg').innerText = "🏆 LEGENDÄR!";
            document.getElementById('sub-msg').innerText = "Du hast das unlösbare Feld geräumt.";
            menu.style.display = "flex";
        }

        function gameOver() {
            gameRunning = false;
            saveStats();
            document.getElementById('msg').innerText = "💥 ZERSCHELLT!";
            document.getElementById('sub-msg').innerText = "Score: " + score;
            menu.style.display = "flex";
        }

       function saveStats() {
    // Highscore speichern
    if(score > highscore) {
        highscore = score;
        localStorage.setItem(storageKey, highscore);
        highscoreEl.innerText = highscore;
    }

    // --- COIN LOGIK ---
    // Wir berechnen die Coins basierend auf 100 Punkten
    let earnedCoins = Math.floor(score / 100); 

    if(earnedCoins > 0) {
        // Aktuellen Stand aus dem Speicher holen (0 als Fallback)
        let totalCoins = parseInt(localStorage.getItem('glaggleCoins')) || 0;
        
        // Addiere die neuen Coins zum Gesamtkonto
        totalCoins += earnedCoins;
        
        // Im LocalStorage speichern
        localStorage.setItem('glaggleCoins', totalCoins);
        
        // UI Update: Die Anzeige im Spiel aktualisieren
        coinEl.innerText = totalCoins;
        
        // Kleiner Animationseffekt
        const display = document.getElementById('coin-display');
        display.classList.add('pulse');
        setTimeout(() => display.classList.remove('pulse'), 300);
    }
}
    </script>
</body>
</html>
