<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Catcher</title>
    <style>
        :root {
            --bg-color: #1a0b2e; /* Dunkles Lila/Nacht-Theme */
            --text-color: #ffffff;
            --nav-bg: #2a1b41;
            --card-bg: #2a1b41;
            --card-border: #9d4edd;
            --accent: #ff9e00; /* Leuchtendes Orange */
            --danger: #FF6B6B;
            --coin-gold: #FFD700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .nav-logo { height: 35px; }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 450px; 
            background: linear-gradient(to bottom, #2a1b41, #1a0b2e);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px);
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #cc7a00; margin-bottom: 10px;
            width: 200px;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #cc7a00; }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent);
            box-shadow: none;
        }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .coin-img { width: 24px; height: 24px; object-fit: contain; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); border-color: #FFD700; }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/" style="text-decoration: none;"><img src="glagglelogo.png" class="nav-logo" alt="Logo" onerror="this.style.display='none'"></a>
        <div style="color: var(--accent); font-weight: bold;">Glaggle Catcher</div>
        <div style="font-size: 24px;">🧺</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Punkte <b id="score">0</b></div>
            <div class="score-val">Rekord <b id="highscore">0</b></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">🧺 Fang sie alle!</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.8; text-align: center;">
                    Bewege den Korb (wischen/Maus).<br>
                    Fang die Smileys 😊<br>
                    Meide die Bomben 💣
                </p>
                
                <button class="btn" onclick="startGame(event)">Starten</button>
                
                <a href="https://glaggle.ch/gamecenter" class="btn btn-secondary">
                    Game Center 🏠
                </a>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="coin.png" class="coin-img" alt="Coin" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <button id="music-toggle" onclick="toggleMusic(event)" style="position: fixed; bottom: 20px; left: 20px; background: var(--nav-bg); border: 2px solid var(--accent); color: white; padding: 10px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; font-size: 20px;">
    🔈
    </button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu-overlay');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const container = document.getElementById('game-container');

        let gameRunning = false;
        let score = 0;
        let highscore = localStorage.getItem('glagglecatcher_highscore') || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;

        highscoreEl.innerText = highscore;
        coinEl.innerText = coins;

        // --- MUSIK SETUP ---
        // Ein Arcade-artiger Track
        const bgMusic = new Audio('https://res.cloudinary.com/dcvdvvbnj/video/upload/psychronic-let-the-games-begin-21858_h6qxo1.mp3'); 
        bgMusic.loop = true;
        bgMusic.volume = 0.3; 

        let musicEnabled = false;

        function toggleMusic(e) {
            if(e) e.stopPropagation();
            const btn = document.getElementById('music-toggle');
            
            if (!bgMusic.paused) {
                bgMusic.pause();
                btn.innerText = "🔈";
                musicEnabled = false;
            } else {
                bgMusic.play().catch(err => console.log("Klick nötig"));
                btn.innerText = "🔊";
                musicEnabled = true;
            }
        }

        // --- SPIEL VARIABLEN ---
        const player = {
            width: 70, height: 25, x: 0, y: 0, color: '#9d4edd',
            baseWidth: 70
        };
        
        let items = [];
        let particles = [];
        let gameSpeed = 4;
        let spawnRate = 60; // Frames between spawns
        let frameCount = 0;

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            player.y = canvas.height - player.height - 20;
            if(player.x === 0) player.x = canvas.width / 2 - player.width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- STEUERUNG ---
        function updatePlayerPos(clientX) {
            const rect = canvas.getBoundingClientRect();
            let newX = clientX - rect.left - (player.width / 2);
            // Begrenzungen
            if (newX < 0) newX = 0;
            if (newX + player.width > canvas.width) newX = canvas.width - player.width;
            player.x = newX;
        }

        container.addEventListener('mousemove', (e) => {
            if(!gameRunning) return;
            updatePlayerPos(e.clientX);
        });

        container.addEventListener('touchmove', (e) => { 
            if(!gameRunning) return;
            e.preventDefault(); 
            updatePlayerPos(e.touches[0].clientX); 
        }, {passive: false});

        function startGame(e) {
    if(e) e.stopPropagation();
    
    // --- MUSIK-START LOGIK ---
    // Da der User gerade geklickt hat, erlaubt der Browser nun Audio.
    bgMusic.play().then(() => {
        musicEnabled = true;
        document.getElementById('music-toggle').innerText = "🔊";
    }).catch(err => {
        console.log("Audio konnte noch nicht starten:", err);
    });

    // --- DEINE BESTEHENDE GAME-LOGIK ---
    score = 0;
    gameSpeed = 4;
    spawnRate = 60;
    player.width = player.baseWidth;
    items = [];
    particles = [];
    scoreEl.innerText = "0";
    gameRunning = true;
    menu.style.display = "none";
    frameCount = 0;
    
    // Spieler zentrieren
    player.x = canvas.width / 2 - player.width / 2;
    
    requestAnimationFrame(gameLoop);
}

        function spawnItem() {
            const radius = 15;
            const x = Math.random() * (canvas.width - radius * 2) + radius;
            // 30% Chance auf Bombe (wird schneller schwerer)
            const isBomb = Math.random() < 0.3 + (score * 0.015); 
            
            items.push({
                x: x, y: -radius, radius: radius, 
                type: isBomb ? 'bomb' : 'glaggle',
                speedOffset: Math.random() * 2.5
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1, color: color
                });
            }
        }

        function gameLoop() {
            if(!gameRunning) return;

            // Spawn Logic
            if(frameCount % Math.floor(spawnRate) === 0) spawnItem();

            // Schwierigkeit erhöhen (schneller und aggressiver)
            if(frameCount % 150 === 0 && spawnRate > 15) {
                spawnRate -= 4;
                gameSpeed += 0.4;
                // Korb schrumpft minimal, um es schwerer zu machen
                if (player.width > 40) player.width -= 1.5;
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += gameSpeed + item.speedOffset;

                // Kollision mit Spieler (AABB für Einfachheit)
                let testX = item.x;
                let testY = item.y;
                if (item.x < player.x) testX = player.x; 
                else if (item.x > player.x + player.width) testX = player.x + player.width;
                if (item.y < player.y) testY = player.y; 
                else if (item.y > player.y + player.height) testY = player.y + player.height;

                let distX = item.x - testX;
                let distY = item.y - testY;
                let distance = Math.sqrt((distX*distX) + (distY*distY));

                if (distance <= item.radius) {
                    // Getroffen!
                    if (item.type === 'glaggle') {
                        score++;
                        scoreEl.innerText = score;
                        createParticles(item.x, item.y, '#FFD700');
                        items.splice(i, 1);
                        
                        // Coin System (alle 15 Punkte 1 Coin)
                        if (score > 0 && score % 15 === 0) {
                            coins++;
                            localStorage.setItem('glaggleCoins', coins);
                            coinEl.innerText = coins;
                            document.getElementById('coin-display').classList.add('pulse');
                            setTimeout(() => document.getElementById('coin-display').classList.remove('pulse'), 500);
                        }
                    } else if (item.type === 'bomb') {
                        gameOver("Du hast eine Bombe gefangen!");
                        return;
                    }
                    continue;
                }

                // Aus dem Bildschirm gefallen
                if (item.y - item.radius > canvas.height) {
                    if (item.type === 'glaggle') {
                        gameOver("Du hast ein Glaggle verpasst!");
                        return;
                    } else {
                        // Bombe sicher verfehlt
                        items.splice(i, 1);
                    }
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            draw();
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sternen/Hintergrund-Effekt (optional)
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            ctx.beginPath();
            ctx.arc((frameCount*0.5) % canvas.width, (frameCount) % canvas.height, 2, 0, Math.PI*2);
            ctx.fill();

            // Spieler (Korb) zeichnen
            ctx.fillStyle = player.color;
            if(ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(player.x, player.y, player.width, player.height, [5, 5, 15, 15]);
                ctx.fill();
            } else {
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
            // Korb-Detail
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, player.height - 10);

            // Items zeichnen
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                
                if (item.type === 'glaggle') {
                    // Glaggle Face
                    ctx.fillStyle = "#FFD700";
                    ctx.beginPath();
                    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // Augen
                    ctx.fillStyle = "#000"; 
                    ctx.beginPath(); ctx.arc(-5, -4, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(5, -4, 2, 0, Math.PI * 2); ctx.fill();
                    // Mund
                    ctx.beginPath(); ctx.arc(0, 2, 6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
                } else {
                    // Bombe
                    ctx.fillStyle = "#333";
                    ctx.beginPath();
                    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                    ctx.fill();
                    // Glanz
                    ctx.fillStyle = "rgba(255,255,255,0.4)";
                    ctx.beginPath();
                    ctx.arc(-4, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Zündschnur
                    ctx.strokeStyle = "#888";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -item.radius);
                    ctx.lineTo(5, -item.radius - 6);
                    ctx.stroke();
                    // Funke
                    if (frameCount % 10 < 5) {
                        ctx.fillStyle = "#FF6B6B";
                        ctx.beginPath(); ctx.arc(6, -item.radius - 7, 3, 0, Math.PI*2); ctx.fill();
                    }
                }
                ctx.restore();
            });

            // Particles zeichnen
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function gameOver(reason) {
            gameRunning = false;
            
            const storageKey = 'glagglecatcher_highscore'; 
            let currentHighscore = parseInt(localStorage.getItem(storageKey)) || 0;

            let msg = reason + "<br>";
            if(score > currentHighscore) {
                localStorage.setItem(storageKey, score);
                highscoreEl.innerText = score;
                msg += "🏆 Neuer Rekord: " + score;
            } else {
                msg += "Punkte: " + score;
            }
            
            document.getElementById('msg').innerHTML = msg;
            menu.style.display = "flex";
            
            // Kamera-Wackler bei Tod (CSS Animation)
            container.style.transform = "translateX(5px)";
            setTimeout(() => container.style.transform = "translateX(-5px)", 50);
            setTimeout(() => container.style.transform = "translateX(5px)", 100);
            setTimeout(() => container.style.transform = "translateX(0)", 150);
            draw();
        }
    </script>
</body>
</html>
