name: KI Wissens-Crawler

on:
  schedule:
    - cron: '0 6 * * *' # Läuft täglich um 06:00 Uhr UTC
  workflow_dispatch:    # Ermöglicht den manuellen Start über den GitHub-Tab "Actions"

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt das Schreiben in das Repo (falls nötig)

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests huggingface_hub

      - name: Crawler ausführen
        env:
          # Hier wird das Secret, das du in GitHub angelegt hast, an das Skript übergeben
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python crawlergn.py
