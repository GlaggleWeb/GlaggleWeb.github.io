<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle - Passwort zurücksetzen</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        :root {
            --bg-color: #ffffff; --text-color: #333333; --card-bg: #fdfdfd;
            --card-border: #eeeeee; --accent: #70C4F7;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #202124; --text-color: #e8eaed; --card-bg: #303134; --card-border: #444444; }
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--card-border); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--card-border); box-sizing: border-box; background: var(--bg-color); color: var(--text-color); }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h1>Neues Passwort</h1>
    <p id="status-msg">Wähle ein sicheres neues Passwort für deinen Glaggle Account.</p>
    
    <div id="reset-form">
        <input type="password" id="new-password" placeholder="Neues Passwort (min. 8 Zeichen)">
        <input type="password" id="confirm-password" placeholder="Passwort wiederholen">
        <button onclick="executeReset()">Passwort speichern</button>
    </div>
</div>

<script>
const client = new Appwrite.Client()
    .setEndpoint('https://cloud.appwrite.io/v1')
    .setProject('69fb638a002b7d03d829');

const account = new Appwrite.Account(client);

// URL Parameter holen
const urlParams = new URLSearchParams(window.location.search);
const userId = urlParams.get('userId');
const secret = urlParams.get('secret');

async function executeReset() {
    const pass = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;

    if (pass.length < 8) return alert("Das Passwort muss mindestens 8 Zeichen lang sein.");
    if (pass !== confirm) return alert("Die Passwörter stimmen nicht überein!");

    try {
        // Die entscheidende Appwrite Funktion
        await account.updateRecovery(userId, secret, pass, confirm);
        
        document.getElementById('status-msg').innerText = "Erfolgreich! Dein Passwort wurde geändert. Du kannst dich jetzt einloggen.";
        document.getElementById('reset-form').style.display = 'none';
        
        // Nach 3 Sekunden zum Login leiten
        setTimeout(() => {
            window.location.href = "../login/index.html";
        }, 3000);

    } catch (error) {
        console.error(error);
        alert("Fehler: " + error.message);
    }
}

// Check ob die URL überhaupt gültig ist
window.onload = () => {
    if (!userId || !secret) {
        document.getElementById('status-msg').innerText = "Ungültiger Link. Bitte fordere einen neuen Passwort-Reset-Link an.";
        document.getElementById('reset-form').style.display = 'none';
    }
};
</script>

</body>
</html>
