<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Account - Übersicht</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333333;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e0e0e0;
            --link-color: #2E94D1;
            --desc-color: #65676b;
            --accent: #70C4F7;
            --accent-dark: #2E94D1;
            --danger: #ff4d4f;
            --success: #52c41a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #18191a;
                --text-color: #e4e6eb;
                --nav-bg: #242526;
                --card-bg: #242526;
                --card-border: #3e4042;
                --link-color: #8cc9f5;
                --desc-color: #b0b3b8;
            }
        }

        body { 
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo { width: 140px; margin-bottom: 10px; }

        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 24px; 
            border: 1px solid var(--card-border); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 { font-size: 1.6rem; margin: 0; color: var(--text-color); }
        h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 15px; color: var(--link-color); display: flex; align-items: center; gap: 8px; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .info-label { font-size: 0.85rem; color: var(--desc-color); }
        .info-value { font-weight: bold; font-size: 1rem; color: var(--accent-dark); }

        label { 
            display: block; 
            font-size: 0.85rem; 
            margin-bottom: 5px; 
            margin-left: 5px;
            color: var(--desc-color);
        }

        input { 
            width: 100%; 
            padding: 12px 15px; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--card-border); 
            background: var(--bg-color); 
            color: var(--text-color); 
            box-sizing: border-box; 
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--accent); }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }

        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.95rem; 
            transition: all 0.2s ease;
        }

        button:hover { background: var(--accent-dark); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .btn-secondary { background: transparent; color: var(--accent-dark); border: 2px solid var(--accent); }
        .btn-secondary:hover { background: var(--accent); color: white; }

        .btn-danger { background: transparent; color: var(--danger); border: 2px solid var(--danger); margin-top: 10px; }
        .btn-danger:hover { background: var(--danger); color: white; }

        .info-text { font-size: 0.8rem; color: var(--desc-color); line-height: 1.4; margin-top: -5px; margin-bottom: 15px; }

        #status-message {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: bold;
            line-height: 1.4;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.5s;
        }

        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--card-border);
            border-top: 4px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<div class="container">
    <div class="header">
        <img src="../glagglelogo.png" alt="Glaggle Logo" class="logo" onerror="this.style.display='none'">
        <h1>Account Übersicht</h1>
    </div>

    <div id="status-message"></div>

    <!-- Profil Card -->
    <div class="card">
        <h2>👤 Profil</h2>
        
        <label for="edit-username">Benutzername</label>
        <input type="text" id="edit-username" placeholder="Lade...">
        
        <label for="edit-gamecenter">Gamecenter Name (optional)</label>
        <input type="text" id="edit-gamecenter" placeholder="Nicht festgelegt">
        
        <button onclick="updateProfile()">Änderungen speichern</button>
    </div>

    <!-- Sicherheit & E-Mail -->
    <div class="card">
        <h2>🔒 E-Mail Einstellungen</h2>
        
        <div class="info-row">
            <span class="info-label">E-Mail</span>
            <span class="info-value" id="display-email">Lade...</span>
        </div>

        <div class="btn-group">
            <label for="new-email">Neue E-Mail Adresse</label>
            <input type="email" id="new-email" placeholder="beispiel@mail.de">
            <button class="btn-secondary" onclick="updateEmail()">E-Mail Adresse aktualisieren</button>
            <p class="info-text">Du musst die neue Adresse bestätigen, bevor sie aktiv wird.</p>
        </div>
    </div>

    <button class="btn-danger" onclick="navigateTo('../../index.html')">Zurück zur Suche</button>
</div>

<script>
// --- APPWRITE SETUP ---
const client = new Appwrite.Client()
    .setEndpoint('https://cloud.appwrite.io/v1')
    .setProject('69fb638a002b7d03d829');

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DB_ID = '69fb65330007c1a1af0a';
const COLL_ID = 'accounts';
let userDocId = "";

// Safe navigation helper for iFrames and environments without standard base URLs
function navigateTo(path) {
    try {
        const base = (document.baseURI && document.baseURI !== 'about:blank') ? document.baseURI : window.location.href;
        window.location.href = new URL(path, base).href;
    } catch (err) {
        console.warn("Standard navigation warning, falling back:", err);
        try {
            window.location.assign(path);
        } catch (e2) {
            console.error("Navigation error:", e2);
        }
    }
}

function showStatus(text, isError = false) {
    const msg = document.getElementById('status-message');
    msg.style.display = 'block';
    msg.innerText = text;
    if (isError) {
        msg.style.background = '#ffebee';
        msg.style.color = '#c62828';
        msg.style.border = '1px solid #ffcdd2';
    } else {
        msg.style.background = '#e8f5e9';
        msg.style.color = '#2e7d32';
        msg.style.border = '1px solid #c8e6c9';
    }
    setTimeout(() => {
        msg.style.display = 'none';
    }, 5000);
}

window.onload = async () => {
    try {
        const user = await account.get();
        document.getElementById('display-email').innerText = user.email;
        document.getElementById('edit-username').value = user.name || "";

        // Suche Dokument mit Query
        const response = await databases.listDocuments(DB_ID, COLL_ID, [
            Appwrite.Query.equal('userEmail', user.email)
        ]);

        if (response.documents.length > 0) {
            const doc = response.documents[0];
            userDocId = doc.$id;
            document.getElementById('edit-gamecenter').value = doc.gamecenterName || "";
        } else {
            console.warn("Kein Datenbank-Eintrag für diesen User gefunden.");
        }
    } catch (e) {
        console.error("Appwrite error:", e);
        // Direct to login only if unauthorized (401), otherwise show fetch error message
        if (e.code === 401 || e.type === 'user_unauthorized') {
            showStatus("Nicht angemeldet. Leite weiter zum Login...", true);
            setTimeout(() => navigateTo("../login/index.html"), 1500);
        } else {
            showStatus("Verbindungsfehler zu Appwrite: " + (e.message || "Failed to fetch") + ". Bitte Hostname/CORS in Appwrite prüfen.", true);
        }
    } finally {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
        }
    }
};

async function updateProfile() {
    const newName = document.getElementById('edit-username').value.trim();
    const newGameName = document.getElementById('edit-gamecenter').value.trim();
    
    if (newName.length < 3) return showStatus("Der Name muss mindestens 3 Zeichen haben!", true);

    try {
        // 1. Appwrite Account Name
        await account.updateName(newName);
        
        // 2. Datenbank Update
        if (userDocId) {
            await databases.updateDocument(DB_ID, COLL_ID, userDocId, {
                userName: newName,
                gamecenterName: newGameName
            });
            showStatus("Profil erfolgreich aktualisiert! 🎉", false);
        } else {
            showStatus("Fehler: Datenbank-Profil nicht gefunden.", true);
        }
    } catch (e) { 
        showStatus("Fehler: " + e.message, true); 
    }
}

async function updateEmail() {
    const newEmail = document.getElementById('new-email').value.trim();
    if (!newEmail.includes('@')) return showStatus("Bitte gib eine gültige E-Mail ein.", true);

    try {
        // Bei passwortlosen Konten wird ein leeres Passwort übergeben
        await account.updateEmail(newEmail, '');
        showStatus("Bestätigungs-Link an " + newEmail + " gesendet! Bitte klicke auf den Link in der E-Mail.", false);
        
        setTimeout(async () => {
            try { await account.deleteSession('current'); } catch(e) {}
            navigateTo("../login/index.html");
        }, 3000);
    } catch (e) {
        showStatus("Fehler beim Aktualisieren der E-Mail: " + e.message, true);
    }
}
</script>

</body>
</html>
