<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle - Account Übersicht</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        /* Nutze dein bestehendes Root-Design */
        :root {
            --bg-color: #ffffff; --text-color: #333333; --card-bg: #fdfdfd;
            --card-border: #eeeeee; --accent: #70C4F7; --desc-color: #555555;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #202124; --text-color: #e8eaed; --card-bg: #303134; --card-border: #444444; }
        }

        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--card-border); }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
        h2 { color: var(--accent); font-size: 1.2rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .danger-btn { background: #ff4d4d; margin-top: 10px; }
        .info-text { font-size: 0.85rem; color: var(--desc-color); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Account Übersicht</h1>
    
    <!-- Profil Info -->
    <div class="section">
        <h2>Profil anpassen</h2>
        <p class="info-text">Deine GlaggleID: <strong id="display-id">...</strong></p>
        <label>Benutzername</label>
        <input type="text" id="edit-username" placeholder="Benutzername">
        <label>Gamecenter Name</label>
        <input type="text" id="edit-gamecenter" placeholder="Gamecenter Name">
        <button onclick="updateProfile()">Namen speichern</button>
    </div>

    <!-- Passwort ändern -->
    <div class="section">
        <h2>Sicherheit</h2>
        <p class="info-text">Klicke auf den Button, um einen Link zum Zurücksetzen des Passworts an deine E-Mail zu erhalten.</p>
        <button onclick="sendPasswordReset()">Passwort via E-Mail ändern</button>
    </div>

    <!-- E-Mail ändern -->
    <div class="section">
        <h2>E-Mail Adresse</h2>
        <p class="info-text">Aktuell: <span id="display-email">...</span></p>
        <input type="email" id="new-email" placeholder="Neue E-Mail Adresse">
        <button onclick="updateEmail()">Neue E-Mail bestätigen & festlegen</button>
    </div>

    <button class="danger-btn" onclick="window.location.href='../../index.html'">Zurück zur Suche</button>
</div>

<script>
const client = new Appwrite.Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('69fb638a002b7d03d829');
const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DB_ID = '69fb65330007c1a1af0a';
const COLL_ID = 'accounts';
let userDocId = "";

// Daten beim Laden abrufen
window.onload = async () => {
    try {
        const user = await account.get();
        document.getElementById('display-email').innerText = user.email;
        document.getElementById('edit-username').value = user.name;

        // Datenbank-Dokument suchen für Gamecenter & GlaggleID
        const response = await databases.listDocuments(DB_ID, COLL_ID, [
            Appwrite.Query.equal('userEmail', user.email)
        ]);

        if (response.documents.length > 0) {
            const doc = response.documents[0];
            userDocId = doc.$id;
            document.getElementById('display-id').innerText = doc.glaggleId;
            document.getElementById('edit-gamecenter').value = doc.gamecenterName || "";
        }
    } catch (e) {
        alert("Bitte logge dich zuerst ein.");
        window.location.href = "../login/index.html";
    }
};

// 1. Benutzernamen & Gamecenter aktualisieren
async function updateProfile() {
    const newName = document.getElementById('edit-username').value;
    const newGameName = document.getElementById('edit-gamecenter').value;
    
    try {
        await account.updateName(newName);
        await databases.updateDocument(DB_ID, COLL_ID, userDocId, {
            userName: newName,
            gamecenterName: newGameName
        });
        alert("Profil aktualisiert!");
    } catch (e) { alert("Fehler: " + e.message); }
}

// 2. Passwort Reset (Magic URL Style)
async function sendPasswordReset() {
    try {
        const user = await account.get();
        // Sendet eine E-Mail zum Zurücksetzen
        await account.createRecovery(user.email, window.location.origin + "/account/overview/reset-password.html");
        alert("Eine E-Mail zum Zurücksetzen des Passworts wurde versendet!");
    } catch (e) { alert(e.message); }
}

// 3. E-Mail ändern (Erfordert Verifizierung)
async function updateEmail() {
    const newEmail = document.getElementById('new-email').value;
    if(!newEmail.includes('@')) return alert("Ungültige E-Mail");

    try {
        // Appwrite verlangt das aktuelle Passwort zur E-Mail Änderung!
        const pass = prompt("Bitte gib dein aktuelles Passwort zur Bestätigung ein:");
        if(!pass) return;

        await account.updateEmail(newEmail, pass);
        
        // Update in der Datenbank
        await databases.updateDocument(DB_ID, COLL_ID, userDocId, {
            userEmail: newEmail
        });
        
        alert("E-Mail wurde geändert! Bitte logge dich ggf. neu ein.");
        location.reload();
    } catch (e) { alert("Fehler: " + e.message); }
}
</script>
</body>
</html>
