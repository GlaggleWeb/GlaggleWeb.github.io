<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaggle Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #0f0f0f; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid #333; 
            width: 350px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #e91e63; }
        p { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #252525; 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { border-color: #e91e63; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #e91e63; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            transition: background 0.3s;
        }
        button:hover { background: #c2185b; }
        button:disabled { background: #555; cursor: not-allowed; }

        #result { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 10px; 
            display: none; 
            background: #2ecc71; 
            color: white;
        }
        .loading-spinner {
            display: none;
            margin: 10px auto;
            border: 3px solid #333;
            border-top: 3px solid #e91e63;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h1>GlaggleID</h1>

    <div id="step1">
        <p>Gib deine E-Mail ein, um einen Bestätigungslink zu erhalten.</p>
        <input type="email" id="email" placeholder="E-Mail Adresse">
        <button id="btnStep1" onclick="sendMagicLink()">Link anfordern</button>
    </div>

    <div id="step2" style="display: none;">
        <p>E-Mail bestätigt! Wähle nun deinen Namen und ein Passwort.</p>
        <input type="text" id="gamecenterName" placeholder="Gamecenter Name">
        <input type="password" id="pass" placeholder="Passwort (mind. 8 Zeichen)">
        <button id="btnStep2" onclick="finishRegistration()">Konto erstellen</button>
    </div>

    <div class="loading-spinner" id="spinner"></div>

    <div id="result">
        <span>Erfolgreich! Deine GlaggleID:</span>
        <h2 id="idDisplay">000000</h2>
    </div>
</div>

<script>
// --- APPWRITE KONFIGURATION ---
const client = new Appwrite.Client()
    .setEndpoint('https://cloud.appwrite.io/v1')
    .setProject('69fb638a002b7d03d829'); 

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

// IDs deiner Datenbank und Collection
const DB_ID = '69fb65330007c1a1af0a';
const COLL_ID = 'accounts';

// PRÜFUNG: Kommt der User von einem Magic-Link?
window.onload = async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');

    if (userId && secret) {
        showLoading(true);
        try {
            // Verifiziert die Session
            await account.updateMagicURLSession(userId, secret);
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } catch (error) {
            alert("Der Link ist ungültig oder abgelaufen.");
        } finally {
            showLoading(false);
        }
    }
};

// FUNKTION: Magic Link senden
async function sendMagicLink() {
    const email = document.getElementById('email').value;
    if (!email.includes('@')) return alert("Bitte eine gültige E-Mail eingeben.");

    showLoading(true);
    try {
        // 'unique()' erstellt einen temporären User-Eintrag
        await account.createMagicURLSession('unique()', email, window.location.href);
        alert("E-Mail versendet! Bitte schaue in deinem Postfach nach.");
        document.getElementById('btnStep1').disabled = true;
        document.getElementById('btnStep1').innerText = "Link wurde gesendet...";
    } catch (error) {
        alert("Fehler: " + error.message);
    } finally {
        showLoading(false);
    }
}

// FUNKTION: Registrierung abschließen
async function finishRegistration() {
    const gameName = document.getElementById('gamecenterName').value;
    const password = document.getElementById('pass').value;

    if (gameName.length < 3) return alert("Name zu kurz.");
    if (password.length < 8) return alert("Passwort muss mind. 8 Zeichen haben.");

    showLoading(true);
    try {
        // 1. Passwort setzen (da Magic Link noch kein Passwort hat)
        await account.updatePassword(password);

        // 2. User-Daten abrufen (um Email zu bekommen)
        const user = await account.get();

        // 3. Glaggle ID generieren
        const glaggleId = Math.floor(100000 + Math.random() * 900000);

        // 4. Dokument in Datenbank speichern
        await databases.createDocument(
            DB_ID,
            COLL_ID,
            'unique()',
            {
                glaggleId: glaggleId,
                userEmail: user.email,
                gamecenterName: gameName
            }
        );

        // Erfolg anzeigen
        document.getElementById('step2').style.display = 'none';
        document.getElementById('idDisplay').innerText = glaggleId;
        document.getElementById('result').style.display = 'block';

    } catch (error) {
        alert("Fehler beim Abschluss: " + error.message);
    } finally {
        showLoading(false);
    }
}

function showLoading(state) {
    document.getElementById('spinner').style.display = state ? 'block' : 'none';
}
</script>

</body>
</html>
