async function glaggleSearch() {
    const query = document.getElementById('glaggleQuery').value.trim();
    if (!query) return;

    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?q=' + encodeURIComponent(query);
    window.history.pushState({ path: newUrl }, '', newUrl);

    if (window.Notification && Notification.permission === "default") {
        Notification.requestPermission().catch(console.error);
    }

    executeSearch(query);
}

async function executeSearch(query) {
    const resultsDiv = document.getElementById('glaggleResults');
    const loader = document.getElementById('glaggleLoader');
    
    resultsDiv.innerHTML = "";
    loader.style.display = "block";

    checkWidgets(query);
    resultsDiv.appendChild(createAiPlaceholder());

    try {
        await Promise.allSettled([
            fetchGroqAI(query),
            searchSupabase(query),
            searchGlaggleImages(query),
            (async () => {
                try {
                    const favs = await getAiProcessedFavs(query);
                    if(favs) favs.forEach(res => renderResult(res.title, res.desc, res.url, "fav"));
                } catch (e) { console.error("Fav-Fehler", e); }
            })(),
            searchWikipedia(query, 'de').catch(e => console.error("Wiki-Fehler", e))
        ]);
    } catch (e) {
        console.error("Kritischer Fehler:", e);
    } finally {
        loader.style.display = "none";
    }
}

// --- 4. SUPABASE ---
async function searchSupabase(query) {
    try {
        const { data, error } = await supabaseClient
            .from('search_index')
            .select('*')
            .or(`title.ilike.%${query}%,description.ilike.%${query}%,url.ilike.%${query}%`)
            .limit(10);

        if (data) {
            data.forEach(item => {
                renderResult(item.title, item.description || "", item.url, "web");
            });
        }
    } catch (e) {
        console.error("Supabase Fehler:", e);
    }
}

// --- 5. WIKIPEDIA ---
async function searchWikipedia(query, lang) {
    try {
        const url = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=200&exintro&explaintext&exsentences=3&format=json&origin=*`;
        const response = await fetch(url);
        const data = await response.json();
        if(data.query && data.query.pages) {
            Object.values(data.query.pages).forEach(page => {
                const wikiUrl = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;
                const thumb = page.thumbnail ? page.thumbnail.source : null;
                let shortExtract = page.extract || "";
                if (shortExtract.length > 250) shortExtract = shortExtract.substring(0, 250) + "...";
                const content = thumb ? `<img src="${thumb}" style="float:left; margin:0 15px 10px 0; border-radius:8px; width:80px; height:auto;">${shortExtract}` : shortExtract;
                renderResult(page.title, content, wikiUrl, "wiki");
            });
        }
    } catch (e) { console.error("Wiki Fehler", e); }
}

// --- 6. AI & GROQ ---
async function fetchGroqAI(query) {
    const aiTextElement = document.getElementById('ai-text');
    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({ 
                model: "llama-3.1-8b-instant", 
                messages: [
                    { role: "system", content: "Du bist Glaggle AI. Antworte kurz, präzise auf Deutsch." },
                    { role: "user", content: query }
                ] 
            })
        });
        const data = await res.json();
        const antwort = data.choices[0].message.content;
        aiTextElement.style.fontStyle = "normal";
        let i = 0; let currentText = "";
        function type() {
            if (i < antwort.length) {
                currentText += antwort.charAt(i);
                aiTextElement.innerHTML = marked.parse(currentText);
                i++; setTimeout(type, 1);
            }
        }
        type();
    } catch (e) { aiTextElement.innerText = "Zusammenfassung nicht verfügbar."; }
}

async function getAiProcessedFavs(query) {
    const q = query.toLowerCase().trim();
    if (q.length < 3) return []; 
    const sofort = meineLieblingsSeiten.filter(s => s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
    try {
        const context = meineLieblingsSeiten.map(s => `App: ${s.title}, Info: ${s.desc}`).join(" | ");
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.1-8b-instant",
                messages: [{ role: "system", content: `App-Finder JSON-Array. Kontext: [${context}]` }, { role: "user", content: q }],
                temperature: 0.1
            })
        });
        const data = await res.json();
        if (!data.choices) return sofort;
        const content = data.choices[0].message.content;
        const start = content.indexOf("[");
        const end = content.lastIndexOf("]") + 1;
        let aiFavs = (start !== -1) ? JSON.parse(content.substring(start, end)) : [];
        const gesamt = [...sofort];
        aiFavs.forEach(af => { if(!gesamt.find(g => g.title.toLowerCase() === af.title.toLowerCase())) gesamt.push(af); });
        return gesamt;
    } catch(e) { return sofort; }
}

// --- 7. RENDER LOGIK ---
function renderResult(title, text, url, type = "web") {
    const resultsDiv = document.getElementById('glaggleResults');
    const domain = new URL(url).hostname.replace('www.', '');
    const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
    const div = document.createElement('div');
    div.className = (type === "fav") ? 'glaggle-entry fav-project' : 'glaggle-entry';

    div.innerHTML = `
        <div class="result-header">
            <img src="${favicon}" class="favicon" onerror="this.style.display='none'">
            <small style="color: #34a853; font-weight:bold;">${type === "fav" ? "✨ EMPFEHLUNG" : domain}</small>
        </div>
        <a href="${url}" target="_blank" style="${type === 'fav' ? 'font-size: 1.3rem;' : ''}">${title}</a>
        <p>${text.replace(/<\/?[^>]+(>|$)/g, "")}</p>
    `;
    const aiBox = document.getElementById('ai-container');
    if (type === "fav" && aiBox) { aiBox.after(div); } else { resultsDiv.appendChild(div); }
}

// --- 8. OPTIMIERUNG ---
async function optimizeSearch() {
    const inputField = document.getElementById('glaggleQuery');
    const query = inputField.value.trim();
    if (!query) return;
    const magicBtn = document.querySelector('.ai-magic-btn');
    magicBtn.innerText = "⏳";
    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer " + getGKey(), "Content-Type": "application/json" },
            body: JSON.stringify({ 
                model: "llama-3.1-8b-instant", 
                messages: [{ role: "system", content: "Optimiere Suchbegriff (2-4 Wörter). Nur Ergebnis." }, { role: "user", content: query }] 
            })
        });
        const data = await res.json();
        inputField.value = data.choices[0].message.content.replace(/"/g, '');
        glaggleSearch();
    } catch (e) { console.error(e); } finally { magicBtn.innerText = "✨"; }
}

// --- 9. WIDGETS ---
function checkWidgets(query) {
    const q = query.toLowerCase();
    const mathRegex = /^[0-9+\-*/().\s^%]+$/;
    if (q === "rechner" || q === "calculator") { renderCalculatorWidget(""); return true; }
    if (mathRegex.test(q) && /[0-9]/.test(q) && /[+\-*/^%]/.test(q)) { renderCalculatorWidget(q); return true; }
    if (q === "timer" || q.includes("minuten")) {
        const mins = q.match(/\d+/) ? parseInt(q.match(/\d+/)[0]) : 0;
        renderTimerWidget(mins); return true;
    }
    return false;
}

function renderTimerWidget(initialMinutes) {
    const resultsDiv = document.getElementById('glaggleResults');
    let totalSeconds = initialMinutes * 60;
    let interval = null;
    const div = document.createElement('div');
    div.className = 'glaggle-entry fav-project';
    div.style.textAlign = 'center';
    div.innerHTML = `
        <div style="color: var(--link-color); font-weight: bold;">Glaggle Timer</div>
        <input type="text" id="timer-display-input" value="${Math.floor(totalSeconds/60).toString().padStart(2,'0')}:${(totalSeconds%60).toString().padStart(2,'0')}" style="background:transparent; border:none; color:white; font-size:3rem; text-align:center; width:100%;">
        <button id="timer-run-btn" style="padding:10px; background:#34A853; color:white; border:none; border-radius:20px; cursor:pointer;">START</button>
        <audio id="timer-audio" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    `;
    resultsDiv.prepend(div);
    const runBtn = div.querySelector('#timer-run-btn');
    const display = div.querySelector('#timer-display-input');
    const audio = div.querySelector('#timer-audio');

    runBtn.onclick = () => {
        if (interval) { clearInterval(interval); interval = null; runBtn.innerText = "WEITER"; }
        else {
            interval = setInterval(() => {
                if (totalSeconds <= 0) { clearInterval(interval); audio.play(); runBtn.innerText = "STOP"; return; }
                totalSeconds--;
                display.value = Math.floor(totalSeconds/60).toString().padStart(2,'0') + ":" + (totalSeconds%60).toString().padStart(2,'0');
            }, 1000);
            runBtn.innerText = "PAUSE";
        }
    };
}

function renderCalculatorWidget(initialQuery) {
    const resultsDiv = document.getElementById('glaggleResults');
    const div = document.createElement('div');
    div.className = 'glaggle-entry fav-project';
    div.innerHTML = `<div id="calc-display" style="font-size:1.5rem; text-align:right; padding:10px; background:black;">${initialQuery || 0}</div>
                     <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:10px;">
                        ${['7','8','9','/','4','5','6','*','1','2','3','-','0','C','=','+'].map(b => `<button onclick="calcInput('${b}')" style="padding:10px;">${b}</button>`).join('')}
                     </div>`;
    resultsDiv.prepend(div);
}

// Hilfsfunktion für Calculator
window.calcInput = (val) => {
    const d = document.getElementById('calc-display');
    if (val === "=") d.innerText = eval(d.innerText);
    else if (val === "C") d.innerText = "0";
    else d.innerText = (d.innerText === "0" ? "" : d.innerText) + val;
};

// --- 10. BILDER ---
async function searchGlaggleImages(query, offset = 0) {
    const url = `https://de.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=8&gsroffset=${offset}&prop=pageimages&piprop=thumbnail&pithumbsize=1000&format=json&origin=*`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.query) return;
        let grid = document.getElementById('glaggle-image-grid');
        if (!grid) {
            const wrapper = document.createElement('div');
            wrapper.className = 'glaggle-entry fav-project';
            wrapper.innerHTML = `<div id="glaggle-image-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px;"></div>`;
            document.getElementById('glaggleResults').appendChild(wrapper);
            grid = document.getElementById('glaggle-image-grid');
        }
        Object.values(data.query.pages).forEach(p => {
            if (p.thumbnail) {
                const img = document.createElement('img');
                img.src = p.thumbnail.source;
                img.style.width = "100%"; img.style.borderRadius = "8px";
                grid.appendChild(img);
            }
        });
    } catch(e) {}
}
