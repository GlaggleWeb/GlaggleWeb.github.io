<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Glaggle</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fafafa; padding: 20px; }
        .search-box { max-width: 600px; margin: 50px auto; text-align: center; }
        input { width: 80%; padding: 15px; border-radius: 30px; border: 1px solid #dfe1e5; font-size: 16px; outline: none; box-shadow: 0 1px 6px rgba(32,33,36,0.28); }
        #results { max-width: 700px; margin: 0 auto; }
        .entry { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ebebeb; }
        .entry a { color: #1a0dab; text-decoration: none; font-size: 18px; }
        .entry p { color: #4d5156; line-height: 1.5; }
    </style>
</head>
<body>

<div class="search-box">
    <h1>WebSearch Pro</h1>
    <input type="text" id="query" placeholder="Was möchtest du finden?" onkeypress="if(event.key === 'Enter') startSearch()">
</div>

<div id="results"></div>

<script>
async function startSearch() {
    const query = document.getElementById('query').value;
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = "Suche läuft...";

    try {
        // Wir nutzen die DuckDuckGo API (JSON Format)
        // Hinweis: DuckDuckGo liefert primär "Instant Answers" (Lexikon-Einträge)
        const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1`);
        const data = await response.json();

        resultsDiv.innerHTML = "";

        // Falls DuckDuckGo eine direkte Antwort (Abstract) hat:
        if (data.AbstractText) {
            resultsDiv.innerHTML += `
                <div class="entry">
                    <a href="${data.AbstractURL}" target="_blank"><h3>${data.Heading}</h3></a>
                    <p>${data.AbstractText}</p>
                    <small>Quelle: ${data.AbstractSource}</small>
                </div>`;
        } 
        
        // Verwandte Themen anzeigen
        data.RelatedTopics.slice(0, 5).forEach(topic => {
            if (topic.Text) {
                resultsDiv.innerHTML += `
                    <div class="entry">
                        <a href="${topic.FirstURL}" target="_blank"><h3>Mehr zu diesem Thema</h3></a>
                        <p>${topic.Text}</p>
                    </div>`;
            }
        });

        if (resultsDiv.innerHTML === "") {
            resultsDiv.innerHTML = "Keine direkten Treffer gefunden. Versuche es mit Begriffen wie 'Apple', 'Berlin' oder 'JavaScript'.";
        }

    } catch (error) {
        resultsDiv.innerHTML = "Fehler bei der Verbindung zur API.";
        console.error(error);
    }
}
</script>

</body>
</html>
