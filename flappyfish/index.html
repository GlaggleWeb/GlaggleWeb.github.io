<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Flappyfish</title>
    <style>
        :root {
            --bg-color: #0b2d41; /* Tiefsee Blau */
            --text-color: #ffffff;
            --nav-bg: #1a4b66;
            --card-bg: #1a4b66;
            --card-border: #2E94D1;
            --accent: #70C4F7;
            --danger: #FF6B6B;
            --coin-gold: #FFD700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .nav-logo { height: 35px; }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 400px; 
            background: linear-gradient(to bottom, #1a4b66, #0b2d41);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px);
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #2E94D1; margin-bottom: 10px;
            width: 200px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #2E94D1; }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent);
            box-shadow: none;
        }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .coin-img { width: 24px; height: 24px; object-fit: contain; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); border-color: #FFD700; }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/" style="text-decoration: none;"><img src="glagglelogo.png" class="nav-logo" alt="Logo" onerror="this.style.display='none'"></a>
        <div style="color: var(--accent); font-weight: bold;">Glaggle Flappyfish</div>
        <div style="font-size: 24px;">🐙</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Tiefe <b id="score">0m</b></div>
            <div class="score-val">Rekord <b id="highscore">0m</b></div>
        </div>

        <div id="game-container">
            <canvas id="fishCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">🌊 Tauch ab!</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.8;">Halte zum Aufsteigen,<br>lass los zum Sinken!</p>
                
                <button class="btn" onclick="startGame(event)">Starten</button>
                
                <a href="https://glaggle.ch/gamecenter" class="btn btn-secondary">
                    Game Center 🏠
                </a>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="coin.png" class="coin-img" alt="Coin" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu-overlay');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const coinEl = document.getElementById('coin-count');
        const container = document.getElementById('game-container');

        let gameRunning = false;
        let score = 0;
        let highscore = localStorage.getItem('glaggleFishHighscore') || 0;
        let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;
        
        highscoreEl.innerText = highscore + "m";
        coinEl.innerText = coins;

        const fish = {
            x: 80,
            y: 200,
            radius: 18,
            vy: 0,
            gravity: 0.25,
            lift: -0.6,
            isLifting: false
        };

        let obstacles = [];
        let bubbles = [];
        let gameSpeed = 3;
        let frameCount = 0;

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        window.onresize = resize;
        resize();

        const handleInput = (active) => { fish.isLifting = active; };
        
        container.onmousedown = () => handleInput(true);
        container.onmouseup = () => handleInput(false);
        // Ersetze die alten Touch-Zeilen durch diese:
container.ontouchstart = (e) => { 
    // Wenn das Ziel des Klicks ein Button ist, tu nichts und lass den Klick durch
    if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
    
    e.preventDefault(); 
    handleInput(true); 
};

container.ontouchend = (e) => { 
    if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
    
    e.preventDefault(); 
    handleInput(false); 
};
        window.onkeydown = (e) => { if(e.code === "Space") handleInput(true); };
        window.onkeyup = (e) => { if(e.code === "Space") handleInput(false); };

        function startGame(e) {
            if(e) e.stopPropagation();
            score = 0;
            gameSpeed = 3;
            obstacles = [];
            bubbles = [];
            fish.y = canvas.height / 2;
            fish.vy = 0;
            gameRunning = true;
            menu.style.display = "none";
            requestAnimationFrame(gameLoop);
        }

        function createObstacle() {
            const minGap = 130;
            const gap = Math.max(110, minGap - (score / 15));
            const margin = 40;
            const pos = Math.random() * (canvas.height - gap - margin * 2) + margin;
            
            obstacles.push({
                x: canvas.width,
                top: pos,
                bottom: pos + gap,
                width: 45,
                passed: false
            });
        }

        function gameLoop() {
            if(!gameRunning) return;

            if(fish.isLifting) {
                fish.vy += fish.lift;
            } else {
                fish.vy += fish.gravity;
            }
            
            fish.vy *= 0.98;
            fish.y += fish.vy;

            if(fish.y - fish.radius < 0) {
                fish.y = fish.radius;
                fish.vy = 0;
            }
            if(fish.y + fish.radius > canvas.height) {
                gameOver();
            }

            if(frameCount % 100 === 0) createObstacle();
            
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;

                const hitTop = fish.x + fish.radius > obs.x && 
                             fish.x - fish.radius < obs.x + obs.width && 
                             fish.y - fish.radius < obs.top;
                             
                const hitBottom = fish.x + fish.radius > obs.x && 
                                fish.x - fish.radius < obs.x + obs.width && 
                                fish.y + fish.radius > obs.bottom;

                if(hitTop || hitBottom) gameOver();

                if(!obs.passed && obs.x + obs.width < fish.x) {
                    obs.passed = true;
                    score++;
                    scoreEl.innerText = score + "m";
                    gameSpeed += 0.04;
                }

                if(obs.x + obs.width < 0) obstacles.splice(i, 1);
            });

            if(frameCount % 12 === 0) {
                bubbles.push({ x: canvas.width, y: Math.random() * canvas.height, r: Math.random() * 4 + 1, s: Math.random() * 2 + 1 });
            }
            bubbles.forEach((b, i) => {
                b.x -= gameSpeed + b.s;
                if(b.x < -10) bubbles.splice(i, 1);
            });

            draw();
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = "#2ecc71";
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.roundRect(obs.x, -20, obs.width, obs.top + 20, [0, 0, 12, 12]);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.bottom, obs.width, canvas.height - obs.bottom + 20, [12, 12, 0, 0]);
                ctx.fill();
            });

            ctx.save();
            ctx.translate(fish.x, fish.y);
            ctx.rotate(Math.min(0.5, Math.max(-0.5, fish.vy * 0.08)));
            
            // Körper
            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.ellipse(0, 0, fish.radius + 5, fish.radius, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Auge
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(10, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(12, -5, 3, 0, Math.PI * 2);
            ctx.fill();

            // Mund
            ctx.beginPath();
            ctx.arc(8, 5, 5, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            // Schwanzflosse
            ctx.fillStyle = "#FFA500";
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(-26, -12);
            ctx.lineTo(-26, 12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            
            if(score >= 5) {
                coins++;
                localStorage.setItem('glaggleCoins', coins);
                coinEl.innerText = coins;
                document.getElementById('coin-display').classList.add('pulse');
                setTimeout(() => document.getElementById('coin-display').classList.remove('pulse'), 500);
            }

            if(score > highscore) {
                highscore = score;
                localStorage.setItem('glaggleFishHighscore', highscore);
                highscoreEl.innerText = highscore + "m";
                document.getElementById('msg').innerText = "🏆 Neuer Rekord!";
            } else {
                document.getElementById('msg').innerText = "Crash! Score: " + score + "m";
            }
            
            menu.style.display = "flex";
        }
    </script>
</body>
</html>
