<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glaggle Flappyfish</title>
    <meta name="description" content="Game das Glaggle Flappyfish Game im Glaggle Design. 100% garantierter Spielspass!">
    <style>
        :root {
            --bg-color: #0b2d41; /* Tiefsee Blau */
            --text-color: #ffffff;
            --nav-bg: #1a4b66;
            --card-bg: #1a4b66;
            --card-border: #2E94D1;
            --accent: #70C4F7;
            --danger: #FF6B6B;
            --coin-gold: #FFD700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%; 
            height: 65px; 
            background-color: var(--nav-bg);
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; 
            top: 0; 
            z-index: 1000;
        }

        .nav-logo { height: 35px; }

        .main-content { margin-top: 85px; width: 100%; max-width: 500px; padding: 15px; text-align: center; }

        #game-container {
            position: relative; 
            width: 100%; 
            height: 400px; 
            background: linear-gradient(to bottom, #1a4b66, #0b2d41);
            border: 4px solid var(--card-border);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: var(--nav-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--card-border);
        }

        .score-val { font-size: 14px; opacity: 0.9; }
        .score-val b { color: var(--accent); font-size: 20px; display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(4px);
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 35px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #2E94D1; margin-bottom: 10px;
            width: 200px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #2E94D1; }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent);
            box-shadow: none;
        }

        #coin-display {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--nav-bg); border: 2px solid var(--accent);
            padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .coin-img { width: 24px; height: 24px; object-fit: contain; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); border-color: #FFD700; }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/" style="text-decoration: none;"><img src="glagglelogo.png" class="nav-logo" alt="Logo" onerror="this.style.display='none'"></a>
        <div style="color: var(--accent); font-weight: bold;">Glaggle Flappyfish</div>
        <div style="font-size: 24px;">🐙</div>
    </div>

    <div class="main-content">
        <div class="score-box">
            <div class="score-val">Tiefe <b id="score">0m</b></div>
            <div class="score-val">Rekord <b id="highscore">0m</b></div>
        </div>

        <div id="game-container">
            <canvas id="fishCanvas"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h1 id="msg">🌊 Tauch ab!</h1>
                <p style="margin-bottom: 20px; font-size: 14px; opacity: 0.8;">Halte zum Aufsteigen,<br>lass los zum Sinken!</p>
                
                <button class="btn" onclick="startGame(event)">Starten</button>
                
                <a href="https://glaggle.ch/gamecenter" class="btn btn-secondary">
                    Game Center 🏠
                </a>
            </div>
        </div>
    </div>

    <div id="coin-display">
        <img src="coin.png" class="coin-img" alt="Coin" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22gold%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
        <span id="coin-count">0</span>
    </div>

    <button id="music-toggle" onclick="toggleMusic(event)" style="position: fixed; bottom: 20px; left: 20px; background: var(--nav-bg); border: 2px solid var(--accent); color: white; padding: 10px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; font-size: 20px;">
    🔈
</button>

    <script>
       const canvas = document.getElementById('fishCanvas');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu-overlay');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const coinEl = document.getElementById('coin-count');
const container = document.getElementById('game-container');

let gameRunning = false;
let score = 0;
let highscore = localStorage.getItem('glaggleFishHighscore') || 0;
let coins = parseInt(localStorage.getItem('glaggleCoins')) || 0;

highscoreEl.innerText = highscore + "m";
coinEl.innerText = coins;

const fish = {
    x: 80, y: 200, radius: 18, vy: 0,
    gravity: 0.25, lift: -0.6, isLifting: false
};

let obstacles = [];
let bubbles = [];
let gameSpeed = 3;
let frameCount = 0;

function resize() {
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

const handleInput = (active) => { if(gameRunning) fish.isLifting = active; };

container.addEventListener('mousedown', (e) => {
    if (e.target.closest('button') || e.target.closest('a')) return;
    handleInput(true);
});
window.addEventListener('mouseup', () => handleInput(false));

container.addEventListener('touchstart', (e) => { 
    if (e.target.closest('button') || e.target.closest('a')) return;
    e.preventDefault(); 
    handleInput(true); 
}, {passive: false});
container.addEventListener('touchend', () => handleInput(false), {passive: false});

window.addEventListener('keydown', (e) => { if(e.code === "Space") handleInput(true); });
window.addEventListener('keyup', (e) => { if(e.code === "Space") handleInput(false); });

// --- MUSIK SETUP ---
// Ein stabiler Ersatz-Link, falls deine Datei lokal fehlt
// Diese URL ist für Tests freigegeben und wird nicht blockiert
const musicURL = 'https://storage.googleapis.com/media-session/elephants-dream/the-wires.mp3';
const bgMusic = new Audio(musicURL); 
bgMusic.loop = true;
bgMusic.volume = 0.3; 

let musicEnabled = false;

function toggleMusic(e) {
    if(e) e.stopPropagation();
    const btn = document.getElementById('music-toggle');
    
    if (!bgMusic.paused) {
        bgMusic.pause();
        btn.innerText = "🔈";
        musicEnabled = false;
    } else {
        bgMusic.play().catch(err => console.log("Abspielen fehlgeschlagen"));
        btn.innerText = "🔊";
        musicEnabled = true;
    }
}

function startGame(e) {
    if(e) e.stopPropagation();
    
    // MUSIK DIREKT STARTEN
    // Wir laden die Musik kurz vor dem Abspielen sicherheitshalber neu
    bgMusic.play().then(() => {
        musicEnabled = true;
        document.getElementById('music-toggle').innerText = "🔊";
    }).catch(err => {
        // Falls der Link oben auch mal nicht geht, loggen wir es
        console.log("Audio-Start fehlgeschlagen. Grund:", err.message);
    });

    score = 0;
    gameSpeed = 3;
    obstacles = [];
    bubbles = [];
    fish.y = canvas.height / 2;
    fish.vy = 0;
    scoreEl.innerText = "0m";
    gameRunning = true;
    menu.style.display = "none";
    frameCount = 0;
    requestAnimationFrame(gameLoop);
}

function createObstacle() {
    const minGap = 130;
    const gap = Math.max(110, minGap - (score / 15));
    const margin = 40;
    const pos = Math.random() * (canvas.height - gap - margin * 2) + margin;
    obstacles.push({ x: canvas.width, top: pos, bottom: pos + gap, width: 45, passed: false });
}

function gameLoop() {
    if(!gameRunning) return;

    if(fish.isLifting) fish.vy += fish.lift;
    else fish.vy += fish.gravity;
    
    fish.vy *= 0.98;
    fish.y += fish.vy;

    if(fish.y - fish.radius < 0) { fish.y = fish.radius; fish.vy = 0; }
    if(fish.y + fish.radius > canvas.height) { gameOver(); return; }

    if(frameCount % 100 === 0) createObstacle();
    
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;
        const hitTop = fish.x + fish.radius > obs.x && fish.x - fish.radius < obs.x + obs.width && fish.y - fish.radius < obs.top;
        const hitBottom = fish.x + fish.radius > obs.x && fish.x - fish.radius < obs.x + obs.width && fish.y + fish.radius > obs.bottom;

        if(hitTop || hitBottom) { gameOver(); return; }
        if(!obs.passed && obs.x + obs.width < fish.x) {
            obs.passed = true;
            score++;
            scoreEl.innerText = score + "m";
            gameSpeed += 0.04;
        }
        if(obs.x + obs.width < 0) obstacles.splice(i, 1);
    }

    if(frameCount % 12 === 0) bubbles.push({ x: canvas.width, y: Math.random() * canvas.height, r: Math.random() * 4 + 1, s: Math.random() * 2 + 1 });
    for (let i = bubbles.length - 1; i >= 0; i--) {
        bubbles[i].x -= gameSpeed + bubbles[i].s;
        if(bubbles[i].x < -10) bubbles.splice(i, 1);
    }

    draw();
    frameCount++;
    requestAnimationFrame(gameLoop);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); });

    ctx.fillStyle = "#2ecc71";
    obstacles.forEach(obs => {
        ctx.beginPath();
        if(ctx.roundRect) {
            ctx.roundRect(obs.x, -20, obs.width, obs.top + 20, [0, 0, 12, 12]);
            ctx.roundRect(obs.x, obs.bottom, obs.width, canvas.height - obs.bottom + 20, [12, 12, 0, 0]);
        } else {
            ctx.rect(obs.x, 0, obs.width, obs.top);
            ctx.rect(obs.x, obs.bottom, obs.width, canvas.height);
        }
        ctx.fill();
    });

    ctx.save();
    ctx.translate(fish.x, fish.y);
    ctx.rotate(Math.min(0.5, Math.max(-0.5, fish.vy * 0.08)));
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.ellipse(0, 0, fish.radius + 5, fish.radius, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(10, -5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(12, -5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 5, 5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.fillStyle = "#FFA500"; ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-26, -12); ctx.lineTo(-26, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
}

function gameOver() {
    gameRunning = false;
    
    // Coin Logik
    if(score >= 5) {
        let currentCoins = parseInt(localStorage.getItem('glaggleCoins')) || 0;
        currentCoins++;
        localStorage.setItem('glaggleCoins', currentCoins);
        document.getElementById('coin-count').innerText = currentCoins;
        // ... Animation ...
    }

    // WICHTIG: Der Key muss exakt "flappyfish_highscore" sein
    const storageKey = 'flappyfish_highscore'; 
    let currentHighscore = parseInt(localStorage.getItem(storageKey)) || 0;

    if(score > currentHighscore) {
        localStorage.setItem(storageKey, score);
        highscoreEl.innerText = score + "m";
        document.getElementById('msg').innerText = "🏆 Neuer Rekord!";
    } else {
        document.getElementById('msg').innerText = "Crash! Tiefe: " + score + "m";
    }
    
    menu.style.display = "flex";
}
    </script>
</body>
</html>
